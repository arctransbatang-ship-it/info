<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>ARC TRANS - Data Booking</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

:root {
    --primary: #2196F3;
    --primary-dark: #1976D2;
    --secondary: #21CBF3;

    --success: #16a34a;
    --danger: #dc2626;
    --warning: #f59e0b;

    --text: #1e293b;
    --muted: #64748b;
    --border: #dbe3ee;
    --background: #f1f5f9;
}

body {

    margin: 0;

    min-height: 100vh;

    background:
        linear-gradient(
            135deg,
            #eef6ff,
            #f8fafc
        );

    color: var(--text);
}


/* =========================================================
   HOME
========================================================= */

.home-btn {

    position: fixed;

    top: 14px;
    left: 16px;

    z-index: 2000;

    display: inline-flex;

    align-items: center;
    justify-content: center;

    gap: 7px;

    padding:
        9px 16px;

    border-radius: 30px;

    background: rgba(
        255,
        255,
        255,
        0.95
    );

    color: var(--primary-dark);

    text-decoration: none;

    font-size: 14px;

    font-weight: 700;

    box-shadow:
        0 5px 20px
        rgba(
            0,
            0,
            0,
            0.12
        );

    transition: .2s;
}

.home-btn:hover {

    transform:
        translateY(-2px);

    box-shadow:
        0 8px 25px
        rgba(
            0,
            0,
            0,
            0.18
        );
}


/* =========================================================
   NAVBAR
========================================================= */

.navbar {

    position: relative;

    min-height: 150px;

    display: flex;

    align-items: center;
    justify-content: center;

    padding:
        35px 20px;

    background:
        linear-gradient(
            135deg,
            #0d47a1,
            #2196F3,
            #21c6f3
        );

    color: white;

    overflow: hidden;

    box-shadow:
        0 4px 20px
        rgba(
            33,
            150,
            243,
            .25
        );
}

.navbar::before {

    content: "";

    position: absolute;

    width: 300px;
    height: 300px;

    border-radius: 50%;

    background:
        rgba(
            255,
            255,
            255,
            .10
        );

    top: -180px;
    right: -80px;
}

.navbar::after {

    content: "";

    position: absolute;

    width: 220px;
    height: 220px;

    border-radius: 50%;

    background:
        rgba(
            255,
            255,
            255,
            .08
        );

    bottom: -150px;
    left: 10%;
}

.logo {

    position: relative;

    z-index: 2;

    font-size:
        clamp(
            22px,
            4vw,
            32px
        );

    font-weight: 800;

    letter-spacing: 1px;

    text-align: center;

    text-shadow:
        0 2px 10px
        rgba(
            0,
            0,
            0,
            .15
        );
}


/* =========================================================
   CONTAINER
========================================================= */

.container {

    width: 100%;

    max-width: 1800px;

    margin: auto;

    padding:
        25px
        clamp(
            15px,
            4vw,
            40px
        )
        40px;
}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar {

    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 15px;

    margin-bottom: 22px;

    flex-wrap: wrap;
}

#searchInput {

    width: 100%;

    max-width: 450px;

    padding:
        14px 18px;

    border:
        1px solid
        #dce6f0;

    border-radius: 14px;

    outline: none;

    background: white;

    font-size: 14px;

    box-shadow:
        0 4px 15px
        rgba(
            0,
            0,
            0,
            .04
        );
}

#searchInput:focus {

    border-color:
        var(--primary);

    box-shadow:
        0 0 0 4px
        rgba(
            33,
            150,
            243,
            .12
        );
}


/* =========================================================
   BUTTON
========================================================= */

button {

    border: none;

    cursor: pointer;

    font-size: 13px;

    font-weight: 700;

    border-radius: 10px;

    transition: .2s;
}

button:hover {

    transform:
        translateY(-2px);
}

button:disabled {

    opacity: .6;

    cursor:
        not-allowed;

    transform: none;
}

#btnDownload {

    display: none;

    padding:
        12px 20px;

    color: white;

    background:
        linear-gradient(
            135deg,
            #2e7d32,
            #4CAF50
        );
}


/* =========================================================
   TABLE
========================================================= */

.table-container {

    width: 100%;

    overflow-x: auto;

    background: white;

    border-radius: 20px;

    box-shadow:
        0 10px 35px
        rgba(
            0,
            0,
            0,
            .08
        );

    border:
        1px solid
        #edf1f5;
}

table {

    width: 100%;

    min-width: 1700px;

    border-collapse:
        separate;

    border-spacing: 0;
}

th {

    background:
        linear-gradient(
            135deg,
            #1976D2,
            #2196F3
        );

    color: white;

    padding:
        16px 14px;

    text-align: center;

    white-space: nowrap;

    font-size: 13px;

    font-weight: 700;

    position: sticky;

    top: 0;

    z-index: 5;
}

th:first-child {

    border-top-left-radius:
        18px;
}

th:last-child {

    border-top-right-radius:
        18px;
}

td {

    padding:
        14px;

    border-bottom:
        1px solid
        #edf1f5;

    text-align: center;

    vertical-align: middle;

    white-space: nowrap;

    font-size: 13px;
}

tbody tr:hover {

    background:
        #f5faff;
}


/* =========================================================
   STATUS
========================================================= */

.status {

    display: inline-flex;

    align-items: center;
    justify-content: center;

    padding:
        7px 13px;

    border-radius: 20px;

    font-size: 11px;

    font-weight: 800;
}

.status-booking {

    color: #1565C0;

    background:
        #E3F2FD;

    border:
        1px solid
        #90CAF9;
}


/* =========================================================
   ACTION BUTTON
========================================================= */

.action-buttons {

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 7px;

    flex-wrap: wrap;
}

.btn-edit,
.btn-delete,
.btn-process {

    padding:
        8px 12px;

    color: white;

    border-radius: 9px;

    font-size: 11px;

    font-weight: 700;
}

.btn-edit {

    background:
        linear-gradient(
            135deg,
            #1976D2,
            #2196F3
        );
}

.btn-delete {

    background:
        linear-gradient(
            135deg,
            #b91c1c,
            #ef4444
        );
}

.btn-process {

    background:
        linear-gradient(
            135deg,
            #15803d,
            #22c55e
        );
}


/* =========================================================
   EMPTY
========================================================= */

.empty-data {

    padding:
        50px;

    text-align: center;

    color:
        #78909C;

    font-size:
        15px;
}


/* =========================================================
   PAGINATION
========================================================= */

#pagination {

    margin-top:
        25px;

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 12px;

    flex-wrap: wrap;
}

.page-btn {

    padding:
        10px 18px;

    color: white;
}

.prev-btn {

    background:
        linear-gradient(
            135deg,
            #fb8c00,
            #ff9800
        );
}

.next-btn {

    background:
        linear-gradient(
            135deg,
            #2e7d32,
            #4CAF50
        );
}

.page-info {

    padding:
        10px 16px;

    background:
        white;

    border-radius:
        12px;

    font-size:
        13px;

    font-weight:
        700;

    color:
        #546E7A;

    box-shadow:
        0 4px 15px
        rgba(
            0,
            0,
            0,
            .06
        );
}


/* =========================================================
   MODAL
========================================================= */

.modal {

    position: fixed;

    inset: 0;

    z-index: 5000;

    display: none;

    align-items: center;
    justify-content: center;

    padding:
        20px;

    background:
        rgba(
            15,
            23,
            42,
            .65
        );

    backdrop-filter:
        blur(5px);
}

.modal.show {

    display: flex;
}

.modal-content {

    width: 100%;

    max-width:
        900px;

    max-height:
        94vh;

    overflow-y: auto;

    background:
        white;

    border-radius:
        22px;

    box-shadow:
        0 25px 70px
        rgba(
            0,
            0,
            0,
            .25
        );

    animation:
        modalIn
        .25s
        ease;
}

@keyframes modalIn {

    from {

        opacity: 0;

        transform:
            translateY(20px)
            scale(.98);
    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}

.modal-header {

    position: sticky;

    top: 0;

    z-index: 5;

    display: flex;

    align-items: center;
    justify-content: space-between;

    padding:
        18px 24px;

    color: white;

    background:
        linear-gradient(
            135deg,
            #1976D2,
            #2196F3,
            #21CBF3
        );
}

.modal-header h2 {

    margin: 0;

    font-size:
        19px;
}

.close-modal {

    width: 38px;
    height: 38px;

    display: flex;

    align-items: center;
    justify-content: center;

    color: white;

    background:
        rgba(
            255,
            255,
            255,
            .18
        );

    border-radius:
        50%;

    font-size:
        20px;
}

.modal-body {

    padding:
        25px;
}


/* =========================================================
   FORM
========================================================= */

.form-grid {

    display: grid;

    grid-template-columns:
        repeat(
            2,
            minmax(
                0,
                1fr
            )
        );

    gap:
        18px;
}

.form-group {

    width: 100%;
}

.full-width {

    grid-column:
        1 / -1;
}

label {

    display: block;

    margin-bottom:
        7px;

    font-size:
        13px;

    font-weight:
        700;

    color:
        #334155;
}

input,
select {

    width: 100%;

    min-height:
        46px;

    padding:
        11px 13px;

    border:
        1px solid
        var(--border);

    border-radius:
        11px;

    outline:
        none;

    background:
        white;

    font-size:
        14px;
}

input:focus,
select:focus {

    border-color:
        var(--primary);

    box-shadow:
        0 0 0 4px
        rgba(
            33,
            150,
            243,
            .12
        );
}

input[readonly] {

    background:
        #f8fafc;
}


/* =========================================================
   FORM INFO
========================================================= */

.info-box {

    display: none;

    margin-top:
        9px;

    padding:
        10px 13px;

    border-radius:
        10px;

    font-size:
        12px;

    font-weight:
        700;
}

.info-box.show {

    display:
        block;
}

.info-success {

    color:
        #166534;

    background:
        #dcfce7;
}

.info-warning {

    color:
        #92400e;

    background:
        #fef3c7;
}

.info-danger {

    color:
        #991b1b;

    background:
        #fee2e2;
}


/* =========================================================
   PAYMENT INFO
========================================================= */

.payment-info {

    display: none;

    margin-top:
        8px;

    padding:
        12px;

    border-radius:
        10px;

    font-size:
        13px;

    font-weight:
        700;
}

.payment-info.show {

    display:
        block;
}

.payment-lunas {

    color:
        #15803d;

    background:
        #dcfce7;
}

.payment-kurang {

    color:
        #92400e;

    background:
        #fef3c7;
}

.payment-lebih {

    color:
        #1d4ed8;

    background:
        #dbeafe;
}


/* =========================================================
   UPLOAD
========================================================= */

.preview-image {

    width: 100%;

    max-height:
        250px;

    object-fit:
        contain;

    display:
        none;

    margin-top:
        10px;

    padding:
        6px;

    border:
        2px dashed
        var(--primary);

    border-radius:
        12px;
}

.preview-gallery {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(
                120px,
                1fr
            )
        );

    gap:
        10px;

    margin-top:
        10px;
}

.preview-gallery img {

    width: 100%;

    height:
        120px;

    object-fit:
        cover;

    border:
        2px dashed
        var(--primary);

    border-radius:
        10px;

    padding:
        3px;
}

.upload-status {

    min-height:
        18px;

    margin-top:
        7px;

    color:
        var(--muted);

    font-size:
        12px;
}


/* =========================================================
   MODAL FOOTER
========================================================= */

.modal-footer {

    display: flex;

    justify-content:
        flex-end;

    gap:
        10px;

    padding:
        18px 25px;

    border-top:
        1px solid
        #edf1f5;

    background:
        #f8fafc;
}

.btn-cancel {

    padding:
        12px 20px;

    color:
        #475569;

    background:
        #e2e8f0;
}

.btn-save {

    padding:
        12px 22px;

    color:
        white;

    background:
        linear-gradient(
            135deg,
            #1976D2,
            #2196F3
        );
}

.btn-rent {

    width: 100%;

    min-height:
        52px;

    color:
        white;

    background:
        linear-gradient(
            135deg,
            #15803d,
            #22c55e
        );

    font-size:
        15px;

    border-radius:
        13px;

    box-shadow:
        0 8px 20px
        rgba(
            22,
            163,
            74,
            .22
        );
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    body {

        background:
            #f4f7fb;
    }

    .home-btn {

        top:
            10px;

        left:
            10px;

        font-size:
            12px;

        padding:
            8px 12px;
    }

    .navbar {

        min-height:
            120px;

        padding-top:
            55px;
    }

    .logo {

        font-size:
            20px;
    }

    .container {

        padding:
            15px 10px 30px;
    }

    .toolbar {

        flex-direction:
            column;

        align-items:
            stretch;
    }

    #searchInput {

        max-width:
            none;
    }

    #btnDownload {

        width:
            100%;
    }

    .table-container {

        background:
            transparent;

        box-shadow:
            none;

        border:
            none;

        overflow:
            visible;
    }

    table {

        min-width:
            0;

        width:
            100%;
    }

    thead {

        display:
            none;
    }

    tbody {

        display:
            block;
    }

    tbody tr {

        display:
            block;

        width:
            100%;

        margin-bottom:
            15px;

        padding:
            10px 14px;

        background:
            white;

        border:
            1px solid
            #edf1f5;

        border-radius:
            18px;

        box-shadow:
            0 6px 20px
            rgba(
                0,
                0,
                0,
                .07
            );
    }

    td {

        display:
            flex;

        align-items:
            center;

        justify-content:
            space-between;

        gap:
            15px;

        padding:
            11px 5px;

        text-align:
            right;

        white-space:
            normal;

        border-bottom:
            1px solid
            #eef2f5;
    }

    td::before {

        content:
            attr(data-label);

        flex:
            0 0 42%;

        text-align:
            left;

        font-weight:
            700;

        color:
            #607D8B;
    }

    td:last-child {

        border-bottom:
            none;
    }

    .action-buttons {

        justify-content:
            flex-end;
    }

    .modal {

        padding:
            10px;
    }

    .modal-content {

        max-height:
            96vh;

        border-radius:
            18px;
    }

    .modal-body {

        padding:
            18px 15px;
    }

    .modal-header {

        padding:
            15px;
    }

    .form-grid {

        grid-template-columns:
            1fr;

        gap:
            15px;
    }

    .full-width {

        grid-column:
            auto;
    }

    .modal-footer {

        padding:
            14px 15px;

        flex-direction:
            column;
    }

    .modal-footer button {

        width:
            100%;
    }

}


/* =========================================================
   LOADING
========================================================= */

.loading {

    position: fixed;

    inset: 0;

    z-index:
        9999;

    display:
        none;

    align-items:
        center;

    justify-content:
        center;

    background:
        rgba(
            15,
            23,
            42,
            .5
        );

    backdrop-filter:
        blur(3px);
}

.loading.show {

    display:
        flex;
}

.loading-box {

    padding:
        25px 35px;

    border-radius:
        18px;

    background:
        white;

    text-align:
        center;

    box-shadow:
        0 20px 50px
        rgba(
            0,
            0,
            0,
            .2
        );
}

.spinner {

    width:
        42px;

    height:
        42px;

    margin:
        0 auto 12px;

    border:
        4px solid
        #dbeafe;

    border-top-color:
        #2196F3;

    border-radius:
        50%;

    animation:
        spin
        .8s linear infinite;
}

@keyframes spin {

    to {

        transform:
            rotate(360deg);
    }
}

</style>

</head>

<body>


<!-- =====================================================
     HOME
===================================================== -->

<a
    href="index.html"
    class="home-btn"
>
    🏠 Home
</a>


<!-- =====================================================
     NAVBAR
===================================================== -->

<nav class="navbar">

    <div class="logo">
        📋 DATA BOOKING KENDARAAN
    </div>

</nav>


<!-- =====================================================
     MAIN
===================================================== -->

<div class="container">

    <div class="toolbar">

        <input
            type="text"
            id="searchInput"
            placeholder="🔍 Cari ID transaksi, customer, unit atau plat..."
        >

        <button
            id="btnDownload"
            onclick="downloadExcel()"
        >
            📥 Download Excel
        </button>

    </div>


    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>No.</th>

                    <th>ID Transaksi</th>

                    <th>Nama Customer</th>

                    <th>Kontak</th>

                    <th>Nama Unit</th>

                    <th>Plat</th>

                    <th>Rental Type</th>

                    <th>Tanggal Sewa</th>

                    <th>Estimasi Kembali</th>

                    <th>Harga</th>

                    <th>Total</th>

                    <th>Status</th>

                    <th>Aksi</th>

                </tr>

            </thead>


            <tbody id="isiData">

                <tr>

                    <td
                        colspan="13"
                        class="empty-data"
                    >
                        Memuat data booking...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>


    <div id="pagination"></div>

</div>


<!-- =====================================================
     MODAL EDIT BOOKING
===================================================== -->

<div
    id="editModal"
    class="modal"
>

    <div class="modal-content">

        <div class="modal-header">

            <h2>
                ✏️ Edit Data Booking
            </h2>

            <button
                class="close-modal"
                onclick="closeEditModal()"
            >
                ×
            </button>

        </div>


        <div class="modal-body">

            <div class="form-grid">


                <div class="form-group">

                    <label>
                        ID Transaksi
                    </label>

                    <input
                        id="editTransaksiId"
                        readonly
                    >

                </div>


                <div class="form-group">

                    <label>
                        ID Unit / Plat
                    </label>

                    <input
                        id="editUnitId"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Nama Unit
                    </label>

                    <input
                        id="editNamaUnit"
                    >

                </div>


                <div class="form-group">

                    <label>
                        ID Customer
                    </label>

                    <input
                        id="editIdCustomer"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Nama Customer
                    </label>

                    <input
                        id="editCustomer"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Kontak / HP
                    </label>

                    <input
                        id="editHp"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Rental Type
                    </label>

                    <select
                        id="editRentalType"
                    >

                        <option value="">
                            -- Pilih --
                        </option>

                        <option value="setengahhari">
                            Setengah Hari
                        </option>

                        <option value="harian">
                            Harian
                        </option>

                        <option value="mingguan">
                            Mingguan
                        </option>

                        <option value="bulanan">
                            Bulanan
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Harga
                    </label>

                    <input
                        id="editHarga"
                        inputmode="numeric"
                        placeholder="Rp 0"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Tanggal Sewa
                    </label>

                    <input
                        type="date"

/* =========================================================
   HELPER
========================================================= */

function escapeHtml(value) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function formatRupiah(value) {

    const number =
        Number(
            value || 0
        );

    return (
        "Rp " +
        number.toLocaleString(
            "id-ID"
        )
    );

}


function angkaDariRupiah(value) {

    return Number(

        String(
            value || ""
        )
        .replace(
            /\D/g,
            ""
        )

    ) || 0;

}


function getTanggalHariIni() {

    const d =
        new Date();

    return (

        d.getFullYear() +
        "-" +
        String(
            d.getMonth() + 1
        ).padStart(
            2,
            "0"
        ) +
        "-" +
        String(
            d.getDate()
        ).padStart(
            2,
            "0"
        )

    );

}


function formatTanggalInput() {

    const d =
        new Date();

    const tanggal =
        String(
            d.getDate()
        ).padStart(
            2,
            "0"
        );

    const bulan =
        String(
            d.getMonth() + 1
        ).padStart(
            2,
            "0"
        );

    const tahun =
        d.getFullYear();

    const jam =
        String(
            d.getHours()
        ).padStart(
            2,
            "0"
        );

    const menit =
        String(
            d.getMinutes()
        ).padStart(
            2,
            "0"
        );

    const detik =
        String(
            d.getSeconds()
        ).padStart(
            2,
            "0"
        );

    return (
        tanggal +
        "/" +
        bulan +
        "/" +
        tahun +
        " " +
        jam +
        ":" +
        menit +
        ":" +
        detik
    );

}

/* =========================================================
   SEARCH
========================================================= */

document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "input",
        applySearch
    );


function applySearch() {

    const keyword =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .toLowerCase()
            .trim();

    filteredData =
        allData.filter(
            item => {

                const text = [

                    item.id,

                    item.transaksiId,

                    item.customer,

                    item.namaCustomer,

                    item.hp,

                    item.plat,

                    item.unitId,

                    item.namaUnit,

                    item.rentaltype,

                    item.rentalType

                ]
                .map(
                    value =>
                        String(
                            value || ""
                        )
                        .toLowerCase()
                )
                .join(" ");

                return text.includes(
                    keyword
                );

            }
        );

    currentPage = 1;

    renderTable();

}


/* =========================================================
   FIREBASE BOOKING
   NODE: booking
========================================================= */

const bookingRef =
    ref(
        db,
        "booking"
    );


onValue(

    bookingRef,

    snapshot => {

        const data =
            snapshot.val();

        if (!data) {

            allData = [];

            filteredData = [];

            showEmptyData(
                "Data booking belum tersedia"
            );

            return;

        }

        allData =
            Object.entries(
                data
            )
            .map(
                ([id, item]) => {

                    return {

                        ...item,

                        id: id

                    };

                }
            )
            .sort(
                (
                    a,
                    b
                ) => {

                    return Number(
                        b.timestamp ||
                        0
                    )
                    -
                    Number(
                        a.timestamp ||
                        0
                    );

                }
            );

        applySearch();

    },

    error => {

        console.error(
            error
        );

        showEmptyData(
            "Gagal mengambil data booking"
        );

    }

);


/* =========================================================
   EMPTY
========================================================= */

function showEmptyData(message) {

    document
        .getElementById(
            "isiData"
        )
        .innerHTML = `

        <tr>

            <td
                colspan="13"
                class="empty-data"
            >

                ${escapeHtml(message)}

            </td>

        </tr>

    `;

    document
        .getElementById(
            "pagination"
        )
        .innerHTML =
        "";

}


/* =========================================================
   RENDER TABLE
========================================================= */

function renderTable() {

    if (
        filteredData.length === 0
    ) {

        showEmptyData(
            "Data booking tidak ditemukan"
        );

        return;

    }

    const totalPages =
        Math.ceil(
            filteredData.length /
            rowsPerPage
        );

    if (
        currentPage > totalPages
    ) {

        currentPage =
            totalPages;

    }

    const start =
        (
            currentPage - 1
        )
        *
        rowsPerPage;

    const end =
        start +
        rowsPerPage;

    const pageData =
        filteredData.slice(
            start,
            end
        );

    let html = "";

    let no =
        start + 1;

    pageData.forEach(
        item => {

            const id =
                item.id ||
                item.transaksiId ||
                "-";

            const customer =
                item.customer ||
                item.namaCustomer ||
                "-";

            const hp =
                item.hp ||
                item.kontak ||
                "-";

            const unitId =
                item.unitId ||
                item.plat ||
                "-";

            const plat =
                item.plat ||
                item.unitId ||
                "-";

            const namaUnit =
                item.namaUnit ||
                item.nama ||
                "-";

            const rentaltype =
                item.rentaltype ||
                item.rentalType ||
                "-";

            const tanggalsewa =
                item.tanggalsewa ||
                item.tanggalSewa ||
                "-";

            const selesaisewa =
                item.selesaisewa ||
                item.tanggalSelesai ||
                "-";

            const harga =
                item.harga ||
                0;

            const total =
                item.total ||
                0;

            html += `

            <tr>

                <td data-label="No.">
                    ${no}
                </td>

                <td data-label="ID Transaksi">
                    ${escapeHtml(id)}
                </td>

                <td data-label="Nama Customer">
                    ${escapeHtml(customer)}
                </td>

                <td data-label="Kontak">
                    ${escapeHtml(hp)}
                </td>

                <td data-label="Nama Unit">
                    ${escapeHtml(namaUnit)}
                </td>

                <td data-label="Plat">
                    ${escapeHtml(plat)}
                </td>

                <td data-label="Rental Type">
                    ${escapeHtml(rentaltype)}
                </td>

                <td data-label="Tanggal Sewa">
                    ${escapeHtml(tanggalsewa)}
                </td>

                <td data-label="Estimasi Kembali">
                    ${escapeHtml(selesaisewa)}
                </td>

                <td data-label="Harga">
                    ${formatRupiah(harga)}
                </td>

                <td data-label="Total">
                    ${formatRupiah(total)}
                </td>

                <td data-label="Status">

                    <span class="status status-booking">
                        📋 BOOKING
                    </span>

                </td>

                <td data-label="Aksi">

                    <div class="action-buttons">

                        <button
                            class="btn-edit"
                            onclick="editBooking('${encodeURIComponent(id)}')"
                        >
                            ✏️ Edit
                        </button>

                        <button
                            class="btn-delete"
                            onclick="deleteBooking('${encodeURIComponent(id)}')"
                        >
                            🗑️ Hapus
                        </button>

                        <button
                            class="btn-process"
                            onclick="processBooking('${encodeURIComponent(id)}')"
                        >
                            🚐 Proses
                        </button>

                    </div>

                </td>

            </tr>

            `;

            no++;

        }
    );

    document
        .getElementById(
            "isiData"
        )
        .innerHTML =
        html;

    renderPagination();

}


/* =========================================================
   PAGINATION
========================================================= */

function renderPagination() {

    const totalPages =
        Math.ceil(
            filteredData.length /
            rowsPerPage
        );

    if (
        totalPages <= 1
    ) {

        document
            .getElementById(
                "pagination"
            )
            .innerHTML =
            "";

        return;

    }

    document
        .getElementById(
            "pagination"
        )
        .innerHTML = `

        <button
            class="page-btn prev-btn"
            onclick="prevPage()"
            ${currentPage === 1 ? "disabled" : ""}
        >
            ← Sebelumnya
        </button>

        <span class="page-info">

            Halaman
            ${currentPage}
            dari
            ${totalPages}

        </span>

        <button
            class="page-btn next-btn"
            onclick="nextPage()"
            ${currentPage === totalPages ? "disabled" : ""}
        >
            Selanjutnya →
        </button>

    `;

}


window.nextPage =
function() {

    const totalPages =
        Math.ceil(
            filteredData.length /
            rowsPerPage
        );

    if (
        currentPage < totalPages
    ) {

        currentPage++;

        renderTable();

    }

};


window.prevPage =
function() {

    if (
        currentPage > 1
    ) {

        currentPage--;

        renderTable();

    }

};

/* =========================================================
   EDIT PAYMENT
========================================================= */

function updateEditPayment() {

    const total =
        angkaDariRupiah(
            document
                .getElementById(
                    "editTotal"
                )
                .value
        );

    const bayar =
        angkaDariRupiah(
            document
                .getElementById(
                    "editBayar"
                )
                .value
        );

    const info =
        document
            .getElementById(
                "editPaymentInfo"
            );

    if (
        total <= 0
    ) {

        info.className =
            "payment-info";

        info.textContent =
            "";

        return;

    }

    if (
        bayar === total
    ) {

        info.className =
            "payment-info show payment-lunas";

        info.textContent =
            "✓ Pembayaran LUNAS";

        return;

    }

    if (
        bayar > total
    ) {

        info.className =
            "payment-info show payment-lebih";

        info.textContent =
            "＋ Kelebihan pembayaran: " +
            formatRupiah(
                bayar - total
            );

        return;

    }

    info.className =
        "payment-info show payment-kurang";

    info.textContent =
        "Sisa pembayaran: " +
        formatRupiah(
            total - bayar
        );

}

function calculateEditTotal() {

    const type =
        document
            .getElementById(
                "editRentalType"
            )
            .value;

    const harga =
        angkaDariRupiah(
            document
                .getElementById(
                    "editHarga"
                )
                .value
        );

    const mulai =
        document
            .getElementById(
                "editTanggalSewa"
            )
            .value;

    const selesai =
        document
            .getElementById(
                "editSelesaiSewa"
            )
            .value;

    const jumlahField =
        document
            .getElementById(
                "editJumlahHari"
            );

    const totalField =
        document
            .getElementById(
                "editTotal"
            );

    if (
        type ===
        "setengahhari"
    ) {

        jumlahField.value =
            "0.5";

        updateEditPayment();

        return;

    }

    if (
        !mulai ||
        !selesai
    ) {

        jumlahField.value =
            "";

        return;

    }

    const date1 =
        new Date(
            mulai +
            "T00:00:00"
        );

    const date2 =
        new Date(
            selesai +
            "T00:00:00"
        );

    const days =
        Math.ceil(
            (
                date2 - date1
            )
            /
            (
                1000 *
                60 *
                60 *
                24
            )
        );

    if (
        days <= 0
    ) {

        jumlahField.value =
            "";

        return;

    }

    jumlahField.value =
        days;

    let periode =
        days;

    if (
        type ===
        "mingguan"
    ) {

        periode =
            Math.ceil(
                days / 7
            );

    }

    else if (
        type ===
        "bulanan"
    ) {

        periode =
            Math.ceil(
                days / 30
            );

    }

    if (
        harga > 0
    ) {

        totalField.value =
            formatRupiah(
                harga * periode
            );

    }

    updateEditPayment();

}

window.processBooking =
async function(encodedId) {

    const id =
        decodeURIComponent(
            encodedId
        );

    const item =
        findBooking(id);

    if (!item) {

        alert(
            "Data booking tidak ditemukan."
        );

        return;

    }

    const unitId =
        item.unitId ||
        item.plat;

    if (!unitId) {

        alert(
            "Booking tidak memiliki ID Plat / Unit."
        );

        return;

    }

    try {

        showLoading(
            "Memeriksa ketersediaan unit..."
        );

        /*
           CHECK:
           ready/{ID PLAT}
        */

        const readySnapshot =
            await get(

                ref(
                    db,
                    "ready/" +
                    unitId
                )

            );

        hideLoading();

        if (
            !readySnapshot.exists()
        ) {

            alert(

                "⚠ UNIT TIDAK TERSEDIA\n\n" +

                "ID Plat: " +
                unitId +
                "\n\n" +

                "Unit tidak ditemukan pada:\n" +
                "ready/" +
                unitId +
                "\n\n" +

                "Booking belum dapat diproses."

            );

            return;

        }

        /*
           UNIT TERSEDIA
        */

        const readyUnit =
            readySnapshot.val() ||
            {};

        selectedBookingId =
            id;

        selectedBookingData =
            item;

        openProcessModal(
            item,
            readyUnit
        );

    }
    catch(error) {

        hideLoading();

        console.error(
            error
        );

        alert(

            "Gagal melakukan pengecekan unit:\n\n" +
            error.message

        );

    }

};

/* =========================================================
   RENT TOTAL
========================================================= */

function calculateRentTotal() {

    const type =
        document
            .getElementById(
                "rentRentalType"
            )
            .value;

    const harga =
        angkaDariRupiah(
            document
                .getElementById(
                    "rentHarga"
                )
                .value
        );

    const mulai =
        document
            .getElementById(
                "rentTanggalSewa"
            )
            .value;

    const selesai =
        document
            .getElementById(
                "rentSelesaiSewa"
            )
            .value;

    const totalInput =
        document
            .getElementById(
                "rentTotal"
            );

    if (
        type ===
        "setengahhari"
    ) {

        totalInput.readOnly =
            false;

        updateRentPayment();

        return;

    }

    totalInput.readOnly =
        true;

    if (
        !type ||
        !harga ||
        !mulai ||
        !selesai
    ) {

        totalInput.value =
            "";

        updateRentPayment();

        return;

    }

    const d1 =
        new Date(
            mulai +
            "T00:00:00"
        );

    const d2 =
        new Date(
            selesai +
            "T00:00:00"
        );

    const days =
        Math.ceil(
            (
                d2 - d1
            )
            /
            (
                1000 *
                60 *
                60 *
                24
            )
        );

    if (
        days <= 0
    ) {

        totalInput.value =
            "";

        updateRentPayment();

        return;

    }

    let periode =
        days;

    if (
        type ===
        "mingguan"
    ) {

        periode =
            Math.ceil(
                days / 7
            );

    }

    else if (
        type ===
        "bulanan"
    ) {

        periode =
            Math.ceil(
                days / 30
            );

    }

    totalInput.value =
        formatRupiah(
            harga * periode
        );

    updateRentPayment();

}

/* =========================================================
   PAYMENT
========================================================= */

function updateRentPayment() {

    const total =
        angkaDariRupiah(
            document
                .getElementById(
                    "rentTotal"
                )
                .value
        );

    const bayar =
        angkaDariRupiah(
            document
                .getElementById(
                    "rentBayar"
                )
                .value
        );

    const sisaInput =
        document
            .getElementById(
                "rentSisa"
            );

    const info =
        document
            .getElementById(
                "rentPaymentInfo"
            );

    if (
        total <= 0
    ) {

        sisaInput.value =
            "";

        info.className =
            "payment-info";

        info.textContent =
            "";

        return;

    }

    if (
        bayar === total
    ) {

        sisaInput.value =
            "Rp 0";

        info.className =
            "payment-info show payment-lunas";

        info.textContent =
            "✓ Pembayaran LUNAS";

        return;

    }

    if (
        bayar > total
    ) {

        const lebih =
            bayar - total;

        sisaInput.value =
            "+ " +
            formatRupiah(
                lebih
            );

        info.className =
            "payment-info show payment-lebih";

        info.textContent =
            "＋ Kelebihan pembayaran: " +
            formatRupiah(
                lebih
            );

        return;

    }

    const kurang =
        total - bayar;

    sisaInput.value =
        "- " +
        formatRupiah(
            kurang
        );

    info.className =
        "payment-info show payment-kurang";

    info.textContent =
        "Sisa pembayaran: " +
        formatRupiah(
            kurang
        );

}

                this.files[0];

                document
                    .getElementById(
                        "rentPreviewFoto"
                    );

            if (!file) {

                preview.style.display =
                    "none";

                preview.src =
                    "";

                return;

            }

            if (
                !file.type.startsWith(
                    "image/"
                )
            ) {

                alert(
                    "Foto jaminan harus berupa gambar."
                );

                this.value =
                    "";

                return;

            }

            const reader =
                new FileReader();

            reader.onload =
                event => {

                    preview.src =
                        event.target.result;

                    preview.style.display =
                        "block";

                };

            reader.readAsDataURL(
                file
            );

        }
    );

document
    .getElementById(
        "rentFotoPengambilan"
    )
    .addEventListener(
        "change",
        function() {

                document
                    .getElementById(
                        "rentPreviewPengambilan"
                    );

            gallery.innerHTML =
                "";

            Array
                .from(
                    this.files
                )
                .forEach(
                    file => {

                        if (
                            !file.type.startsWith(
                                "image/"
                            )
                        ) {

                            return;

                        }

                        const reader =
                            new FileReader();

                        reader.onload =
                            event => {

                                const img =
                                    document.createElement(
                                        "img"
                                    );

                                img.src =
                                    event.target.result;

                                gallery.appendChild(
                                    img
                                );

                            };

                        reader.readAsDataURL(
                            file
                        );

                    }
                );

        }
    );


/* =========================================================
   CLOUDINARY UPLOAD JAMINAN
========================================================= */

async function uploadFotoJaminan() {

    const file =
        document
            .getElementById(
                "rentFotoJaminan"
            )
            .files[0];

    if (!file) {

        return {

            url: "",
            publicId: ""

        };

    }

    const status =
        document
            .getElementById(
                "rentUploadStatus"
            );

    status.textContent =
        "Mengupload foto jaminan...";

    const formData =
        new FormData();

    formData.append(
        "file",
        file
    );

    formData.append(
        "upload_preset",
        CLOUDINARY_UPLOAD_PRESET
    );

    formData.append(
        "folder",
        "arctrans/jaminan"
    );

    formData.append(
        "public_id",
        "JAMINAN_" +
        Date.now()
    );

    const response =
        await fetch(

            "https://api.cloudinary.com/v1_1/" +
            CLOUDINARY_CLOUD_NAME +
            "/image/upload",

            {

                method:
                    "POST",

                body:
                    formData

            }

        );

    const result =
        await response.json();

    if (
        !response.ok
    ) {

        throw new Error(

            result.error?.message ||
            "Gagal upload foto jaminan."

        );

    }

    status.textContent =
        "✓ Foto jaminan berhasil diupload.";

    return {

        url:
            result.secure_url,

        publicId:
            result.public_id

    };

}


/* =========================================================
   CLOUDINARY FOTO PENGAMBILAN
========================================================= */

async function uploadFotoPengambilan() {

    const files =
        Array
            .from(
                document
                    .getElementById(
                        "rentFotoPengambilan"
                    )
                    .files
            );

    if (
        files.length === 0
    ) {

        return [];

    }

    const status =
        document
            .getElementById(
                "rentUploadStatusPengambilan"
            );

    const hasil = [];

    for (
        let i = 0;
        i < files.length;
        i++
    ) {

        const file =
            files[i];

        if (
            !file.type.startsWith(
                "image/"
            )
        ) {

            throw new Error(
                "Semua dokumentasi pengambilan harus berupa gambar."
            );

        }

        status.textContent =
            "Mengupload foto " +
            (
                i + 1
            ) +
            " dari " +
            files.length +
            "...";

        const formData =
            new FormData();

        formData.append(
            "file",
            file
        );

        formData.append(
            "upload_preset",
            CLOUDINARY_UPLOAD_PRESET
        );

        formData.append(
            "folder",
            "arctrans/pengambilan-unit"
        );

        formData.append(
            "public_id",
            "PENGAMBILAN_" +
            Date.now() +
            "_" +
            i
        );

        const response =
            await fetch(

                "https://api.cloudinary.com/v1_1/" +
                CLOUDINARY_CLOUD_NAME +
                "/image/upload",

                {

                    method:
                        "POST",

                    body:
                        formData

                }

            );

        const result =
            await response.json();

        if (
            !response.ok
        ) {

            throw new Error(

                result.error?.message ||
                "Gagal upload dokumentasi unit."

            );

        }

        hasil.push({

            url:
                result.secure_url,

            publicId:
                result.public_id

        });

    }

    status.textContent =
        "✓ " +
        hasil.length +
        " foto dokumentasi berhasil diupload.";

    return hasil;

}


/* =========================================================
   PROSES RENT OUT
========================================================= */

window.processRentOut =
async function() {

    if (
        !selectedBookingId ||
        !selectedBookingData
    ) {

        alert(
            "Data Booking tidak ditemukan."
        );

        return;

    }

    const btn =
        document
            .getElementById(
                "btnProcessRent"
            );

    const unitId =
        document
            .getElementById(
                "rentPlat"
            )
            .value
            .trim();

    const namaUnit =
        document
            .getElementById(
                "rentNama"
            )
            .value
            .trim();

    const idcustomer =
        document
            .getElementById(
                "rentIdCustomer"
            )
            .value
            .trim();

    const customer =
        document
            .getElementById(
                "rentCustomer"
            )
            .value
            .trim();

    const hp =
        document
            .getElementById(
                "rentHp"
            )
            .value
            .trim();

    const rentaltype =
        document
            .getElementById(
                "rentRentalType"
            )
            .value;

    const harga =
        angkaDariRupiah(
            document
                .getElementById(
                    "rentHarga"
                )
                .value
        );

    const tanggalsewa =
        document
            .getElementById(
                "rentTanggalSewa"
            )
            .value;

    const selesaisewa =
        document
            .getElementById(
                "rentSelesaiSewa"
            )
            .value;

    const total =
        angkaDariRupiah(
            document
                .getElementById(
                    "rentTotal"
                )
                .value
        );

    const bayar =
        angkaDariRupiah(
            document
                .getElementById(
                    "rentBayar"
                )
                .value
        );

    const jaminan =
        document
            .getElementById(
                "rentJaminan"
            )
            .value
            .trim();

    const fotoJaminan =
        document
            .getElementById(
                "rentFotoJaminan"
            )
            .files[0];

    const fotoPengambilan =
        document
            .getElementById(
                "rentFotoPengambilan"
            )
            .files;

    const hariIni =
        getTanggalHariIni();


    /* =====================================================
       VALIDASI
    ===================================================== */

    if (!unitId) {

        alert(
            "ID Unit / Plat belum tersedia."
        );

        return;

    }

    /*
       CHECK ULANG READY
       agar tidak terjadi double rental
    */

    try {

        btn.disabled =
            true;

        btn.textContent =
            "Memeriksa Unit...";

        const readySnapshot =
            await get(

                ref(
                    db,
                    "ready/" +
                    unitId
                )

            );

        if (
            !readySnapshot.exists()
        ) {

            alert(

                "⚠ UNIT SUDAH TIDAK TERSEDIA\n\n" +

                "Unit " +
                unitId +
                " sudah tidak terdapat pada READY.\n\n" +

                "Transaksi dibatalkan."

            );

            closeProcessModal();

            return;

        }

    }
    catch(error) {

        console.error(
            error
        );

        alert(
            "Gagal mengecek READY:\n\n" +
            error.message
        );

        return;

    }
    finally {

        btn.disabled =
            false;

        btn.textContent =
            "🚐 Proses Rent Out";

    }


    if (!idcustomer) {

        alert(
            "ID Customer belum tersedia."
        );

        return;

    }

    if (!customer) {

        alert(
            "Nama Customer belum tersedia."
        );

        return;

    }

    if (!rentaltype) {

        alert(
            "Pilih Rental Type."
        );

        return;

    }

    if (
        harga <= 0
    ) {

        alert(
            "Harga harus diisi."
        );

        return;

    }

    if (!tanggalsewa) {

        alert(
            "Pilih tanggal sewa."
        );

        return;

    }

    if (
        tanggalsewa <
        hariIni
    ) {

        alert(
            "Tanggal sewa tidak boleh sebelum hari ini."
        );

        return;

    }

    if (!selesaisewa) {

        alert(
            "Pilih estimasi tanggal selesai."
        );

        return;

    }

    if (
        rentaltype !==
        "setengahhari" &&
        selesaisewa <=
        tanggalsewa
    ) {

        alert(
            "Tanggal selesai harus lebih besar dari tanggal sewa."
        );

        return;

    }

    if (
        total <= 0
    ) {

        alert(
            "Total biaya belum valid."
        );

        return;

    }

    if (!jaminan) {

        alert(
            "Data jaminan wajib diisi."
        );

        return;

    }

    if (!fotoJaminan) {

        alert(
            "Foto jaminan wajib diupload."
        );

        return;

    }

    if (
        !fotoPengambilan ||
        fotoPengambilan.length === 0
    ) {

        alert(
            "Dokumentasi pengambilan unit wajib diupload."
        );

        return;

    }


    /* =====================================================
       JUMLAH HARI
    ===================================================== */

    let jumlahHari = 0;

    if (
        rentaltype ===
        "setengahhari"
    ) {

        jumlahHari =
            0.5;

    }
    else {

        const d1 =
            new Date(
                tanggalsewa +
                "T00:00:00"
            );

        const d2 =
            new Date(
                selesaisewa +
                "T00:00:00"
            );

        jumlahHari =
            Math.ceil(
                (
                    d2 - d1
                )
                /
                (
                    1000 *
                    60 *
                    60 *
                    24
                )
            );

    }


    /* =====================================================
       PEMBAYARAN
    ===================================================== */

    let sisa = 0;

    let kelebihanBayar = 0;

    let statusPembayaran =
        "BELUM LUNAS";

    if (
        bayar === total
    ) {

        statusPembayaran =
            "LUNAS";

        sisa =
            0;

    }
    else if (
        bayar > total
    ) {

        kelebihanBayar =
            bayar - total;

        sisa =
            kelebihanBayar;

        statusPembayaran =
            "LEBIH BAYAR";

    }
    else {

        sisa =
            -(total - bayar);

    }


    /* =====================================================
       DISABLE
    ===================================================== */

    btn.disabled =
        true;

    btn.textContent =
        "Mengupload Foto...";


    try {

        /*
           UPLOAD JAMINAN
        */

        const hasilFoto =
            await uploadFotoJaminan();


        /*
           UPLOAD PENGAMBILAN
        */

        btn.textContent =
            "Mengupload Dokumentasi...";

        const hasilPengambilan =
            await uploadFotoPengambilan();


        /*
           ID TRANSAKSI RENT
        */

        btn.textContent =
            "Menyimpan Rent Out...";

        const transaksiId =
            "RENT_" +
            Date.now();


        /*
           DATA RENT OUT
        */

        const dataRent = {

            transaksiId:
                transaksiId,

            bookingId:
                selectedBookingId,


            /* UNIT */

            unitId:
                unitId,

            plat:
                unitId,

            namaUnit:
                namaUnit,


            /* CUSTOMER */

            idcustomer:
                idcustomer,

            customer:
                customer,

            hp:
                hp,

            nik:
                selectedBookingData.nik ||
                "",

            alamatktp:
                selectedBookingData.alamatktp ||
                "",


            /* RENTAL */

            rentaltype:
                rentaltype,

            harga:
                harga,

            hargaFormat:
                formatRupiah(
                    harga
                ),

            tanggalsewa:
                tanggalsewa,

            selesaisewa:
                selesaisewa,

            jumlahHari:
                jumlahHari,

            total:
                total,

            totalFormat:
                formatRupiah(
                    total
                ),


            /* PAYMENT */

            bayar:
                bayar,

            bayarFormat:
                formatRupiah(
                    bayar
                ),

            sisa:
                sisa,

            sisaFormat:

                sisa === 0
                ?
                "0"
                :
                sisa < 0
                ?
                "- " +
                formatRupiah(
                    Math.abs(
                        sisa
                    )
                )
                :
                "+ " +
                formatRupiah(
                    sisa
                ),

            kelebihanBayar:
                kelebihanBayar,

            kelebihanBayarFormat:
                formatRupiah(
                    kelebihanBayar
                ),

            statusPembayaran:
                statusPembayaran,


            /* JAMINAN */

            jaminan:
                jaminan,

            fotoJaminan:
                hasilFoto.url,

            fotoJaminanPublicId:
                hasilFoto.publicId,


            /* DOKUMENTASI */

            fotoPengambilan:
                hasilPengambilan,


            /* STATUS */

            status:
                "RENT OUT",


            /* TIMESTAMP */

            timestamp:
                Date.now(),

            tanggalInput:
                formatTanggalInput()

        };


        /*
           SIMPAN RENT OUT
        */

        await set(

            ref(
                db,
                "rentout/" +
                transaksiId
            ),

            dataRent

        );


        /*
           REVENUE
        */

        const tanggalRevenue =
            getTanggalHariIni();

        const dataRevenue = {

            ...dataRent,

            keterangan:

                "DP Mobil - " +

                unitId +

                " - " +

                namaUnit

        };


        await set(

            ref(
                db,
                "revenue/" +
                tanggalRevenue +
                "/" +
                transaksiId
            ),

            dataRevenue

        );


        /*
           HAPUS DARI READY
        */

        await remove(

            ref(
                db,
                "ready/" +
                unitId
            )

        );


        /*
           UPDATE UNIT
        */

        await update(

            ref(
                db,
                "unit/" +
                unitId
            ),

            {

                keterangan:
                    "Out"

            }

        );


        /*
           HAPUS BOOKING
        */

        await remove(

            ref(
                db,
                "booking/" +
                selectedBookingId
            )

        );


        /*
           BERHASIL
        */

        alert(

            "✓ RENT OUT BERHASIL\n\n" +

            "ID Rent Out: " +
            transaksiId +
            "\n\n" +

            "ID Booking: " +
            selectedBookingId +
            "\n\n" +

            "Unit: " +
            unitId +
            "\n\n" +

            "Customer: " +
            customer +
            "\n\n" +

            "Status Pembayaran: " +
            statusPembayaran +
            "\n\n" +

            "Booking telah dihapus.\n" +
            "Unit telah dipindahkan dari READY ke OUT.\n" +
            "Data Revenue telah dibuat."

        );


        closeProcessModal();


        /*
           PINDAH KE DATA RENT OUT
        */

        window.location.href =
            "tabeloutrent.html";

    }
    catch(error) {

        console.error(
            "ERROR RENT OUT:",
            error
        );

        alert(

            "Gagal memproses Rent Out:\n\n" +
            error.message

        );

    }
    finally {

        btn.disabled =
            false;

        btn.textContent =
            "🚐 Proses Rent Out";

    }

};

        );

        filteredData.map(
            (
                item,

            ) => {

                return {

                    "No":
                        index + 1,

                    "ID Transaksi":
                        item.id ||
                        item.transaksiId ||
                        "-",

                    "ID Unit":
                        item.unitId ||
                        item.plat ||
                        "-",

                    "Plat":
                        item.plat ||
                        item.unitId ||
                        "-",

                    "Nama Unit":
                        item.namaUnit ||
                        "-",

                    "ID Customer":
                        item.idcustomer ||
                        item.idCustomer ||
                        "-",

                    "Nama Customer":
                        item.customer ||
                        item.namaCustomer ||
                        "-",

                    "Kontak":
                        item.hp ||
                        "-",

                    "Rental Type":
                        item.rentaltype ||
                        item.rentalType ||
                        "-",

                    "Tanggal Sewa":
                        item.tanggalsewa ||
                        item.tanggalSewa ||
                        "-",

                    "Estimasi Kembali":
                        item.selesaisewa ||
                        item.tanggalSelesai ||
                        "-",

                    "Jumlah Hari":
                        item.jumlahHari ||
                        "-",

                    "Harga":
                        formatRupiah(
                            item.harga
                        ),

                    "Total":
                        formatRupiah(
                            item.total
                        ),

                    "Bayar / DP":
                        formatRupiah(

                        ),

                    "Status Pembayaran":

    const worksheet =
        XLSX.utils

        { wch: 7 },
        { wch: 25 },
        { wch: 18 },
        { wch: 18 },
        { wch: 25 },
        { wch: 20 },
        { wch: 25 },
        { wch: 18 },
        { wch: 18 },
        { wch: 18 },
        { wch: 20 },
        { wch: 15 },
        { wch: 20 },
        { wch: 20 },
        { wch: 20 },
        { wch: 22 },
        { wch: 20 },
        { wch: 18 },
        { wch: 25 }

    ];


    const workbook =
        XLSX.utils.book_new();


    XLSX.utils.book_append_sheet(

        workbook,

        worksheet,

        "Data Booking"

    );


    XLSX.writeFile(

        workbook,

        "Data_Booking.xlsx"

    );

};
