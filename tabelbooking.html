<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARC TRANS - Data Booking</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;font-family:"Segoe UI",Arial,sans-serif}
:root{--primary:#2196F3;--dark:#1976D2;--success:#16a34a;--danger:#dc2626;--warning:#f59e0b;--text:#1e293b;--muted:#64748b;--border:#dbe3ee}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#eef6ff,#f8fafc);color:var(--text)}
.home-btn{position:fixed;top:14px;left:16px;z-index:2000;padding:9px 16px;border-radius:30px;background:#fff;color:var(--dark);text-decoration:none;font-size:14px;font-weight:700;box-shadow:0 5px 20px #0002}
.navbar{min-height:150px;display:flex;align-items:center;justify-content:center;padding:35px 20px;background:linear-gradient(135deg,#0d47a1,#2196F3,#21c6f3);color:#fff;box-shadow:0 4px 20px #2196f340}
.logo{font-size:clamp(22px,4vw,32px);font-weight:800;letter-spacing:1px;text-align:center}
.container{width:100%;max-width:1800px;margin:auto;padding:25px clamp(15px,4vw,40px) 40px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:22px;flex-wrap:wrap}
#searchInput{width:100%;max-width:450px;padding:14px 18px;border:1px solid #dce6f0;border-radius:14px;outline:none;background:#fff;font-size:14px;box-shadow:0 4px 15px #0000000a}
#btnDownload{display:none;padding:12px 20px;color:#fff;background:linear-gradient(135deg,#2e7d32,#4CAF50)}
button{border:0;cursor:pointer;font-size:13px;font-weight:700;border-radius:10px;transition:.2s}
button:hover{transform:translateY(-2px)}button:disabled{opacity:.6;cursor:not-allowed;transform:none}
.table-container{width:100%;overflow-x:auto;background:#fff;border-radius:20px;box-shadow:0 10px 35px #00000014;border:1px solid #edf1f5}
table{width:100%;min-width:1500px;border-collapse:separate;border-spacing:0}
th{background:linear-gradient(135deg,#1976D2,#2196F3);color:#fff;padding:16px 12px;text-align:center;white-space:nowrap;font-size:13px;position:sticky;top:0;z-index:5}
th:first-child{border-top-left-radius:18px}th:last-child{border-top-right-radius:18px}
td{padding:14px 10px;border-bottom:1px solid #edf1f5;text-align:center;vertical-align:middle;white-space:nowrap;font-size:13px}
tbody tr:hover{background:#f5faff}
.status{display:inline-flex;align-items:center;justify-content:center;padding:7px 13px;border-radius:20px;font-size:11px;font-weight:800}
.status-booking{color:#1565C0;background:#E3F2FD;border:1px solid #90CAF9}
.action-buttons{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap}
.btn-edit,.btn-delete,.btn-process{padding:8px 12px;color:#fff;border-radius:9px;font-size:11px}
.btn-edit{background:linear-gradient(135deg,#1976D2,#2196F3)}
.btn-delete{background:linear-gradient(135deg,#b91c1c,#ef4444)}
.btn-process{background:linear-gradient(135deg,#15803d,#22c55e)}
.empty-data{padding:50px;text-align:center;color:#78909C;font-size:15px}
#pagination{margin-top:25px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.page-btn{padding:10px 18px;color:#fff}.prev-btn{background:linear-gradient(135deg,#fb8c00,#ff9800)}.next-btn{background:linear-gradient(135deg,#2e7d32,#4CAF50)}
.page-info{padding:10px 16px;background:#fff;border-radius:12px;font-size:13px;font-weight:700;color:#546E7A;box-shadow:0 4px 15px #0000000f}
.modal{position:fixed;inset:0;z-index:5000;display:none;align-items:center;justify-content:center;padding:20px;background:#0f172aa6;backdrop-filter:blur(5px)}
.modal.show{display:flex}.modal-content{width:100%;max-width:950px;max-height:94vh;overflow-y:auto;background:#fff;border-radius:22px;box-shadow:0 25px 70px #00000040}
.modal-header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:18px 24px;color:#fff;background:linear-gradient(135deg,#1976D2,#2196F3,#21CBF3)}
.modal-header h2{margin:0;font-size:19px}.close-modal{width:38px;height:38px;color:#fff;background:#ffffff2e;border-radius:50%;font-size:20px}
.modal-body{padding:25px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.form-group{width:100%}.full-width{grid-column:1/-1}
label{display:block;margin-bottom:7px;font-size:13px;font-weight:700;color:#334155}
input,select{width:100%;min-height:46px;padding:11px 13px;border:1px solid var(--border);border-radius:11px;outline:0;background:#fff;font-size:14px}
input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 4px #2196f31f}input[readonly]{background:#f8fafc}
.info-box,.payment-info{display:none;margin-top:9px;padding:10px 13px;border-radius:10px;font-size:12px;font-weight:700}
.info-box.show,.payment-info.show{display:block}.info-success,.payment-lunas{color:#166534;background:#dcfce7}.info-warning,.payment-kurang{color:#92400e;background:#fef3c7}.info-danger{color:#991b1b;background:#fee2e2}.payment-lebih{color:#1d4ed8;background:#dbeafe}
.preview-image{width:100%;max-height:250px;object-fit:contain;display:none;margin-top:10px;padding:6px;border:2px dashed var(--primary);border-radius:12px}
.preview-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:10px}
.preview-gallery img{width:100%;height:120px;object-fit:cover;border:2px dashed var(--primary);border-radius:10px;padding:3px}
.upload-status{min-height:18px;margin-top:7px;color:var(--muted);font-size:12px}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;padding:18px 25px;border-top:1px solid #edf1f5;background:#f8fafc}
.btn-cancel{padding:12px 20px;color:#475569;background:#e2e8f0}.btn-save{padding:12px 22px;color:#fff;background:linear-gradient(135deg,#1976D2,#2196F3)}
.btn-rent{width:100%;min-height:52px;color:#fff;background:linear-gradient(135deg,#15803d,#22c55e);font-size:15px;border-radius:13px}
.loading{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;background:#0f172a80;backdrop-filter:blur(3px)}
.loading.show{display:flex}.loading-box{padding:25px 35px;border-radius:18px;background:#fff;text-align:center;box-shadow:0 20px 50px #0003}
.spinner{width:42px;height:42px;margin:0 auto 12px;border:4px solid #dbeafe;border-top-color:#2196F3;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:700px){
body{background:#f4f7fb}.home-btn{top:10px;left:10px;font-size:12px;padding:8px 12px}.navbar{min-height:120px;padding-top:55px}.logo{font-size:20px}.container{padding:15px 10px 30px}
.toolbar{flex-direction:column;align-items:stretch}#searchInput{max-width:none}#btnDownload{width:100%}.table-container{background:transparent;box-shadow:none;border:0;overflow:visible}
table{min-width:0;width:100%}thead{display:none}tbody{display:block}tbody tr{display:block;width:100%;margin-bottom:15px;padding:10px 14px;background:#fff;border:1px solid #edf1f5;border-radius:18px;box-shadow:0 6px 20px #00000012}
td{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:11px 5px;text-align:right;white-space:normal;border-bottom:1px solid #eef2f5}td::before{content:attr(data-label);flex:0 0 42%;text-align:left;font-weight:700;color:#607D8B}td:last-child{border-bottom:0}.action-buttons{justify-content:flex-end}
.modal{padding:10px}.modal-content{max-height:96vh;border-radius:18px}.modal-body{padding:18px 15px}.modal-header{padding:15px}.form-grid{grid-template-columns:1fr;gap:15px}.full-width{grid-column:auto}.modal-footer{padding:14px 15px;flex-direction:column}.modal-footer button{width:100%}
}
</style>
</head>
<body>

<a href="index.html" class="home-btn">🏠 Home</a>
<nav class="navbar"><div class="logo">📋 DATA BOOKING KENDARAAN</div></nav>

<div class="container">
<div class="toolbar">
<input type="text" id="searchInput" placeholder="🔍 Cari ID transaksi, customer, unit atau plat...">
<button id="btnDownload" onclick="downloadExcel()">📥 Download Excel</button>
</div>

<div class="table-container">
<table>
<thead><tr>
<th>No.</th><th>ID Transaksi</th><th>Nama Customer</th><th>Kontak</th><th>Nama Unit</th><th>Plat</th>
<th>Rental Type</th><th>Tanggal Sewa</th><th>Estimasi Kembali</th><th>Harga</th><th>Total</th><th>Status</th><th>Aksi</th>
</tr></thead>
<tbody id="isiData"><tr><td colspan="13" class="empty-data">Menghubungkan ke Firebase Booking/...</td></tr></tbody>
</table>
</div>
<div id="pagination"></div>
</div>

<!-- EDIT -->
<div id="editModal" class="modal">
<div class="modal-content">
<div class="modal-header"><h2>✏️ Edit Data Booking</h2><button class="close-modal" onclick="closeEditModal()">×</button></div>
<div class="modal-body"><div class="form-grid">
<div class="form-group"><label>ID Transaksi</label><input id="editTransaksiId" readonly></div>
<div class="form-group"><label>ID Unit / Plat</label><input id="editUnitId"></div>
<div class="form-group"><label>Nama Unit</label><input id="editNamaUnit"></div>
<div class="form-group"><label>ID Customer</label><input id="editIdCustomer"></div>
<div class="form-group"><label>Nama Customer</label><input id="editCustomer"></div>
<div class="form-group"><label>Kontak / HP</label><input id="editHp"></div>
<div class="form-group"><label>Rental Type</label>
<select id="editRentalType"><option value="">-- Pilih --</option><option value="setengahhari">Setengah Hari</option><option value="harian">Harian</option><option value="mingguan">Mingguan</option><option value="bulanan">Bulanan</option></select></div>
<div class="form-group"><label>Harga</label><input id="editHarga" inputmode="numeric" placeholder="Rp 0"></div>
<div class="form-group"><label>Tanggal Sewa</label><input type="date" id="editTanggalSewa"></div>
<div class="form-group"><label>Estimasi Tanggal Selesai</label><input type="date" id="editSelesaiSewa"></div>
<div class="form-group"><label>Jumlah Hari</label><input id="editJumlahHari" readonly></div>
<div class="form-group"><label>Total Biaya</label><input id="editTotal" inputmode="numeric"></div>
<div class="form-group"><label>Bayar / DP</label><input id="editBayar" inputmode="numeric"></div>
<div class="form-group"><label>Jaminan</label><input id="editJaminan"></div>
<div class="form-group full-width"><div id="editPaymentInfo" class="payment-info"></div></div>
</div></div>
<div class="modal-footer"><button class="btn-cancel" onclick="closeEditModal()">Batal</button><button class="btn-save" id="btnSaveEdit" onclick="saveEditBooking()">💾 Simpan Perubahan</button></div>
</div></div>

<!-- PROCESS -->
<div id="processModal" class="modal">
<div class="modal-content">
<div class="modal-header"><h2>🚐 Proses Booking → Rent Out</h2><button class="close-modal" onclick="closeProcessModal()">×</button></div>
<div class="modal-body">
<div id="readyCheckInfo" class="info-box"></div>
<div class="form-grid">
<div class="form-group"><label>ID Unit / Plat Nomor</label><input id="rentPlat" readonly></div>
<div class="form-group"><label>Nama Unit Kendaraan</label><input id="rentNama" readonly></div>
<div class="form-group"><label>ID Customer</label><input id="rentIdCustomer" readonly></div>
<div class="form-group"><label>Nama Customer</label><input id="rentCustomer" readonly></div>
<div class="form-group"><label>Kontak</label><input id="rentHp" readonly></div>
<div class="form-group"><label>Rental Type</label><select id="rentRentalType"><option value="">-- Pilih Rental Type --</option><option value="setengahhari">Setengah Hari</option><option value="harian">Harian</option><option value="mingguan">Mingguan</option><option value="bulanan">Bulanan</option></select></div>
<div class="form-group"><label>Harga</label><input id="rentHarga" inputmode="numeric" placeholder="Rp 0"></div>
<div class="form-group"><label>Tanggal Sewa</label><input type="date" id="rentTanggalSewa"></div>
<div class="form-group"><label>Estimasi Tanggal Selesai</label><input type="date" id="rentSelesaiSewa"><div id="rentDurasiInfo" class="info-box"></div></div>
<div class="form-group"><label>Total Biaya</label><input id="rentTotal" inputmode="numeric" readonly></div>
<div class="form-group"><label>Bayar / DP</label><input id="rentBayar" inputmode="numeric" placeholder="Rp 0"></div>
<div class="form-group full-width"><label>Sisa Pembayaran</label><input id="rentSisa" readonly><div id="rentPaymentInfo" class="payment-info"></div></div>
<div class="form-group"><label>Jaminan</label><input id="rentJaminan" placeholder="Contoh: Motor, KTP, dll."></div>
<div class="form-group"><label>Upload Foto Jaminan</label><input type="file" id="rentFotoJaminan" accept="image/*"><img id="rentPreviewFoto" class="preview-image" alt="Preview Foto Jaminan"><div id="rentUploadStatus" class="upload-status"></div></div>
<div class="form-group"><label>Dokumentasi Pengambilan Unit</label><input type="file" id="rentFotoPengambilan" accept="image/*" multiple></div>
<div class="form-group full-width"><div id="rentPreviewPengambilan" class="preview-gallery"></div><div id="rentUploadStatusPengambilan" class="upload-status"></div></div>
</div>
</div>
<div class="modal-footer"><button class="btn-cancel" onclick="closeProcessModal()">Batal</button><button id="btnProcessRent" class="btn-rent" onclick="processRentOut()">🚐 Proses Rent Out</button></div>
</div></div>

<div id="loading" class="loading"><div class="loading-box"><div class="spinner"></div><strong id="loadingText">Memproses...</strong></div></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {getDatabase,ref,onValue,get,set,update,remove} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig={
apiKey:"AIzaSyCOL9UC3tZOEX9ZwvY076O0yI5yqmYfb44",
authDomain:"arctrans.firebaseapp.com",
databaseURL:"https://arctrans-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId:"arctrans",
storageBucket:"arctrans.firebasestorage.app",
messagingSenderId:"60781918601",
appId:"1:60781918601:web:c85d6131207f8a8958"
};

const CLOUDINARY_CLOUD_NAME="cesiolzm";
const CLOUDINARY_UPLOAD_PRESET="arctrans";

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

/*
=========================================================
PENTING:
SUMBER DATA BOOKING ADALAH:
Booking/{ID_TRANSAKSI}

Firebase Realtime Database bersifat CASE-SENSITIVE.
Jadi "Booking" berbeda dengan "booking".
=========================================================
*/
const bookingRef=ref(db,"Booking");

let allData=[];
let filteredData=[];
let currentPage=1;
const rowsPerPage=10;
let selectedBookingId="";
let selectedBookingData=null;

const username=localStorage.getItem("username");
const allowedUsers=["Nurhakiki","Henri Yuliansyah","Sultan"];
if(allowedUsers.includes(username)) document.getElementById("btnDownload").style.display="inline-block";

function escapeHtml(value){
return String(value??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function formatRupiah(value){
return "Rp "+Number(value||0).toLocaleString("id-ID");
}
function angkaDariRupiah(value){
return Number(String(value||"").replace(/\D/g,""))||0;
}
function getTanggalHariIni(){
const d=new Date();
return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function formatTanggalInput(){
const d=new Date();
return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+":"+String(d.getSeconds()).padStart(2,"0");
}
function showLoading(text="Memproses..."){
document.getElementById("loadingText").textContent=text;
document.getElementById("loading").classList.add("show");
}
function hideLoading(){document.getElementById("loading").classList.remove("show");}

document.getElementById("searchInput").addEventListener("input",applySearch);
function applySearch(){
const keyword=document.getElementById("searchInput").value.toLowerCase().trim();
filteredData=allData.filter(item=>{
const text=[
item.id,item.transaksiId,item.bookingId,item.customer,item.namaCustomer,item.hp,item.kontak,
item.plat,item.unitId,item.namaUnit,item.nama,item.rentaltype,item.rentalType
].map(v=>String(v??"").toLowerCase()).join(" ");
return text.includes(keyword);
});
currentPage=1;renderTable();
}

/* =========================================================
LOAD DARI Booking/
========================================================= */
onValue(bookingRef,snapshot=>{
console.log("Firebase path yang dibaca: Booking/");
console.log("Snapshot Booking:",snapshot);

if(!snapshot.exists()){
allData=[];filteredData=[];
showEmptyData("Data booking belum tersedia pada Firebase: Booking/");
return;
}

const data=snapshot.val();
allData=Object.entries(data).map(([firebaseKey,item])=>{
const booking=item&&typeof item==="object"?item:{};
return {...booking,id:firebaseKey,transaksiId:booking.transaksiId||firebaseKey};
}).sort((a,b)=>Number(b.timestamp||b.createdAt||0)-Number(a.timestamp||a.createdAt||0));

console.log("Total data Booking terbaca:",allData.length);
applySearch();
},error=>{
console.error("Firebase Booking error:",error);
showEmptyData("Gagal mengambil data Booking: "+error.message);
});

function showEmptyData(message){
document.getElementById("isiData").innerHTML='<tr><td colspan="13" class="empty-data">'+escapeHtml(message)+'</td></tr>';
document.getElementById("pagination").innerHTML="";
}

function renderTable(){
if(!filteredData.length){showEmptyData("Data booking tidak ditemukan.");return;}
const totalPages=Math.ceil(filteredData.length/rowsPerPage);
if(currentPage>totalPages) currentPage=totalPages;
const start=(currentPage-1)*rowsPerPage;
const pageData=filteredData.slice(start,start+rowsPerPage);
let html="",no=start+1;

pageData.forEach(item=>{
const id=item.id||item.transaksiId||"-";
const customer=item.customer||item.namaCustomer||"-";
const hp=item.hp||item.kontak||"-";
const namaUnit=item.namaUnit||item.nama||"-";
const plat=item.plat||item.unitId||"-";
const rentaltype=item.rentaltype||item.rentalType||"-";
const tanggalsewa=item.tanggalsewa||item.tanggalSewa||"-";
const selesaisewa=item.selesaisewa||item.tanggalSelesai||"-";
const harga=Number(item.harga||0);
const total=Number(item.total||0);
const encodedId=encodeURIComponent(id);

html+=`<tr>
<td data-label="No.">${no}</td>
<td data-label="ID Transaksi">${escapeHtml(id)}</td>
<td data-label="Nama Customer">${escapeHtml(customer)}</td>
<td data-label="Kontak">${escapeHtml(hp)}</td>
<td data-label="Nama Unit">${escapeHtml(namaUnit)}</td>
<td data-label="Plat">${escapeHtml(plat)}</td>
<td data-label="Rental Type">${escapeHtml(rentaltype)}</td>
<td data-label="Tanggal Sewa">${escapeHtml(tanggalsewa)}</td>
<td data-label="Estimasi Kembali">${escapeHtml(selesaisewa)}</td>
<td data-label="Harga">${formatRupiah(harga)}</td>
<td data-label="Total">${formatRupiah(total)}</td>
<td data-label="Status"><span class="status status-booking">📋 BOOKING</span></td>
<td data-label="Aksi"><div class="action-buttons">
<button class="btn-edit" onclick="editBooking('${encodedId}')">✏️ Edit</button>
<button class="btn-delete" onclick="deleteBooking('${encodedId}')">🗑️ Hapus</button>
<button class="btn-process" onclick="processBooking('${encodedId}')">🚐 Proses</button>
</div></td></tr>`;
no++;
});
document.getElementById("isiData").innerHTML=html;
renderPagination();
}

function renderPagination(){
const totalPages=Math.ceil(filteredData.length/rowsPerPage);
if(totalPages<=1){document.getElementById("pagination").innerHTML="";return;}
document.getElementById("pagination").innerHTML=
`<button class="page-btn prev-btn" onclick="prevPage()" ${currentPage===1?"disabled":""}>← Sebelumnya</button>
<span class="page-info">Halaman ${currentPage} dari ${totalPages}</span>
<button class="page-btn next-btn" onclick="nextPage()" ${currentPage===totalPages?"disabled":""}>Selanjutnya →</button>`;
}
window.nextPage=()=>{const totalPages=Math.ceil(filteredData.length/rowsPerPage);if(currentPage<totalPages){currentPage++;renderTable();}};
window.prevPage=()=>{if(currentPage>1){currentPage--;renderTable();}};
function findBooking(id){return allData.find(item=>String(item.id)===String(id));}

/* =========================================================
EDIT
========================================================= */
window.editBooking=function(encodedId){
const id=decodeURIComponent(encodedId);
const item=findBooking(id);
if(!item){alert("Data booking tidak ditemukan.");return;}
selectedBookingId=id;selectedBookingData=item;

document.getElementById("editTransaksiId").value=item.transaksiId||id;
document.getElementById("editUnitId").value=item.unitId||item.plat||"";
document.getElementById("editNamaUnit").value=item.namaUnit||item.nama||"";
document.getElementById("editIdCustomer").value=item.idcustomer||item.idCustomer||"";
document.getElementById("editCustomer").value=item.customer||item.namaCustomer||"";
document.getElementById("editHp").value=item.hp||item.kontak||"";
document.getElementById("editRentalType").value=item.rentaltype||item.rentalType||"";
document.getElementById("editHarga").value=item.harga?formatRupiah(item.harga):"";
document.getElementById("editTanggalSewa").value=item.tanggalsewa||item.tanggalSewa||"";
document.getElementById("editSelesaiSewa").value=item.selesaisewa||item.tanggalSelesai||"";
document.getElementById("editJumlahHari").value=item.jumlahHari??"";
document.getElementById("editTotal").value=item.total?formatRupiah(item.total):"";
document.getElementById("editBayar").value=item.bayar?formatRupiah(item.bayar):"";
document.getElementById("editJaminan").value=item.jaminan||"";
updateEditPayment();
document.getElementById("editModal").classList.add("show");
};
window.closeEditModal=()=>document.getElementById("editModal").classList.remove("show");

function calculateDays(type,mulai,selesai){
if(type==="setengahhari") return .5;
if(!mulai||!selesai) return 0;
const d1=new Date(mulai+"T00:00:00"),d2=new Date(selesai+"T00:00:00");
return Math.ceil((d2-d1)/(1000*60*60*24));
}
function calculateTotal(type,harga,days,currentTotal=0){
if(type==="setengahhari") return currentTotal||harga;
if(!harga||days<=0) return 0;
if(type==="harian") return harga*days;
if(type==="mingguan") return harga*Math.ceil(days/7);
if(type==="bulanan") return harga*Math.ceil(days/30);
return 0;
}
function updateEditPayment(){
const total=angkaDariRupiah(document.getElementById("editTotal").value);
const bayar=angkaDariRupiah(document.getElementById("editBayar").value);
const info=document.getElementById("editPaymentInfo");
if(total<=0){info.className="payment-info";info.textContent="";return;}
if(bayar===total){info.className="payment-info show payment-lunas";info.textContent="✓ Pembayaran LUNAS";}
else if(bayar>total){info.className="payment-info show payment-lebih";info.textContent="＋ Kelebihan pembayaran: "+formatRupiah(bayar-total);}
else{info.className="payment-info show payment-kurang";info.textContent="Sisa pembayaran: "+formatRupiah(total-bayar);}
}

}

const newData={

window.processBooking=async function(encodedId){
const id=decodeURIComponent(encodedId),item=findBooking(id);
if(!item){alert("Data booking tidak ditemukan.");return;}
const unitId=item.unitId||item.plat;

function openProcessModal(booking,readyUnit){
const unitId=booking.unitId||booking.plat;
document.getElementById("rentPlat").value=unitId||"";
document.getElementById("rentNama").value=booking.namaUnit||readyUnit.nama||readyUnit.namaUnit||"";
document.getElementById("rentIdCustomer").value=booking.idcustomer||booking.idCustomer||"";
document.getElementById("rentCustomer").value=booking.customer||booking.namaCustomer||"";
document.getElementById("rentHp").value=booking.hp||booking.kontak||"";
document.getElementById("rentRentalType").value=booking.rentaltype||booking.rentalType||"";
document.getElementById("rentHarga").value=booking.harga?formatRupiah(booking.harga):"";
document.getElementById("rentTanggalSewa").value=booking.tanggalsewa||booking.tanggalSewa||"";
document.getElementById("rentSelesaiSewa").value=booking.selesaisewa||booking.tanggalSelesai||"";
document.getElementById("rentTotal").value=booking.total?formatRupiah(booking.total):"";
document.getElementById("rentBayar").value=booking.bayar?formatRupiah(booking.bayar):"";
document.getElementById("rentJaminan").value=booking.jaminan||"";
document.getElementById("rentFotoJaminan").value="";
document.getElementById("rentFotoPengambilan").value="";
document.getElementById("rentPreviewFoto").style.display="none";
document.getElementById("rentPreviewFoto").src="";
document.getElementById("rentPreviewPengambilan").innerHTML="";
document.getElementById("rentUploadStatus").textContent="";
document.getElementById("rentUploadStatusPengambilan").textContent="";
const info=document.getElementById("readyCheckInfo");
info.className="info-box show info-success";
info.textContent="✓ Unit tersedia di READY dan dapat diproses menjadi RENT OUT.";
document.getElementById("rentRentalType").dispatchEvent(new Event("change"));
updateRentDurasi();calculateRentTotal();updateRentPayment();
document.getElementById("processModal").classList.add("show");
}
window.closeProcessModal=()=>document.getElementById("processModal").classList.remove("show");

function updateRentDurasi(){
const type=document.getElementById("rentRentalType").value,mulai=document.getElementById("rentTanggalSewa").value,selesai=document.getElementById("rentSelesaiSewa").value;
const info=document.getElementById("rentDurasiInfo");
if(type==="setengahhari"){info.className="info-box show info-success";info.textContent="Durasi: 0,5 hari (Setengah Hari)";return;}
if(!mulai||!selesai){info.className="info-box";return;}
const days=calculateDays(type,mulai,selesai);
if(days<=0){info.className="info-box show info-danger";info.textContent="Tanggal selesai harus lebih besar dari tanggal sewa.";return;}
info.className="info-box show info-success";info.textContent="Durasi: "+days+" hari";
}
function calculateRentTotal(){
const type=document.getElementById("rentRentalType").value,harga=angkaDariRupiah(document.getElementById("rentHarga").value);
const mulai=document.getElementById("rentTanggalSewa").value,selesai=document.getElementById("rentSelesaiSewa").value;
const totalField=document.getElementById("rentTotal");
if(type==="setengahhari"){totalField.readOnly=false;updateRentPayment();return;}
totalField.readOnly=true;
const days=calculateDays(type,mulai,selesai),total=calculateTotal(type,harga,days);
totalField.value=total?formatRupiah(total):"";
updateRentPayment();
}
function updateRentPayment(){
const total=angkaDariRupiah(document.getElementById("rentTotal").value),bayar=angkaDariRupiah(document.getElementById("rentBayar").value);
const sisaField=document.getElementById("rentSisa"),info=document.getElementById("rentPaymentInfo");
if(total<=0){sisaField.value="";info.className="payment-info";info.textContent="";return;}
const selisih=total-bayar;
if(selisih===0){sisaField.value="Rp 0";info.className="payment-info show payment-lunas";info.textContent="✓ Pembayaran LUNAS";}
else if(selisih<0){sisaField.value="- "+formatRupiah(Math.abs(selisih));info.className="payment-info show payment-lebih";info.textContent="＋ Kelebihan pembayaran: "+formatRupiah(Math.abs(selisih));}
else{sisaField.value=formatRupiah(selisih);info.className="payment-info show payment-kurang";info.textContent="Sisa pembayaran: "+formatRupiah(selisih);}
}

document.getElementById("rentHarga").addEventListener("input",function(){const v=angkaDariRupiah(this.value);this.value=v?formatRupiah(v):"";calculateRentTotal();});
document.getElementById("rentBayar").addEventListener("input",function(){const v=angkaDariRupiah(this.value);this.value=v?formatRupiah(v):"";updateRentPayment();});
document.getElementById("rentTotal").addEventListener("input",function(){if(document.getElementById("rentRentalType").value==="setengahhari"){const v=angkaDariRupiah(this.value);this.value=v?formatRupiah(v):"";}updateRentPayment();});
document.getElementById("rentRentalType").addEventListener("change",()=>{const total=document.getElementById("rentTotal");total.readOnly=document.getElementById("rentRentalType").value!=="setengahhari";calculateRentTotal();updateRentDurasi();});
document.getElementById("rentTanggalSewa").addEventListener("change",()=>{updateRentDurasi();calculateRentTotal();});
document.getElementById("rentSelesaiSewa").addEventListener("change",()=>{updateRentDurasi();calculateRentTotal();});

document.getElementById("rentFotoJaminan").addEventListener("change",function(){
const file=this.files[0],preview=document.getElementById("rentPreviewFoto");
if(!file){preview.style.display="none";return;}
if(!file.type.startsWith("image/")){alert("File foto jaminan harus berupa gambar.");this.value="";return;}
const reader=new FileReader();reader.onload=e=>{preview.src=e.target.result;preview.style.display="block";};reader.readAsDataURL(file);
});
document.getElementById("rentFotoPengambilan").addEventListener("change",function(){
const gallery=document.getElementById("rentPreviewPengambilan");gallery.innerHTML="";
Array.from(this.files).forEach(file=>{if(!file.type.startsWith("image/"))return;const reader=new FileReader();reader.onload=e=>{const img=document.createElement("img");img.src=e.target.result;gallery.appendChild(img);};reader.readAsDataURL(file);});
});

async function uploadFotoJaminan(){
const file=document.getElementById("rentFotoJaminan").files[0];
if(!file)return{url:"",publicId:""};
const status=document.getElementById("rentUploadStatus");status.textContent="Mengupload foto jaminan...";
const fd=new FormData();fd.append("file",file);fd.append("upload_preset",CLOUDINARY_UPLOAD_PRESET);fd.append("folder","arctrans/jaminan");fd.append("public_id","JAMINAN_"+Date.now());
const response=await fetch("https://api.cloudinary.com/v1_1/"+CLOUDINARY_CLOUD_NAME+"/image/upload",{method:"POST",body:fd});
const result=await response.json();
if(!response.ok)throw new Error(result.error?.message||"Gagal upload foto jaminan.");
status.textContent="✓ Foto jaminan berhasil diupload.";
return{url:result.secure_url,publicId:result.public_id};
}
async function uploadFotoPengambilan(){
const files=Array.from(document.getElementById("rentFotoPengambilan").files);
if(!files.length)return[];
const status=document.getElementById("rentUploadStatusPengambilan"),hasil=[];
for(let i=0;i<files.length;i++){
const file=files[i];if(!file.type.startsWith("image/"))throw new Error("Semua dokumentasi pengambilan harus berupa gambar.");
status.textContent="Mengupload foto "+(i+1)+" dari "+files.length+"...";
const fd=new FormData();fd.append("file",file);fd.append("upload_preset",CLOUDINARY_UPLOAD_PRESET);fd.append("folder","arctrans/pengambilan-unit");fd.append("public_id","PENGAMBILAN_"+Date.now()+"_"+i);
const response=await fetch("https://api.cloudinary.com/v1_1/"+CLOUDINARY_CLOUD_NAME+"/image/upload",{method:"POST",body:fd});
const result=await response.json();if(!response.ok)throw new Error(result.error?.message||"Gagal upload dokumentasi unit.");
hasil.push({url:result.secure_url,publicId:result.public_id});
}
status.textContent="✓ "+hasil.length+" foto dokumentasi berhasil diupload.";
return hasil;
}

window.processRentOut=async function(){
if(!selectedBookingId||!selectedBookingData){alert("Data Booking tidak ditemukan.");return;}
const btn=document.getElementById("btnProcessRent");
const unitId=document.getElementById("rentPlat").value.trim();
const namaUnit=document.getElementById("rentNama").value.trim();

const harga=angkaDariRupiah(document.getElementById("rentHarga").value);
const tanggalsewa=document.getElementById("rentTanggalSewa").value;
const selesaisewa=document.getElementById("rentSelesaiSewa").value;

const bayar=angkaDariRupiah(document.getElementById("rentBayar").value);
const jaminan=document.getElementById("rentJaminan").value.trim();
const fotoJaminan=document.getElementById("rentFotoJaminan").files[0];
const fotoPengambilan=document.getElementById("rentFotoPengambilan").files;
const hariIni=getTanggalHariIni();

if(!unitId||!idcustomer||!customer||!rentaltype||harga<=0||!tanggalsewa||!selesaisewa||total<=0||!jaminan||!fotoJaminan||!fotoPengambilan.length){alert("Lengkapi semua data termasuk foto jaminan dan dokumentasi pengambilan unit.");return;}
if(tanggalsewa<hariIni){alert("Tanggal sewa tidak boleh sebelum hari ini.");return;}
if(rentaltype!=="setengahhari"&&selesaisewa<=tanggalsewa){alert("Tanggal selesai harus lebih besar dari tanggal sewa.");return;}

try{
btn.disabled=true;btn.textContent="Memeriksa Unit...";
const readySnapshot=await get(ref(db,"ready/"+unitId));
if(!readySnapshot.exists()){alert("⚠ UNIT SUDAH TIDAK TERSEDIA\\n\\nUnit "+unitId+" sudah tidak terdapat pada READY.\\n\\nTransaksi dibatalkan.");closeProcessModal();return;}

const jumlahHari=calculateDays(rentaltype,tanggalsewa,selesaisewa);
let sisa=0,kelebihanBayar=0,statusPembayaran="BELUM LUNAS";
if(bayar===total)statusPembayaran="LUNAS";
else if(bayar>total){kelebihanBayar=bayar-total;sisa=kelebihanBayar;statusPembayaran="LEBIH BAYAR";}
else sisa=-(total-bayar);

btn.textContent="Mengupload Foto...";
const hasilFoto=await uploadFotoJaminan();

const transaksiId=selectedBookingData.transaksiId||selectedBookingId;
const dataRent={
...selectedBookingData,
transaksiId,
unitId,plat:unitId,namaUnit,idcustomer,customer,hp,rentaltype,harga,hargaFormat:formatRupiah(harga),
tanggalsewa,selesaisewa,jumlahHari,total,totalFormat:formatRupiah(total),bayar,bayarFormat:formatRupiah(bayar),
sisa,sisaFormat:sisa===0?"0":sisa<0?"- "+formatRupiah(Math.abs(sisa)):"+ "+formatRupiah(sisa),
kelebihanBayar,kelebihanBayarFormat:formatRupiah(kelebihanBayar),statusPembayaran,jaminan,
fotoJaminan:hasilFoto.url,fotoJaminanPublicId:hasilFoto.publicId,fotoPengambilan:hasilPengambilan,
status:"RENT OUT",timestamp:Date.now(),tanggalInput:formatTanggalInput()
};

await set(ref(db,"rentout/"+transaksiId),dataRent);
await set(ref(db,"revenue/"+hariIni+"/"+transaksiId),{...dataRent,keterangan:"DP Mobil - "+unitId+" - "+namaUnit});
await remove(ref(db,"ready/"+unitId));
await update(ref(db,"unit/"+unitId),{keterangan:"Out"});

/* BOOKING DIHAPUS DARI Booking/{ID_TRANSAKSI} */
await remove(ref(db,"Booking/"+selectedBookingId));

alert("✓ RENT OUT BERHASIL\\n\\nID Rent Out: "+transaksiId+"\\n\\nID Booking: "+selectedBookingId+"\\n\\nUnit: "+unitId+"\\n\\nCustomer: "+customer+"\\n\\nStatus Pembayaran: "+statusPembayaran+"\\n\\nBooking telah dihapus.\\nUnit dipindahkan dari READY ke OUT.\\nData Revenue telah dibuat.");
closeProcessModal();
window.location.href="tabeloutrent.html";
}catch(error){console.error("ERROR RENT OUT:",error);alert("Gagal memproses Rent Out:\\n\\n"+error.message);}
finally{btn.disabled=false;btn.textContent="🚐 Proses Rent Out";}
};
