    <style>

    <script type="module">


        /* =================================

            getDatabase,
            ref,
            set
        }
        from

        /* =================================
           FIREBASE CONFIG
        ================================= */

        const firebaseConfig = {

            apiKey:
                "AIzaSyCOL9UC3tZOEX9ZwvY076O0yI5yqmYfb44",

            authDomain:
                "arctrans.firebaseapp.com",

            databaseURL:
                "https://arctrans-default-rtdb.asia-southeast1.firebasedatabase.app",

            projectId:
                "arctrans",

            storageBucket:
                "arctrans.firebasestorage.app",

            messagingSenderId:
                "60781918601",

            appId:
                "1:60781918601:web:c85d6131207f8a8958"

        };


        /* =================================
           INIT FIREBASE
        ================================= */

        const app =
            initializeApp(
                firebaseConfig
            );


        const db =

        /* =================================
           ELEMEN
        ================================= */

        const nama =
            document.getElementById("nama");

        const plat =
            document.getElementById("plat");

        const pajakstnk =
            document.getElementById("pajakstnk");

        const pajakbpkb =
            document.getElementById("pajakbpkb");

        const status =
            document.getElementById("status");

        const value =
            document.getElementById("value");

        const imageFile =
            document.getElementById("imageFile");

        const previewUnit =
            document.getElementById("previewUnit");


        const ktpFile =
            document.getElementById("ktpFile");

        const previewKTP =
            document.getElementById("previewKTP");

        const btnScanKTP =
            document.getElementById("btnScanKTP");

        const loadingKTP =
            document.getElementById("loadingKTP");

        const btnProses =
            document.getElementById("btnProses");


        /* =================================
           FORMAT RUPIAH
        ================================= */

        value.addEventListener(
            "input",
            function () {

                let angka =
                    this.value.replace(
                        /\D/g,
                        ""
                    );


                if (angka === "") {

                    this.value = "";

                    return;

                }


                this.value =
                    "Rp " +
                    angka.replace(
                        /\B(?=(\d{3})+(?!\d))/g,
                        "."
                    );

            }
        );


        /* =================================
           PLAT NOMOR HURUF BESAR
        ================================= */

        plat.addEventListener(
            "input",
            function () {

                this.value =
                    this.value.toUpperCase();

            }
        );


        /* =================================
           PREVIEW FOTO
        ================================= */

        function previewFoto(
            input,
            image
        ) {

            input.addEventListener(
                "change",
                function () {

                    const file =
                        this.files[0];


                    if (!file) {

                        image.src = "";

                        image.style.display =
                            "none";

                        return;

                    }


                    if (
                        !file.type.startsWith(
                            "image/"
                        )
                    ) {

                        alert(
                            "File harus berupa gambar!"
                        );

                        input.value = "";

                        return;

                    }


                    const reader =
                        new FileReader();


                    reader.onload =
                        function (event) {

                            image.src =
                                event.target.result;

                            image.style.display =
                                "block";

                        };


                    reader.readAsDataURL(
                        file
                    );

                }
            );

        }


        previewFoto(
            imageFile,
            previewUnit
        );


        previewFoto(
            ktpFile,
            previewKTP
        );


        /* =================================
           SCAN KTP
        ================================= */

        btnScanKTP.addEventListener(
            "click",
            async function () {


                const file =
                    ktpFile.files[0];


                if (!file) {

                    alert(
                        "Pilih foto KTP terlebih dahulu!"
                    );

                    return;

                }


                try {

                    btnScanKTP.disabled =
                        true;


                    loadingKTP.innerHTML =
                        "Menyiapkan OCR...";


                    const result =
                        await Tesseract.recognize(
                            file,
                            "eng",
                            {

                                logger:
                                    function (m) {

                                        console.log(m);


                                        if (
                                            m.status ===
                                            "recognizing text"
                                        ) {

                                            const persen =
                                                Math.round(
                                                    m.progress * 100
                                                );


                                            loadingKTP.innerHTML =
                                                "Membaca KTP: " +
                                                persen +
                                                "%";

                                        }

                                    }

                            }
                        );


                    const hasilOCR =
                        result.data.text;


                    console.log(
                        "HASIL OCR:",
                        hasilOCR
                    );


                    loadingKTP.innerHTML =
                        "Mengambil data KTP...";


                    bacaDataKTP(
                        hasilOCR
                    );


                    loadingKTP.innerHTML =
                        "✓ KTP berhasil dibaca";


                    alert(
                        "Scan selesai. Silakan periksa kembali data yang terbaca."
                    );


                } catch (error) {


                    console.error(
                        error
                    );


                    loadingKTP.innerHTML =
                        "Gagal membaca KTP";


                    alert(
                        "Gagal membaca KTP:\n" +
                        error.message
                    );


                } finally {

                    btnScanKTP.disabled =
                        false;

                }

            }
        );


        /* =================================
           FUNGSI BACA DATA KTP
        ================================= */

        function bacaDataKTP(text) {


            // Normalisasi teks

            text =
                text
                .replace(/\r/g, "")
                .replace(/O/g, "0");


            const lines =
                text
                .split("\n")
                .map(
                    line =>
                        line.trim()
                )
                .filter(
                    line =>
                        line.length > 0
                );


            console.log(
                "BARIS OCR:",
                lines
            );


            // =============================
            // NIK
            // =============================

            let nikMatch =
                text.match(
                    /\b\d{16}\b/
                );


            if (!nikMatch) {

                nikMatch =
                    text.match(
                        /\d[\d\s]{14,20}/
                    );

            }


            if (nikMatch) {

                const nik =
                    nikMatch[0]
                    .replace(
                        /\D/g,
                        ""
                    )
                    .substring(
                        0,
                        16
                    );


                document
                    .getElementById("nik")
                    .value =
                    nik;

            }


            // =============================
            // NAMA
            // =============================

            const namaMatch =
                text.match(
                    /Nama\s*[:\-]?\s*([^\n]+)/i
                );


            if (namaMatch) {

                document
                    .getElementById("namaKTP")
                    .value =
                    namaMatch[1]
                    .trim();

            }


            // =============================
            // TEMPAT TGL LAHIR
            // =============================

            const lahirMatch =
                text.match(
                    /(Tempat\s*\/?\s*Tgl\.?\s*Lahir|Tempat\s*Tanggal\s*Lahir)\s*[:\-]?\s*([^\n]+)/i
                );


            if (lahirMatch) {

                document
                    .getElementById(
                        "tempatTanggalLahir"
                    )
                    .value =
                    lahirMatch[2]
                    .trim();

            }


            // =============================
            // JENIS KELAMIN
            // =============================

            const kelaminMatch =
                text.match(
                    /Jenis\s*Kelamin\s*[:\-]?\s*([^\n]+)/i
                );


            if (kelaminMatch) {

                document
                    .getElementById(
                        "jenisKelamin"
                    )
                    .value =
                    kelaminMatch[1]
                    .trim();

            }


            // =============================
            // ALAMAT
            // =============================

            const alamatMatch =
                text.match(
                    /Alamat\s*[:\-]?\s*([^\n]+)/i
                );


            if (alamatMatch) {

                document
                    .getElementById(
                        "alamat"
                    )
                    .value =
                    alamatMatch[1]
                    .trim();

            }


            // =============================
            // RT RW
            // =============================

            const rtrwMatch =
                text.match(
                    /RT\s*\/?\s*RW\s*[:\-]?\s*([^\n]+)/i
                );


            if (rtrwMatch) {

                document
                    .getElementById(
                        "rtrw"
                    )
                    .value =
                    rtrwMatch[1]
                    .trim();

            }


            // =============================
            // KELURAHAN DESA
            // =============================

            const kelurahanMatch =
                text.match(
                    /(Kel\s*\/?\s*Desa|Kelurahan|Desa)\s*[:\-]?\s*([^\n]+)/i
                );


            if (kelurahanMatch) {

                document
                    .getElementById(
                        "kelurahan"
                    )
                    .value =
                    kelurahanMatch[2]
                    .trim();

            }


            // =============================
            // KECAMATAN
            // =============================

            const kecamatanMatch =
                text.match(
                    /Kecamatan\s*[:\-]?\s*([^\n]+)/i
                );


            if (kecamatanMatch) {

                document
                    .getElementById(
                        "kecamatan"
                    )
                    .value =
                    kecamatanMatch[1]
                    .trim();

            }


            // =============================
            // AGAMA
            // =============================

            const agamaMatch =
                text.match(
                    /Agama\s*[:\-]?\s*([^\n]+)/i
                );


            if (agamaMatch) {

                document
                    .getElementById(
                        "agama"
                    )
                    .value =
                    agamaMatch[1]
                    .trim();

            }


            // =============================
            // STATUS KAWIN
            // =============================

            const statusMatch =
                text.match(
                    /Status\s*Perkawinan\s*[:\-]?\s*([^\n]+)/i
                );


            if (statusMatch) {

                document
                    .getElementById(
                        "statusKawin"
                    )
                    .value =
                    statusMatch[1]
                    .trim();

            }


            // =============================
            // PEKERJAAN
            // =============================

            const pekerjaanMatch =
                text.match(
                    /Pekerjaan\s*[:\-]?\s*([^\n]+)/i
                );


            if (pekerjaanMatch) {

                document
                    .getElementById(
                        "pekerjaan"
                    )
                    .value =
                    pekerjaanMatch[1]
                    .trim();

            }


            // =============================
            // KEWARGANEGARAAN
            // =============================

            const wargaMatch =
                text.match(
                    /Kewarganegaraan\s*[:\-]?\s*([^\n]+)/i
                );


            if (wargaMatch) {

                document
                    .getElementById(
                        "kewarganegaraan"
                    )
                    .value =
                    wargaMatch[1]
                    .trim();

            }


        }


        /* =================================
           UPLOAD CLOUDINARY
        ================================= */

        async function uploadCloudinary(
            file,
            folder
        ) {


            if (!file) {

                return "";

            }


            const formData =
                new FormData();


            formData.append(
                "file",
                file
            );


            formData.append(
                "upload_preset",
                "arctrans"
            );


            formData.append(
                "folder",
                folder
            );


            const uniqueId =
                Date.now() +
                "_" +
                Math.floor(
                    Math.random() * 100000
                );


            formData.append(
                "public_id",
                uniqueId
            );


            const response =
                await fetch(

                    "https://api.cloudinary.com/v1_1/cesiolzm/image/upload",

                    {

                        method:
                            "POST",

                        body:
                            formData

                    }

                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(

                    data.error?.message ||
                    "Upload foto gagal"

                );

            }


            return data.secure_url;

        }


        /* =================================
           SIMPAN DATA
        ================================= */

        btnProses.addEventListener(
            "click",
            kirimData
        );


        async function kirimData() {


            const namaValue =
                nama.value.trim();


            const platValue =
                plat.value.trim();


            const fileUnit =
                imageFile.files[0];


            const fileKTP =
                ktpFile.files[0];


            // VALIDASI

            if (!namaValue) {

                alert(
                    "Nama wajib diisi!"
                );

                nama.focus();

                return;

            }


            if (!platValue) {

                alert(
                    "Plat nomor wajib diisi!"
                );

                plat.focus();

                return;

            }


            if (!fileUnit) {

                alert(
                    "Foto unit wajib dipilih!"
                );

                return;

            }


            if (!fileKTP) {

                alert(
                    "Foto KTP wajib dipilih!"
                );

                return;

            }


            try {


                btnProses.disabled =
                    true;


                btnProses.innerHTML =
                    "Mengupload Foto...";


                // =========================
                // UPLOAD FOTO UNIT
                // =========================

                const fotoUnit =
                    await uploadCloudinary(

                        fileUnit,

                        "arctrans/unit"

                    );


                // =========================
                // UPLOAD FOTO KTP
                // =========================

                const fotoKTP =
                    await uploadCloudinary(

                        fileKTP,

                        "arctrans/ktp"

                    );


                btnProses.innerHTML =
                    "Menyimpan Data...";


                // =========================
                // VALUE RUPIAH
                // =========================

                const valueAngka =
                    Number(

                        value.value.replace(
                            /\D/g,
                            ""
                        )

                    ) || 0;


                // =========================
                // ID FIREBASE
                // =========================

                const id =
                    platValue

                    .replace(
                        /[.#$[\]/]/g,
                        "_"
                    )

                    .replace(
                        /\s+/g,
                        "_"
                    )

                    .toUpperCase();


                // =========================
                // DATA
                // =========================

                const dataSimpan = {


                    // DATA UNIT

                    nama:
                        namaValue,

                    plat:
                        platValue,

                    stnk:
                        pajakstnk.value,

                    bpkb:
                        pajakbpkb.value,

                    status:
                        status.value.trim(),

                    value:
                        valueAngka,

                    valueFormat:
                        "Rp " +
                        valueAngka
                        .toLocaleString(
                            "id-ID"
                        ),

                    photoUnit:
                        fotoUnit,


                    // DATA KTP

                    nik:
                        document
                        .getElementById("nik")
                        .value
                        .trim(),

                    namaKTP:
                        document
                        .getElementById("namaKTP")
                        .value
                        .trim(),

                    tempatTanggalLahir:
                        document
                        .getElementById(
                            "tempatTanggalLahir"
                        )
                        .value
                        .trim(),

                    jenisKelamin:
                        document
                        .getElementById(
                            "jenisKelamin"
                        )
                        .value
                        .trim(),
