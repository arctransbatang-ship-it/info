<style>

    * {

        box-sizing:
            border-box;

        font-family:
            "Segoe UI",
            Arial,
            sans-serif;

    }


    :root {

        --primary:
            #2196F3;

        --primary-dark:
            #1976D2;

        --secondary:
            #21CBF3;

        --success:
            #16a34a;

        --danger:
            #dc2626;

        --warning:
            #f59e0b;

        --text:
            #1e293b;

        --muted:
            #64748b;

        --border:
            #dbe3ee;

    }


    body {

        margin:
            0;

        min-height:
            100vh;

        background:
            linear-gradient(
                135deg,
                #e0f2fe,
                #f8fafc
            );

        color:
            var(--text);

        padding:
            20px;

    }


    /* =============================
       HEADER
    ============================== */

    .topbar {

        width:
            100%;

        max-width:
            850px;

        margin:
            0 auto 20px;

        display:
            flex;

        align-items:
            center;

        justify-content:
            space-between;

    }


    .brand {

        display:
            flex;

        align-items:
            center;

        gap:
            12px;

    }


    .brand-icon {

        width:
            45px;

        height:
            45px;

        border-radius:
            14px;

        display:
            flex;

        align-items:
            center;

        justify-content:
            center;

        background:
            linear-gradient(
                135deg,
                var(--primary),
                var(--secondary)
            );

        color:
            white;

        font-size:
            22px;

        box-shadow:
            0 8px 20px
            rgba(
                33,
                150,
                243,
                0.25
            );

    }


    .brand-text h1 {

        margin:
            0;

        font-size:
            20px;

    }


    .brand-text p {

        margin:
            3px 0 0;

        font-size:
            12px;

        color:
            var(--muted);

    }


    .home-btn {

        display:
            inline-flex;

        align-items:
            center;

        justify-content:
            center;

        gap:
            7px;

        padding:
            10px 16px;

        border-radius:
            12px;

        text-decoration:
            none;

        background:
            white;

        color:
            var(--primary);

        font-weight:
            700;

        box-shadow:
            0 4px 15px
            rgba(
                0,
                0,
                0,
                0.08
            );

        transition:
            0.2s;

    }


    .home-btn:hover {

        transform:
            translateY(-2px);

        background:
            var(--primary);

        color:
            white;

    }


    /* =============================
       CONTAINER
    ============================== */

    .container {

        width:
            100%;

        max-width:
            850px;

        margin:
            auto;

        background:
            white;

        border-radius:
            24px;

        padding:
            32px;

        box-shadow:
            0 15px 45px
            rgba(
                15,
                23,
                42,
                0.12
            );

        animation:
            fadeIn
            0.4s
            ease;

    }


    @keyframes fadeIn {

        from {

            opacity:
                0;

            transform:
                translateY(15px);

        }

        to {

            opacity:
                1;

            transform:
                translateY(0);

        }

    }


    .form-title {

        margin-bottom:
            30px;

    }


    .form-title h2 {

        margin:
            0 0 6px;

        font-size:
            25px;

    }


    .form-title p {

        margin:
            0;

        color:
            var(--muted);

        font-size:
            14px;

    }


    /* =============================
       LOADING
    ============================== */

    .loading {

        display:
            flex;

        align-items:
            center;

        justify-content:
            center;

        gap:
            10px;

        padding:
            15px;

        margin-bottom:
            20px;

        border-radius:
            12px;

        background:
            #eff6ff;

        color:
            #1d4ed8;

        font-weight:
            600;

    }


    .loading.hidden {

        display:
            none;

    }


    .error-box {

        display:
            none;

        padding:
            15px;

        margin-bottom:
            20px;

        border-radius:
            12px;

        background:
            #fef2f2;

        color:
            #dc2626;

        font-weight:
            600;

    }


    .error-box.active {

        display:
            block;

    }


    /* =============================
       FORM
    ============================== */

    .form-grid {

        display:
            grid;

        grid-template-columns:
            repeat(
                2,
                minmax(0, 1fr)
            );

        gap:
            20px;

    }


    .form-group {

        width:
            100%;

    }


    .full-width {

        grid-column:
            1 / -1;

    }


    label {

        display:
            block;

        margin-bottom:
            8px;

        font-size:
            13px;

        font-weight:
            700;

        color:
            #334155;

    }


    input {

        width:
            100%;

        min-height:
            48px;

        padding:
            12px 14px;

        border:
            1px solid
            var(--border);

        border-radius:
            12px;

        background:
            #f8fafc;

        font-size:
            14px;

        outline:
            none;

        color:
            #334155;

    }


    input:focus {

        border-color:
            var(--primary);

        box-shadow:
            0 0 0 4px
            rgba(
                33,
                150,
                243,
                0.12
            );

    }


    /* =============================
       STATUS PEMBAYARAN
    ============================== */

    .status-box {

        display:
            none;

        padding:
            14px;

        margin-top:
            10px;

        border-radius:
            10px;

        font-size:
            14px;

        font-weight:
            700;

    }


    .status-box.active {

        display:
            block;

    }


    .status-lunas {

        background:
            #dcfce7;

        color:
            #15803d;

    }


    .status-belum {

        background:
            #fef3c7;

        color:
            #92400e;

    }


    .status-lebih {

        background:
            #dbeafe;

        color:
            #1d4ed8;

    }


    /* =============================
       FOTO JAMINAN
    ============================== */

    .preview-container {

        width:
            100%;

        margin-top:
            10px;

        text-align:
            center;

    }


    #previewFoto {

        display:
            none;

        width:
            100%;

        max-height:
            450px;

        object-fit:
            contain;

        border-radius:
            15px;

        border:
            2px dashed
            var(--primary);

        padding:
            8px;

        background:
            #f8fafc;

    }


    #fotoStatus {

        min-height:
            20px;

        margin-top:
            10px;

        font-size:
            13px;

        color:
            var(--muted);

    }


    /* =============================
       BUTTON
    ============================== */

    .action-area {

        margin-top:
            30px;

        display:
            grid;

        grid-template-columns:
            repeat(
                2,
                1fr
            );

        gap:
            15px;

    }


    button {

        width:
            100%;

        min-height:
            52px;

        border:
            none;

        border-radius:
            14px;

        color:
            white;

        font-size:
            15px;

        font-weight:
            700;

        cursor:
            pointer;

        transition:
            0.2s;

    }


    .btn-kembali {

        background:
            #64748b;

    }


    .btn-kembali:hover {

        transform:
            translateY(-2px);

        background:
            #475569;

    }


    .btn-selesai {

        background:
            linear-gradient(
                135deg,
                #16a34a,
                #22c55e
            );

        box-shadow:
            0 8px 20px
            rgba(
                34,
                197,
                94,
                0.25
            );

    }


    .btn-selesai:hover {

        transform:
            translateY(-2px);

    }

        max-width: 700px

            padding:

            gap:
                16px;

        }

                16px;

            flex;

        overflow-y:
            auto;

        background:
            white;

            22px;

        padding:
            28px;

                0,
                0,
                0,
                .25
            );

    }

        margin:

        font-size:
            22px;

    }


    .modal-subtitle {

        margin:
            0 0 20px;

        color:
            var(--muted);

        font-size:
            14px;

    }


    .modal-form {

        display:
            grid;

        gap:
            16px;

    }


    .modal-info,

        padding:
            14px;

        border-radius:
            12px;

        margin-bottom:
            14px;

    }


    .modal-info {

        background:
            #eff6ff;

        color:
            #1e40af;

    }


    .pembayaran-status {

        font-weight:
            700;

    }


    .pembayaran-status.lunas {

        background:
            #dcfce7;

        color:
            #15803d;

    }


    .pembayaran-status.kurang {

        background:
            #fef3c7;

        color:
            #92400e;

    }


    .pembayaran-status.lebih {

        background:
            #dbeafe;

        color:
            #1d4ed8;

    }


    .rincian-total {

        background:

    }

    .modal-actions {

</style>

    }



    /* =================================
       FORMAT RENTAL TYPE
    ================================= */

    function formatRentalType(
        rentaltype
    ) {

        const dataFormat = {

            setengahhari:
                "Setengah Hari",

            harian:
                "Harian",

            mingguan:
                "Mingguan",

            bulanan:
                "Bulanan"

        };


        return (
            dataFormat[
                rentaltype
            ]
            ||
            rentaltype
            ||
            "-"
        );

    }



    /* =================================
       FORMAT TANGGAL TRANSAKSI
    ================================= */

    function getTanggalTransaksi() {

        const sekarang =
            new Date();


        const tahun =
            sekarang.getFullYear();


        const bulan =
            String(
                sekarang.getMonth() + 1
            ).padStart(
                2,
                "0"
            );


        const tanggal =
            String(
                sekarang.getDate()
            ).padStart(
                2,
                "0"
            );


        return (
            tahun +
            "-" +
            bulan +
            "-" +
            tanggal
        );

    }



    /* =================================
       TAMPIL ERROR
    ================================= */

    function tampilError(
        pesan
    ) {

        errorBox.textContent =
            "⚠ " +
            pesan;


        errorBox.className =
            "error-box active";


        loading.classList.add(
            "hidden"
        );

    }



    /* =================================
       VALIDASI ID URL
    ================================= */

    if (
        !transaksiId
    ) {

        tampilError(
            "ID transaksi tidak ditemukan pada URL."
        );


        btnSelesai.disabled =
            true;


        btnSelesai.textContent =
            "Data Tidak Ditemukan";

    }

    else {

        ambilDataRentOut();

    }



    /* =================================
       AMBIL DATA RENT OUT
    ================================= */

    async function ambilDataRentOut() {

        try {


            const rentRef =
                ref(

                    db,

                    "rentout/" +
                    transaksiId

                );


            const snapshot =
                await get(
                    rentRef
                );


            if (
                !snapshot.exists()
            ) {

                tampilError(
                    "Data RENT OUT dengan ID " +
                    transaksiId +
                    " tidak ditemukan."
                );


                btnSelesai.disabled =
                    true;


                btnSelesai.textContent =
                    "Data Tidak Ditemukan";


                return;

            }


            const data =
                snapshot.val();


            dataTransaksi =
                data;



            /* =========================
               ID UNIT / PLAT
            ========================== */

            platInput.value =
                data.plat ||
                data.unitId ||
                "";


            namaInput.value =
                data.namaUnit ||
                "";


            idCustomerInput.value =
                data.idcustomer ||
                "";


            customerInput.value =
                data.customer ||
                "";


            rentalTypeInput.value =
                formatRentalType(
                    data.rentaltype
                );


            hargaInput.value =
                data.hargaFormat ||

                formatRupiah(
                    data.harga
                );


            tanggalSewaInput.value =
                data.tanggalsewa ||
                "";


            selesaiSewaInput.value =
                data.selesaisewa ||
                "";


            totalInput.value =
                data.totalFormat ||

                formatRupiah(
                    data.total
                );


            bayarInput.value =
                data.bayarFormat ||

                formatRupiah(
                    data.bayar
                );



            /* =========================
               STATUS PEMBAYARAN
            ========================== */

            if (

                data.statusPembayaran ===
                "LUNAS"

            ) {

                sisaInput.value =
                    "LUNAS";


                statusPembayaran.className =
                    "status-box active status-lunas";


                statusPembayaran.textContent =
                    "✓ Status Pembayaran: LUNAS";

            }


            else if (

                data.statusPembayaran ===
                "LEBIH BAYAR"

            ) {

                const lebihBayar =
                    data.kelebihanBayar || 0;


                sisaInput.value =
                    "+ " +
                    formatRupiah(
                        lebihBayar
                    );


                statusPembayaran.className =
                    "status-box active status-lebih";


                statusPembayaran.textContent =
                    "＋ Kelebihan pembayaran: " +
                    formatRupiah(
                        lebihBayar
                    );

            }


            else {

                sisaInput.value =
                    data.sisaFormat ||

                    formatRupiah(
                        data.sisa
                    );


                statusPembayaran.className =
                    "status-box active status-belum";


                statusPembayaran.textContent =
                    "Sisa pembayaran: " +

                    (
                        data.sisaFormat ||

                        formatRupiah(
                            data.sisa
                        )
                    );

            }



            /* =========================
               JAMINAN
            ========================== */

            jaminanInput.value =
                data.jaminan ||
                "";



            /* =========================
               FOTO JAMINAN
            ========================== */

            if (
                data.fotoJaminan
            ) {

                previewFoto.src =
                    data.fotoJaminan;


                previewFoto.style.display =
                    "block";


                fotoStatus.textContent =
                    "✓ Foto jaminan berhasil dimuat";

            }

            else {

                previewFoto.style.display =
                    "none";


                fotoStatus.textContent =
                    "Foto jaminan tidak tersedia";

            }


            loading.classList.add(
                "hidden"
            );


            console.log(
                "Data RENT OUT berhasil dimuat:",
                data
            );

        }


        catch (
            error
        ) {

            console.error(
                "Gagal mengambil data:",
                error
            );


            tampilError(
                "Gagal mengambil data: " +
                error.message
            );


            btnSelesai.disabled =
                true;


            btnSelesai.textContent =
                "Terjadi Kesalahan";

        }

    }



    /* =================================
       ELEMEN POPUP
    ================================= */

    const modalSelesai =
        document.getElementById(
            "modalSelesai"
        );


    const jumlahHariSelesai =
        document.getElementById(
            "jumlahHariSelesai"
        );


    const hargaSewaHarian =
        document.getElementById(
            "hargaSewaHarian"
        );


    const jamKeterlambatan =
        document.getElementById(
            "jamKeterlambatan"
        );


    const biayaPerJam =
        document.getElementById(
            "biayaPerJam"
        );


    const statusSaldoModal =
        document.getElementById(
            "statusSaldoModal"
        );


    const rincianPembayaranModal =
        document.getElementById(
            "rincianPembayaranModal"
        );


    const infoUnitModal =
        document.getElementById(
            "infoUnitModal"
        );


    const btnBatalModal =
        document.getElementById(
            "btnBatalModal"
        );


    const btnKonfirmasiSelesai =
        document.getElementById(
            "btnKonfirmasiSelesai"
        );



    /* =================================
       HITUNG JUMLAH HARI
    ================================= */

    function hitungJumlahHariRental() {

        if (
            !dataTransaksi?.tanggalsewa
        ) {

            return 1;

        }


        const mulai =
            new Date(

                dataTransaksi.tanggalsewa +
                "T00:00:00"

            );


        const hariIni =
            new Date();


        hariIni.setHours(
            0,
            0,
            0,
            0
        );


        return Math.max(

            1,

            Math.floor(

                (
                    hariIni -
                    mulai
                )

                /

                (
                    1000 *
                    60 *
                    60 *
                    24
                )

            ) + 1

        );

    }



    /* =================================
       AMBIL JUMLAH DP
    ================================= */

    function ambilJumlahDP() {

        if (
            !dataTransaksi
        ) {

            return 0;

        }


        return Math.max(

            0,

            Number(
                dataTransaksi.bayar
            ) || 0

        );

    }



    /* =================================
       HITUNG BIAYA SEWA
    ================================= */

    function hitungBiayaSewa() {

        const jumlahHari =
            Math.max(

                1,

                Number(
                    jumlahHariSelesai.value
                ) || 1

            );


        const hargaHarian =
            Math.max(

                0,

                Number(
                    dataTransaksi?.harga
                ) || 0

            );


        return (
            jumlahHari *
            hargaHarian
        );

    }



    /* =================================
       KONVERSI RUPIAH
    ================================= */

    function angkaDariRupiah(
        nilai
    ) {

        return Number(

            String(
                nilai || ""
            )

            .replace(
                /[^\d]/g,
                ""
            )

        ) || 0;

    }



    function formatInputRupiah(
        input
    ) {

        const angka =
            angkaDariRupiah(
                input.value
            );


        input.value =
            "Rp " +

            angka.toLocaleString(
                "id-ID"
            );

    }



    /* =================================
       HITUNG KETERLAMBATAN
    ================================= */

    function hitungTotalKeterlambatan() {

        const jam =
            Math.max(

                0,

                Number(
                    jamKeterlambatan.value
                ) || 0

            );


        const biaya =
            angkaDariRupiah(
                biayaPerJam.value
            );


        return (
            jam *
            biaya
        );

    }



    /* =================================
       UPDATE RINCIAN PEMBAYARAN
    ================================= */

    function updateRincianPembayaran() {

        const jumlahDP =
            ambilJumlahDP();


        const biayaSewa =
            hitungBiayaSewa();


        const totalTerlambat =
            hitungTotalKeterlambatan();


        const totalTagihan =
            biayaSewa +
            totalTerlambat;


        const totalAkhir =
            totalTagihan -
            jumlahDP;


        statusSaldoModal.className =
            "pembayaran-status dp-info";


        statusSaldoModal.textContent =
            "Jumlah DP yang sudah dibayarkan: " +

            formatRupiah(
                jumlahDP
            );


        rincianPembayaranModal.innerHTML =

            '<div class="baris dp-row">' +

                '<span>Jumlah DP</span>' +

                '<strong>' +

                    formatRupiah(
                        jumlahDP
                    ) +

                '</strong>' +

            '</div>' +


            '<div class="baris">' +

                '<span>Biaya Sewa</span>' +

                '<strong>' +

                    formatRupiah(
                        biayaSewa
                    ) +

                '</strong>' +

            '</div>' +


            '<div class="baris">' +

                '<span>Biaya Keterlambatan</span>' +

                '<strong>' +

                    formatRupiah(
                        totalTerlambat
                    ) +

                '</strong>' +

            '</div>' +


            '<div class="baris total-akhir">' +

                '<span>' +

                    (

                        totalAkhir > 0

                            ? "Total Harus Dibayar"

                            : totalAkhir < 0

                                ? "Kelebihan Pembayaran"

                                : "Status Akhir"

                    ) +

                '</span>' +


                '<strong>' +

                    (

                        totalAkhir === 0

                            ? "LUNAS"

                            : formatRupiah(

                                Math.abs(
                                    totalAkhir
                                )

                            )

                    ) +

                '</strong>' +

            '</div>';


        return {

            jumlahDP,

            biayaSewa,

            totalTerlambat,

            totalTagihan,

            totalAkhir

        };

    }



    /* =================================
       EVENT UPDATE PERHITUNGAN
    ================================= */

    function updateSemuaPerhitungan() {

        updateRincianPembayaran();

    }


    jumlahHariSelesai.addEventListener(

        "input",

        updateSemuaPerhitungan

    );


    jamKeterlambatan.addEventListener(

        "input",

        updateSemuaPerhitungan

    );


    biayaPerJam.addEventListener(

        "input",

        function () {

            formatInputRupiah(
                biayaPerJam
            );


            updateSemuaPerhitungan();

        }

    );



    /* =================================
       BUKA POPUP SELESAI
    ================================= */

    btnSelesai.addEventListener(

        "click",

        function () {

            if (
                !dataTransaksi
            ) {

                alert(
                    "Data transaksi belum tersedia."
                );

                return;

            }


            jumlahHariSelesai.value =
                hitungJumlahHariRental();


            hargaSewaHarian.value =
                formatRupiah(

                    Math.max(

                        0,

                        Number(
                            dataTransaksi.harga
                        ) || 0

                    )

                );


            jamKeterlambatan.value =
                0;


            biayaPerJam.value =
                "Rp 0";


            infoUnitModal.innerHTML =

                "<strong>Unit:</strong> " +

                (
                    dataTransaksi.plat ||
                    dataTransaksi.unitId ||
                    "-"
                ) +

                "<br>" +

                "<strong>Customer:</strong> " +

                (
                    dataTransaksi.customer ||
                    "-"
                ) +

                "<br>" +

                "<strong>Harga Harian:</strong> " +

                formatRupiah(

                    Number(
                        dataTransaksi.harga
                    ) || 0

                );


            updateSemuaPerhitungan();


            modalSelesai.classList.add(
                "active"
            );

        }

    );



    /* =================================
       TUTUP MODAL
    ================================= */

    btnBatalModal.addEventListener(

        "click",

        function () {

            modalSelesai.classList.remove(
                "active"
            );

        }

    );


    modalSelesai.addEventListener(

        "click",

        function (
            event
        ) {

            if (
                event.target ===
                modalSelesai
            ) {

                modalSelesai.classList.remove(
                    "active"
                );

            }

        }

    );



    /* =================================
       KONFIRMASI SELESAI RENTAL
    ================================= */

    btnKonfirmasiSelesai.addEventListener(

        "click",

        async function () {


            if (
                !dataTransaksi
            ) {

                return;

            }


            /* =========================
               AMBIL INPUT
            ========================== */

            const jumlahHari =
                Math.max(

                    1,

                    Number(
                        jumlahHariSelesai.value
                    ) || 1

                );


            const jamTerlambat =
                Math.max(

                    0,

                    Number(
                        jamKeterlambatan.value
                    ) || 0

                );


            const biayaTerlambatPerJam =
                Math.max(

                    0,

                    angkaDariRupiah(
                        biayaPerJam.value
                    )

                );


            /* =========================
               HITUNG RINGKASAN
            ========================== */

            const ringkasan =
                updateRincianPembayaran();


            /* =========================
               KONFIRMASI USER
            ========================== */

            const konfirmasi =
                confirm(

                    "Konfirmasi penyelesaian rental?\n\n" +

                    "Jumlah Hari Rental: " +
                    jumlahHari +
                    " hari\n" +

                    "Biaya Sewa: " +

                    formatRupiah(
                        ringkasan.biayaSewa
                    ) +

                    "\n" +

                    "Keterlambatan: " +
                    jamTerlambat +
                    " jam\n" +

                    "Biaya Keterlambatan: " +

                    formatRupiah(
                        ringkasan.totalTerlambat
                    ) +

                    "\n" +

                    "Jumlah DP: " +

                    formatRupiah(
                        ringkasan.jumlahDP
                    ) +

                    "\n\n" +

                    "Total Akhir: " +

                    (

                        ringkasan.totalAkhir === 0

                            ? "LUNAS"

                            : formatRupiah(

                                Math.abs(
                                    ringkasan.totalAkhir
                                )

                            )

                    )

                );


            if (
                !konfirmasi
            ) {

                return;

            }



            try {


                /* =========================
                   DISABLE BUTTON
                ========================== */

                btnKonfirmasiSelesai.disabled =
                    true;


                btnKonfirmasiSelesai.textContent =
                    "Memproses...";


                btnSelesai.disabled =
                    true;



                /* =========================
                   WAKTU TRANSAKSI
                ========================== */

                const timestamp =
                    Date.now();


                const tanggalTransaksi =
                    getTanggalTransaksi();



                /* =========================
                   UPDATE RENTOUT
                ========================== */

                await update(

                    ref(

                        db,

                        "rentout/" +
                        transaksiId

                    ),

                    {

                        status:
                            "SELESAI RENTAL",


                        jumlahHariSelesai:
                            jumlahHari,


                        biayaSewa:
                            ringkasan.biayaSewa,


                        jamKeterlambatan:
                            jamTerlambat,


                        biayaKeterlambatanPerJam:
                            biayaTerlambatPerJam,


                        totalKeterlambatan:
                            ringkasan.totalTerlambat,


                        jumlahDP:
                            ringkasan.jumlahDP,


                        totalTagihanAkhir:
                            ringkasan.totalAkhir,


                        statusPembayaranAkhir:

                            ringkasan.totalAkhir === 0

                                ? "LUNAS"

                                : ringkasan.totalAkhir > 0

                                    ? "KURANG BAYAR"

                                    : "KELEBIHAN BAYAR",


                        tanggalSelesaiRental:
                            new Date().toISOString(),


                        timestampSelesai:
                            timestamp

                    }

                );



                /* =============================
                   SIMPAN REVENUE

                   HANYA JIKA NILAI
                   YANG HARUS DIBAYAR
                   BERNILAI POSITIF
                ============================== */

                if (
                    ringkasan.totalAkhir > 0
                ) {


                    await set(

                        ref(

                            db,

                            "revenue/" +
                            tanggalTransaksi +
                            "/" +
                            transaksiId

                        ),

                        {

                            /* =================
                               ID TRANSAKSI
                            ================= */

                            id:
                                transaksiId,


                            idTransaksi:
                                transaksiId,


                            /* =================
                               TANGGAL
                            ================= */

                            tanggal:
                                tanggalTransaksi,


                            timestamp:
                                timestamp,


                            /* =================
                               DATA CUSTOMER
                            ================= */

                            customer:
                                dataTransaksi.customer || "",


                            idcustomer:
                                dataTransaksi.idcustomer || "",


                            alamatktp:
                                dataTransaksi.alamatktp || "",


                            /* =================
                               DATA UNIT
                            ================= */

                            unitId:
                                dataTransaksi.unitId || "",


                            plat:
                                dataTransaksi.plat ||
                                dataTransaksi.unitId ||
                                "",


                            namaUnit:
                                dataTransaksi.namaUnit || "",


                            /* =================
                               NILAI REVENUE
                            ================= */

                            bayar:
                                ringkasan.totalAkhir,


                            bayarFormat:
                                formatRupiah(
                                    ringkasan.totalAkhir
                                ),


                            value:
                                ringkasan.totalAkhir,


                            valueFormat:
                                formatRupiah(
                                    ringkasan.totalAkhir
                                ),


                            /* =================
                               DATA RENTAL
                            ================= */

                            rentaltype:
                                dataTransaksi.rentaltype || "",


                            harga:
                                Number(
                                    dataTransaksi.harga
                                ) || 0,


                            hargaFormat:
                                formatRupiah(

                                    Number(
                                        dataTransaksi.harga
                                    ) || 0

                                ),


                            jumlahHariSelesai:
                                jumlahHari,


                            biayaSewa:
                                ringkasan.biayaSewa,


                            totalKeterlambatan:
                                ringkasan.totalTerlambat,


                            totalTagihan:
                                ringkasan.totalTagihan,


                            /* =================
                               KETERANGAN
                            ================= */

                            keterangan:
                                "Pelunasan Selesai Rental",


                            jenisTransaksi:
                                "REVENUE",


                            status:
                                "SELESAI RENTAL"

                        }

                    );


                    console.log(

                        "Revenue berhasil ditambahkan:",

                        "revenue/" +
                        tanggalTransaksi +
                        "/" +
                        transaksiId

                    );

                }



                /* =============================
                   UPDATE STATUS UNIT

                   unit/{unitId}
                ============================== */

                if (
                    dataTransaksi.unitId
                ) {

                    await update(

                        ref(

                            db,

                            "unit/" +
                            dataTransaksi.unitId

                        ),

                        {

                            keterangan:
                                "Ready"

                        }

                    );

                }



                /* =============================
                   TAMBAHKAN UNIT KE READY

                   ready/{PLAT NOMOR}
                ============================== */

                const platKendaraan =
                    dataTransaksi.plat ||
                    dataTransaksi.unitId ||
                    transaksiId;


                await set(

                    ref(

                        db,

                        "ready/" +
                        platKendaraan

                    ),

                    {

                        id:
                            dataTransaksi.unitId || "",


                        unitId:
                            dataTransaksi.unitId || "",


                        plat:
                            platKendaraan,


                        nama:
                            dataTransaksi.namaUnit || "",


                        namaUnit:
                            dataTransaksi.namaUnit || "",


                        keterangan:
                            "Ready",


                        timestamp:
                            timestamp

                    }

                );



                /* =============================
                   PESAN BERHASIL
                ============================== */

                let pesanBerhasil =

                    "Rental berhasil diselesaikan!\n\n" +

                    "Biaya Sewa: " +

                    formatRupiah(
                        ringkasan.biayaSewa
                    ) +

                    "\n" +

                    "Biaya Keterlambatan: " +

                    formatRupiah(
                        ringkasan.totalTerlambat
                    ) +

                    "\n" +

                    "Jumlah DP: " +

                    formatRupiah(
                        ringkasan.jumlahDP
                    ) +

                    "\n\n";


                if (
                    ringkasan.totalAkhir > 0
                ) {

                    pesanBerhasil +=

                        "Revenue Ditambahkan: " +

                        formatRupiah(
                            ringkasan.totalAkhir
                        ) +

                        "\nTanggal Transaksi: " +

                        tanggalTransaksi +

                        "\n\n";

                }


                else if (
                    ringkasan.totalAkhir === 0
                ) {

                    pesanBerhasil +=

                        "Status Pembayaran: LUNAS\n\n";

                }


                else {

                    pesanBerhasil +=

                        "Kelebihan Pembayaran: " +

                        formatRupiah(

                            Math.abs(
                                ringkasan.totalAkhir
                            )

                        ) +

                        "\n\n";

                }


                pesanBerhasil +=

                    "Unit berhasil dikembalikan ke status Ready.";


                alert(
                    pesanBerhasil
                );



                /* =============================
                   KEMBALI KE TABEL
                ============================== */

                window.location.href =
                    "tabeloutrent.html";

            }


            catch (
                error
            ) {


                console.error(

                    "Gagal menyelesaikan rental:",

                    error

                );


                alert(

                    "Gagal menyelesaikan rental:\n\n" +

                    error.message

                );


                btnKonfirmasiSelesai.disabled =
                    false;


                btnKonfirmasiSelesai.textContent =
                    "✓ Konfirmasi Selesai";


                btnSelesai.disabled =
                    false;

            }

        }

    );

</script>
