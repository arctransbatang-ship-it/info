<style>

    /* =========================
       GLOBAL
    ========================= */

    * {

        box-sizing: border-box;

        font-family:
            "Segoe UI",
            Arial,
            sans-serif;

    }


    body {

        margin: 0;

        min-height: 100vh;

        background:
            linear-gradient(
                135deg,
                #eef6ff,
                #f7f9fc
            );

        color: #263238;

    }


    /* =========================
       HOME BUTTON
    ========================= */

    .home-btn {

        position: fixed;

        top: 14px;

        left: 16px;

        z-index: 2000;

        display: flex;

        align-items: center;

        gap: 7px;

        background:
            rgba(
                255,
                255,
                255,
                0.95
            );

        color: #1565C0;

        padding:
            9px
            16px;

        border-radius: 30px;

        text-decoration: none;

        font-size: 14px;

        font-weight: 700;

        box-shadow:
            0 5px 20px
            rgba(
                0,
                0,
                0,
                0.12
            );

        transition:
            transform 0.2s ease,
            box-shadow 0.2s ease;

    }


    .home-btn:hover {

        transform:
            translateY(-2px);

        box-shadow:
            0 8px 25px
            rgba(
                0,
                0,
                0,
                0.18
            );

    }


    /* =========================
       NAVBAR
    ========================= */

    .navbar {

        position: relative;

        min-height: 150px;

        display: flex;

        justify-content: center;

        align-items: center;

        padding:
            35px
            20px;

        background:
            linear-gradient(
                135deg,
                #0d47a1,
                #2196F3,
                #21c6f3
            );

        color: white;

        overflow: hidden;

        box-shadow:
            0 4px 20px
            rgba(
                33,
                150,
                243,
                0.25
            );

    }


    .navbar::before {

        content: "";

        position: absolute;

        width: 300px;

        height: 300px;

        border-radius: 50%;

        background:
            rgba(
                255,
                255,
                255,
                0.10
            );

        top: -180px;

        right: -80px;

    }


    .navbar::after {

        content: "";

        position: absolute;

        width: 220px;

        height: 220px;

        border-radius: 50%;

        background:
            rgba(
                255,
                255,
                255,
                0.08
            );

        bottom: -150px;

        left: 10%;

    }


    .logo {

        position: relative;

        z-index: 2;

        font-size:
            clamp(
                22px,
                4vw,
                32px
            );

        font-weight: 800;

        letter-spacing: 1px;

        text-align: center;

    }


    /* =========================
       CONTAINER
    ========================= */

    .container {

        width: 100%;

        max-width: 1500px;

        margin: auto;

        padding:
            25px
            clamp(
                15px,
                4vw,
                40px
            )
            40px;

    }


    /* =========================
       TOOLBAR
    ========================= */

    .toolbar {

        display: flex;

        justify-content: space-between;

        align-items: center;

        gap: 15px;

        margin-bottom: 22px;

        flex-wrap: wrap;

    }


    /* =========================
       SEARCH
    ========================= */

    #searchInput {

        width: 100%;

        max-width: 420px;

        padding:
            14px
            18px;

        border:
            1px
            solid
            #dce6f0;

        border-radius: 14px;

        outline: none;

        background: white;

        font-size: 14px;

    }


    /* =========================
       BUTTON
    ========================= */

    button {

        border: none;

        padding:
            12px
            20px;

        border-radius: 12px;

        cursor: pointer;

        color: white;

        font-size: 13px;

        font-weight: 700;

        transition:
            opacity 0.2s ease,
            transform 0.2s ease;

    }


    button:hover:not(:disabled) {

        opacity: 0.9;

        transform:
            translateY(-1px);

    }


    button:disabled {

        background: #cfd8dc !important;

        cursor: not-allowed;

    }


    #btnDownload {

        display: inline-block;

        background:
            linear-gradient(
                135deg,
                #2e7d32,
                #4CAF50
            );

    }


    /* =========================
       SUMMARY
    ========================= */

    .summary {

        display: grid;

        grid-template-columns:
            repeat(
                3,
                1fr
            );

        gap: 15px;

        margin-bottom: 22px;

    }


    .summary-card {

        background: white;

        padding: 20px;

        border-radius: 16px;

        box-shadow:
            0 6px 20px
            rgba(
                0,
                0,
                0,
                0.07
            );

        border:
            1px
            solid
            #edf1f5;

    }


    .summary-title {

        font-size: 13px;

        font-weight: 700;

        color: #607D8B;

        margin-bottom: 8px;

    }


    .summary-value {

        font-size: 22px;

        font-weight: 800;

        color: #1565C0;

    }


    .summary-debit {

        color: #C62828;

    }


    .summary-kredit {

        color: #2E7D32;

    }


    /* =========================
       TABLE
    ========================= */

    .table-container {

        width: 100%;

        overflow-x: auto;

        background: white;

        border-radius: 20px;

        box-shadow:
            0 10px 35px
            rgba(
                0,
                0,
                0,
                0.08
            );

    }


    table {

        width: 100%;

        min-width: 1000px;

        border-collapse: separate;

        border-spacing: 0;

    }


    th {

        background:
            linear-gradient(
                135deg,
                #1976D2,
                #2196F3
            );

        color: white;

        padding:
            16px
            14px;

        text-align: center;

        white-space: nowrap;

        font-size: 13px;

    }


    td {

        padding:
            15px
            14px;

        border-bottom:
            1px
            solid
            #edf1f5;

        text-align: center;

        vertical-align: middle;

        white-space: nowrap;

        font-size: 13px;

    }


    tbody tr:hover {

        background: #f5faff;

    }


    /* =========================
       ID TRANSAKSI BUTTON
    ========================= */

    .transaction-id {

        border: none;

        background:
            linear-gradient(
                135deg,
                #1565C0,
                #2196F3
            );

        color: white;

        padding:
            7px
            12px;

        border-radius: 8px;

        cursor: pointer;

        font-size: 12px;

        font-weight: 700;

    }


    /* =========================
       MONEY
    ========================= */

    .amount-debit {

        display: inline-block;

        padding:
            7px
            12px;

        border-radius: 10px;

        font-weight: 800;

        color: #2E7D32;

        background: #E8F5E9;

    }


    .amount-negative {

        display: inline-block;

        padding:
            7px
            12px;

        border-radius: 10px;

        font-weight: 800;

        color: #C62828;

        background: #FFEBEE;

    }


    .amount-zero {

        display: inline-block;

        padding:
            7px
            12px;

        border-radius: 10px;

        font-weight: 700;

        color: #78909C;

        background: #F5F7F8;

    }


    /* =========================
       EMPTY DATA
    ========================= */

    .empty-data {

        padding: 50px;

        text-align: center;

        color: #78909C;

        font-size: 15px;

    }


    /* =========================
       PAGINATION
    ========================= */

    #pagination {

        margin-top: 25px;

        display: flex;

        justify-content: center;

        align-items: center;

        gap: 12px;

        flex-wrap: wrap;

    }


    .btn-prev {

        background: #fb8c00;

    }


    .btn-next {

        background: #2e7d32;

    }


    .page-info {

        padding:
            10px
            16px;

        background: white;

        border-radius: 12px;

        font-size: 13px;

        font-weight: 700;

        color: #546E7A;

    }


    /* =========================
       MODAL DETAIL
    ========================= */

    .modal {

        display: none;

        position: fixed;

        z-index: 9999;

        inset: 0;

        background:
            rgba(
                0,
                0,
                0,
                0.55
            );

        padding: 20px;

        overflow-y: auto;

    }


    .modal-content {

        width: 100%;

        max-width: 700px;

        margin: 50px auto;

        background: white;

        border-radius: 20px;

        padding: 25px;

        position: relative;

        box-shadow:
            0 20px 60px
            rgba(
                0,
                0,
                0,
                0.25
            );

    }


    .modal-header {

        display: flex;

        justify-content: space-between;

        align-items: center;

        gap: 15px;

        margin-bottom: 20px;

        border-bottom:
            1px
            solid
            #e8eef4;

        padding-bottom: 15px;

    }


    .modal-title {

        font-size: 20px;

        font-weight: 800;

        color: #1565C0;

    }


    .close-modal {

        background: #C62828;

        padding:
            8px
            14px;

    }


    .detail-table {

        width: 100%;

        min-width: 0;

        border-collapse: collapse;

    }


    .detail-table td {

        text-align: left;

        white-space: normal;

        padding:
            12px
            10px;

    }


    .detail-table td:first-child {

    }


    .detail-photo {

        width: 100%;

        max-width: 350px;

        border-radius: 12px;

        margin-top: 10px;

        border:
            1px
            solid
            #e0e0e0;

    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

        .navbar {

            min-height: 120px;

            padding-top: 55px;

        }


        .container {

            padding:
                15px

        }


        .toolbar {

            flex-direction: column;

        }


        #searchInput {

        .summary {

        }


        .table-container {

            box-shadow: none;

        }

        tbody tr {

</style>

<script type="module">


    /* =========================
       FIREBASE IMPORT
    ========================= */

    import {

        initializeApp

    }

    from

    "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";


    import {

        getDatabase,

        ref,

        onValue

    }

    from

    "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";


    /* =========================
       FIREBASE CONFIG
    ========================= */

    const firebaseConfig = {

        apiKey:
            "AIzaSyCOL9UC3tZOEX9ZwvY076O0yI5yqmYfb44",

        authDomain:
            "arctrans.firebaseapp.com",

        databaseURL:
            "https://arctrans-default-rtdb.asia-southeast1.firebasedatabase.app",

        projectId:
            "arctrans",

        storageBucket:
            "arctrans.firebasestorage.app",

        messagingSenderId:
            "60781918601",

        appId:
            "1:60781918601:web:c85d6131207f8a8958"

    };


    /* =========================
       INITIALIZE FIREBASE
    ========================= */

    const app =
        initializeApp(
            firebaseConfig
        );


    const db =
        getDatabase(
            app
        );


    /* =========================
       VARIABLES
    ========================= */

    let allData = [];

    let filteredData = [];

    let currentPage = 1;

    const rowsPerPage = 10;


    /* =========================
       PARSE NUMBER
    ========================= */

    function parseNumber(value) {

        if (

            value === null ||

            value === undefined ||

            value === ""

        ) {

            return 0;

        }


        if (

            typeof value === "number"

        ) {

            return isNaN(value)

                ? 0

                : value;

        }


        let text =
            String(value)
            .trim()
            .replace(/Rp/gi, "")
            .replace(/\s/g, "");


        if (

            text.includes(".") &&

            text.includes(",")

        ) {

            text =
                text
                .replace(/\./g, "")
                .replace(/,/g, ".");

        }

        else if (

            text.includes(".")

        ) {

            text =
                text.replace(/\./g, "");

        }

        else if (

            text.includes(",")

        ) {

            text =
                text.replace(/,/g, ".");

        }


        const numberValue =
            Number(text);


        return
            isNaN(numberValue)

            ?

            0

            :

            numberValue;

    }


    /* =========================
       AMBIL DATA REVENUE
    ========================= */

    const revenueRef =
        ref(
            db,
            "revenue"
        );


    onValue(

        revenueRef,

        (snapshot) => {


            const data =
                snapshot.val();


            if (!data) {

                allData = [];

                filteredData = [];

                updateSummary();

                showEmptyData(
                    "Data revenue belum tersedia"
                );

                return;

            }


            const tempData = [];


            /*
               STRUKTUR:

               revenue
                 └── 2026-08-22
                       └── RENT_1787381003218
                             ├── transaksiId
                             ├── tanggalInput
                             ├── keterangan
                             └── bayar
            */

            Object.entries(data).forEach(

                ([tanggalKey, transaksiData]) => {


                    if (

                        !transaksiData ||

                        typeof transaksiData !== "object"

                    ) {

                        return;

                    }


                    Object.entries(
                        transaksiData
                    )

                    .forEach(

                        ([firebaseId, item]) => {


                            if (

                                !item ||

                                typeof item !== "object"

                            ) {

                                return;

                            }


                            const transaksiId =

                                item.transaksiId

                                ||

                                firebaseId

                                ||

                                "-";


                            const tanggal =

                                item.tanggalInput

                                ||

                                tanggalKey

                                ||

                                "-";


                            const keterangan =

                                item.keterangan

                                ||

                                "-";


                            const jumlah =

                                parseNumber(

                                    item.bayar

                                    ??

                                    0

                                );


                            tempData.push({

                                firebaseId,

                                tanggalKey,

                                transaksiId,

                                tanggal,

                                keterangan,

                                jumlah,

                                detail:
                                    item

                            });

                        }

                    );

                }

            );


            /*
               URUTKAN BERDASARKAN TANGGAL TERBARU
            */

            tempData.sort(

                (a, b) => {

                    const dateA =
                        new Date(
                            a.tanggal
                        ).getTime();

                    const dateB =
                        new Date(
                            b.tanggal
                        ).getTime();


                    return dateB - dateA;

                }

            );


            allData =
                tempData;


            applySearch();

            updateSummary();


        },

        (error) => {

            console.error(
                "Firebase Error:",
                error
            );


            showEmptyData(

                "Gagal mengambil data revenue: " +

                error.message

            );

        }

    );


    /* =========================
       SEARCH
    ========================= */

    function applySearch() {


        const keyword =

            document
            .getElementById(
                "searchInput"
            )
            .value
            .toLowerCase()
            .trim();


        filteredData =

            allData.filter(

                item => {


                    const transaksiId =

                        String(
                            item.transaksiId || ""
                        )
                        .toLowerCase();


                    const tanggal =

                        String(
                            item.tanggal || ""
                        )
                        .toLowerCase();


                    const keterangan =

                        String(
                            item.keterangan || ""
                        )
                        .toLowerCase();


                    return (

                        transaksiId.includes(
                            keyword
                        )

                        ||

                        tanggal.includes(
                            keyword
                        )

                        ||

                        keterangan.includes(
                            keyword
                        )

                    );

                }

            );


        currentPage = 1;


        renderTable();

    }


    document
    .getElementById(
        "searchInput"
    )
    .addEventListener(

        "input",

        applySearch

    );


    /* =========================
       UPDATE SUMMARY
    ========================= */

    function updateSummary() {


        /*
           HANYA NILAI POSITIF
           DIJUMLAHKAN KE TOTAL DEBIT
        */

        const totalDebit =

            allData.reduce(

                (
                    total,
                    item
                ) => {


                    const jumlah =
                        Number(
                            item.jumlah || 0
                        );


                    return

                        jumlah > 0

                        ?

                        total + jumlah

                        :

                        total;

                },

                0

            );


        /*
           NILAI NEGATIF
        */

        const totalNegatif =

            allData.reduce(

                (
                    total,
                    item
                ) => {


                    const jumlah =
                        Number(
                            item.jumlah || 0
                        );


                    return

                        jumlah < 0

                        ?

                        total + Math.abs(jumlah)

                        :

                        total;

                },

                0

            );


        document
        .getElementById(
            "totalTransaksi"
        )
        .textContent =

            allData.length

            +

            " Transaksi";


        document
        .getElementById(
            "totalDebit"
        )
        .textContent =

            formatRupiah(
                totalDebit
            );


        document
        .getElementById(
            "totalKredit"
        )
        .textContent =

            formatRupiah(
                totalNegatif
            );

    }


    /* =========================
       EMPTY DATA
    ========================= */

    function showEmptyData(message) {


        document
        .getElementById(
            "isiData"
        )
        .innerHTML =

            `
            <tr>

                <td
                    colspan="5"
                    class="empty-data"
                >

                    ${escapeHtml(message)}

                </td>

            </tr>
            `;


        document
        .getElementById(
            "pagination"
        )
        .innerHTML =
            "";

    }


    /* =========================
       ESCAPE HTML
    ========================= */

    function escapeHtml(value) {

        return String(
            value ?? ""
        )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

    }


    /* =========================
       FORMAT RUPIAH
    ========================= */

    function formatRupiah(value) {

        const numberValue =
            Number(
                value || 0
            );


        return (

            "Rp "

            +

            numberValue
            .toLocaleString(
                "id-ID"
            )

        );

    }


    /* =========================
       FORMAT JUMLAH
    ========================= */

    function formatJumlah(value) {


        const numberValue =
            Number(
                value || 0
            );


        if (

            numberValue > 0

        ) {

            return `

                <span
                    class="amount-debit"
                >

                    ${formatRupiah(numberValue)}

                </span>

            `;

        }


        if (

            numberValue < 0

        ) {

            return `

                <span
                    class="amount-negative"
                >

                    - ${formatRupiah(
                        Math.abs(
                            numberValue
                        )
                    )}

                </span>

            `;

        }


        return `

            <span
                class="amount-zero"
            >

                Rp 0

            </span>

        `;

    }


    /* =========================
       RENDER TABLE
    ========================= */

    function renderTable() {


        if (

            filteredData.length === 0

        ) {

            showEmptyData(
                "Data tidak ditemukan"
            );

            return;

        }


        const totalPages =

            Math.ceil(

                filteredData.length

                /

                rowsPerPage

            );


        if (

            currentPage > totalPages

        ) {

            currentPage =
                totalPages;

        }


        const start =

            (
                currentPage - 1
            )

            *

            rowsPerPage;


        const end =

            start

            +

            rowsPerPage;


        const paginatedData =

            filteredData.slice(
                start,
                end
            );


        let html = "";


        let no =
            start + 1;


        paginatedData.forEach(

            item => {


                html +=

                    `

                    <tr>


                        <td
                            data-label="No."
                        >

                            ${no}

                        </td>


                        <td
                            data-label="ID Transaksi"
                        >

                            <button
                                class="transaction-id"
                                onclick="showDetail('${escapeAttribute(item.firebaseId)}')"
                            >

                                ${escapeHtml(
                                    item.transaksiId
                                )}

                            </button>

                        </td>


                        <td
                            data-label="Tanggal Transaksi"
                        >

                            ${escapeHtml(
                                item.tanggal
                            )}

                        </td>


                        <td
                            data-label="Keterangan"
                        >

                            ${escapeHtml(
                                item.keterangan
                            )}

                        </td>


                        <td
                            data-label="Jumlah"
                        >

                            ${formatJumlah(
                                item.jumlah
                            )}

                        </td>


                    </tr>

                    `;


                no++;

            }

        );


        document
        .getElementById(
            "isiData"
        )
        .innerHTML =
            html;


        renderPagination();

    }


    /* =========================
       ESCAPE ATTRIBUTE
    ========================= */

    function escapeAttribute(value) {

        return String(
            value ?? ""
        )

        .replace(
            /\\/g,
            "\\\\"
        )

        .replace(
            /'/g,
            "\\'"
        )

        .replace(
            /"/g,
            "&quot;"
        );

    }


    /* =========================
       PAGINATION
    ========================= */

    function renderPagination() {


        const totalPages =

            Math.ceil(

                filteredData.length

                /

                rowsPerPage

            );


        if (

            totalPages <= 1

        ) {

            document
            .getElementById(
                "pagination"
            )
            .innerHTML =
                "";

            return;

        }


        document
        .getElementById(
            "pagination"
        )
        .innerHTML =

            `

            <button
                class="btn-prev"
                onclick="prevPage()"
                ${
                    currentPage === 1

                    ?

                    "disabled"

                    :

                    ""
                }
            >

                ← Sebelumnya

            </button>


            <span
                class="page-info"
            >

                Halaman

                ${currentPage}

                dari

                ${totalPages}

            </span>


            <button
                class="btn-next"
                onclick="nextPage()"
                ${
                    currentPage === totalPages

                    ?

                    "disabled"

                    :

                    ""
                }
            >

                Selanjutnya →

            </button>

            `;

    }


    /* =========================
       NEXT PAGE
    ========================= */

    window.nextPage =
        function () {


            const totalPages =

                Math.ceil(

                    filteredData.length

                    /

                    rowsPerPage

                );


            if (

                currentPage < totalPages

            ) {

                currentPage++;

                renderTable();

            }

        };


    /* =========================
       PREVIOUS PAGE
    ========================= */

    window.prevPage =
        function () {


            if (

                currentPage > 1

            ) {

                currentPage--;

                renderTable();

            }

        };


    /* =========================
       SHOW DETAIL
    ========================= */

    window.showDetail =
        function (firebaseId) {


            const item =

                allData.find(

                    data =>

                        String(
                            data.firebaseId
                        )

                        ===

                        String(
                            firebaseId
                        )

                );


            if (!item) {

                alert(
                    "Detail transaksi tidak ditemukan."
                );

                return;

            }


            const detail =
                item.detail || {};


            document
            .getElementById(
                "modalTitle"
            )
            .textContent =

                "Detail: "

                +

                item.transaksiId;


            let fotoHtml =
                "-";


            if (

                detail.fotoJaminan

            ) {

                fotoHtml =

                    `

                    <a
                        href="${escapeHtml(detail.fotoJaminan)}"
                        target="_blank"
                    >

                        <img
                            src="${escapeHtml(detail.fotoJaminan)}"
                            class="detail-photo"
                            alt="Foto Jaminan"
                        >

                    </a>

                    `;

            }


            document
            .getElementById(
                "detailContent"
            )
            .innerHTML =

                `

                <table
                    class="detail-table"
                >


                    <tr>

                        <td>ID Transaksi</td>

                        <td>
                            ${escapeHtml(
                                item.transaksiId
                            )}
                        </td>

                    </tr>


                    <tr>

                        <td>Tanggal Transaksi</td>

                        <td>
                            ${escapeHtml(
                                item.tanggal
                            )}
                        </td>

                    </tr>


                    <tr>

                        <td>Keterangan</td>

                        <td>
                            ${escapeHtml(
                                item.keterangan
                            )}
                        </td>

                    </tr>


                    <tr>

                        <td>Jumlah Bayar</td>

                        <td>
                            ${formatRupiah(
                                item.jumlah
                            )}
                        </td>

                    </tr>


                    <tr>

                        <td>Customer</td>

                        <td>
                            ${escapeHtml(
                                detail.customer || "-"
                            )}
                        </td>

                    </tr>


                    <tr>

                        <td>Nama Unit</td>

                        <td>
                            ${escapeHtml(
                                detail.namaUnit ||
                                detail.unit ||
                                "-"
                            )}
                        </td>

                    </tr>


                    <tr>

                        <td>Plat Nomor</td>

                        <td>
                            ${escapeHtml(
                                detail.plat ||
                                detail.platNomor ||
                                "-"
                            )}
                        </td>

                    </tr>


                    <tr>

                        <td>Alamat KTP</td>

                        <td>
                            ${escapeHtml(
                                detail.alamatktp || "-"
                            )}
                        </td>

                    </tr>


                    <tr>

                        <td>Harga Sewa</td>

                        <td>
                            ${formatRupiah(
                                parseNumber(
                                    detail.harga || 0
                                )
                            )}
                        </td>

                    </tr>


                    <tr>

                        <td>Foto Jaminan</td>

                        <td>

                            ${fotoHtml}

                        </td>

                    </tr>


                </table>

                `;


            document
            .getElementById(
                "detailModal"
            )
            .style
            .display =
                "block";

        };


    /* =========================
       CLOSE DETAIL
    ========================= */

    window.closeDetail =
        function () {


            document
            .getElementById(
                "detailModal"
            )
            .style
            .display =
                "none";

        };


    /* =========================
       CLOSE MODAL OUTSIDE
    ========================= */

    window.addEventListener(

        "click",

        function (event) {


            const modal =
                document.getElementById(
                    "detailModal"
                );


            if (

                event.target === modal

            ) {

                closeDetail();

            }

        }

    );


    /* =========================
       DOWNLOAD EXCEL
    ========================= */

    window.downloadExcel =
        function () {


            if (

                filteredData.length === 0

            ) {

                alert(
                    "Tidak ada data untuk di-download!"
                );

                return;

            }


            const dataExcel =

                filteredData.map(

                    (
                        item,
                        index
                    ) => {


                        return {

                            "No":
                                index + 1,

                            "ID Transaksi":
                                item.transaksiId,

                            "Tanggal Transaksi":
                                item.tanggal,

                            "Keterangan":
                                item.keterangan,

                            "Jumlah":
                                Number(
                                    item.jumlah || 0
                                )

                        };

                    }

                );


            /*
               TAMBAHKAN TOTAL
               NILAI POSITIF
            */

            const totalDebit =

                filteredData.reduce(

                    (
                        total,
                        item
                    ) => {


                        const jumlah =
                            Number(
                                item.jumlah || 0
                            );


                        return

                            jumlah > 0

                            ?

                            total + jumlah

                            :

                            total;

                    },

                    0

                );


            dataExcel.push({

                "No": "",

                "ID Transaksi": "",

                "Tanggal Transaksi": "",

                "Keterangan":
                    "TOTAL DEBIT",

                "Jumlah":
                    totalDebit

            });


            const worksheet =

                XLSX.utils
                .json_to_sheet(
                    dataExcel
                );


            worksheet["!cols"] = [

                {
                    wch: 8
                },

                {
                    wch: 28
                },

                {
                    wch: 20
                },

                {
                    wch: 60
                },

                {
                    wch: 20
                }

            ];


            const workbook =

                XLSX.utils
                .book_new();


            XLSX.utils
            .book_append_sheet(

                workbook,

                worksheet,

                "Revenue"

            );


            XLSX.writeFile(

                workbook,

                "Data_Revenue.xlsx"

            );

        };


</script>
