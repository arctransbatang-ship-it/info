<script type="module">


    /* =========================
       FIREBASE IMPORT
    ========================= */

    import {

        initializeApp

    }

    from

    "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";


    import {

        getDatabase,
        ref,
        onValue

    }

    from

    "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";


    /* =========================
       FIREBASE CONFIG
    ========================= */

    const firebaseConfig = {

        apiKey:
            "AIzaSyCOL9UC3tZOEX9ZwvY076O0yI5yqmYfb44",

        authDomain:
            "arctrans.firebaseapp.com",

        databaseURL:
            "https://arctrans-default-rtdb.asia-southeast1.firebasedatabase.app",

        projectId:
            "arctrans",

        storageBucket:
            "arctrans.firebasestorage.app",

        messagingSenderId:
            "60781918601",

        appId:
            "1:60781918601:web:c85d6131207f8a8958"

    };


    /* =========================
       INITIALIZE FIREBASE
    ========================= */

    const app =
        initializeApp(
            firebaseConfig
        );


    const db =
        getDatabase(
            app
        );


    /* =========================
       VARIABLES
    ========================= */

    let allData = [];

    let filteredData = [];

    let currentPage = 1;

    const rowsPerPage = 10;


    /* =========================
       PARSE NUMBER
    ========================= */

    function parseNumber(value) {

        if (
            value === null ||
            value === undefined ||
            value === ""
        ) {

            return 0;

        }


        if (
            typeof value === "number"
        ) {

            return isNaN(value)
                ? 0
                : value;

        }


        let text =
            String(value)
            .trim()
            .replace(/Rp/gi, "")
            .replace(/\s/g, "");


        /*
            Mendukung:

            Rp 500.000
            500.000
            -500.000
            +500.000
            500000
        */

        if (
            text.includes(".") &&
            text.includes(",")
        ) {

            text =
                text
                .replace(/\./g, "")
                .replace(/,/g, ".");

        }

        else if (
            text.includes(".")
        ) {

            text =
                text.replace(
                    /\./g,
                    ""
                );

        }

        else if (
            text.includes(",")
        ) {

            text =
                text.replace(
                    /,/g,
                    "."
                );

        }


        const numberValue =
            Number(text);


        return isNaN(numberValue)
            ? 0
            : numberValue;

    }


    /* =========================
       FORMAT RUPIAH
    ========================= */

    function formatRupiah(value) {

        const numberValue =
            Number(value || 0);


        return (
            "Rp "
            +
            numberValue.toLocaleString(
                "id-ID"
            )
        );

    }


    /* =========================
       ESCAPE HTML
    ========================= */

    function escapeHtml(value) {

        return String(
            value ?? ""
        )
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =========================
       FORMAT TANGGAL
    ========================= */

    function formatTanggal(value) {

        if (
            !value
        ) {

            return "-";

        }


        const text =
            String(value);


        /*
            Jika format Firebase:
            2026-08-22
        */

        if (
            /^\d{4}-\d{2}-\d{2}$/
            .test(text)
        ) {

            const parts =
                text.split("-");


            return (
                parts[2]
                + "-"
                + parts[1]
                + "-"
                + parts[0]
            );

        }


        return text;

    }


    /* =========================
       GET SORT TIME
    ========================= */

    function getSortTime(item) {

        const value =
            item.tanggalInput
            ||
            item.tanggal
            ||
            item.tanggalTransaksi
            ||
            item.tanggalSewa
            ||
            item.tanggalsewa
            ||
            "";


        if (
            typeof value === "number"
        ) {

            return value;

        }


        const parsed =
            Date.parse(value);


        if (
            !isNaN(parsed)
        ) {

            return parsed;

        }


        return 0;

    }


    /* =========================
       AMBIL DATA REVENUE

       STRUKTUR:

       revenue
          └── 2026-08-22
                └── RENT_1787381003218
    ========================= */

    const revenueRef =
        ref(
            db,
            "revenue"
        );


    onValue(

        revenueRef,

        (snapshot) => {


            const data =
                snapshot.val();


            if (
                !data
            ) {

                allData = [];

                filteredData = [];

                updateSummary();

                showEmptyData(
                    "Data revenue belum tersedia"
                );

                return;

            }


            let result = [];


            /*
                Loop tanggal

                revenue/
                    2026-08-22/
                        RENT_xxx/
            */

            Object.entries(data)
            .forEach(

                (
                    [
                        tanggalKey,
                        transaksiData
                    ]
                ) => {


                    /*
                        Jika struktur langsung
                        transaksi tanpa folder tanggal
                    */

                    if (
                        transaksiData &&
                        transaksiData.bayar !== undefined
                    ) {

                        const bayar =
                            parseNumber(
                                transaksiData.bayar
                            );


                        /*
                            NILAI 0 TIDAK DITAMPILKAN
                        */

                        if (
                            bayar === 0
                        ) {

                            return;

                        }


                        result.push({

                            firebaseDate:
                                tanggalKey,

                            firebaseId:
                                tanggalKey,

                            ...transaksiData,

                            bayar:
                                bayar

                        });

                        return;

                    }


                    /*
                        STRUKTUR BERDASARKAN
                        FOLDER TANGGAL
                    */

                    if (
                        transaksiData &&
                        typeof transaksiData === "object"
                    ) {

                        Object.entries(
                            transaksiData
                        )
                        .forEach(

                            (
                                [
                                    transaksiKey,
                                    item
                                ]
                            ) => {


                                if (
                                    !item ||
                                    typeof item !== "object"
                                ) {

                                    return;

                                }


                                const bayar =
                                    parseNumber(
                                        item.bayar
                                    );


                                /*
                                    JANGAN TAMPILKAN
                                    NILAI 0
                                */

                                if (
                                    bayar === 0
                                ) {

                                    return;

                                }


                                result.push({

                                    firebaseDate:
                                        tanggalKey,

                                    firebaseId:
                                        transaksiKey,

                                    ...item,

                                    bayar:
                                        bayar

                                });

                            }

                        );

                    }

                }

            );


            /*
                URUTKAN DATA TERBARU
                BERDASARKAN TANGGAL INPUT
            */

            result.sort(

                (
                    a,
                    b
                ) => {

                    return (
                        getSortTime(b)
                        -
                        getSortTime(a)
                    );

                }

            );


            allData =
                result.map(

                    item => {


                        const transaksiId =
                            item.transaksiId
                            ||
                            item.firebaseId
                            ||
                            "-";


                        const tanggal =
                            item.tanggalInput
                            ||
                            item.firebaseDate
                            ||
                            item.tanggal
                            ||
                            "-";


                        const keterangan =
                            item.keterangan
                            ||
                            "-";


                        const jumlah =
                            parseNumber(
                                item.bayar
                            );


                        return {

                            ...item,

                            transaksiId:
                                transaksiId,

                            tanggal:
                                tanggal,

                            keterangan:
                                keterangan,

                            jumlah:
                                jumlah

                        };

                    }

                );


            applySearch();

            updateSummary();


        },


        (error) => {

            console.error(
                "Firebase Error:",
                error
            );


            showEmptyData(
                "Gagal mengambil data: "
                +
                error.message
            );

        }

    );


    /* =========================
       SEARCH
    ========================= */

    function applySearch() {

        const keyword =
            document
            .getElementById(
                "searchInput"
            )
            .value
            .toLowerCase()
            .trim();


        filteredData =
            allData.filter(

                item => {


                    const transaksiId =
                        String(
                            item.transaksiId || ""
                        )
                        .toLowerCase();


                    const tanggal =
                        String(
                            item.tanggal || ""
                        )
                        .toLowerCase();


                    const keterangan =
                        String(
                            item.keterangan || ""
                        )
                        .toLowerCase();


                    return (

                        transaksiId.includes(
                            keyword
                        )

                        ||

                        tanggal.includes(
                            keyword
                        )

                        ||

                        keterangan.includes(
                            keyword
                        )

                    );

                }

            );


        currentPage = 1;

        renderTable();

    }


    document
    .getElementById(
        "searchInput"
    )
    .addEventListener(

        "input",

        applySearch

    );


    /* =========================
       UPDATE SUMMARY

       TOTAL DEBIT =
       JUMLAH SELURUH NILAI POSITIF
       DARI KOLOM JUMLAH
    ========================= */

    function updateSummary() {


        const dataPositif =
            allData.filter(

                item =>
                    Number(
                        item.jumlah
                    ) > 0

            );


        const totalDebit =
            dataPositif.reduce(

                (
                    total,
                    item
                ) => {

                    return (
                        total
                        +
                        Number(
                            item.jumlah || 0
                        )
                    );

                },

                0

            );


        document
        .getElementById(
            "totalTransaksi"
        )
        .textContent =

            dataPositif.length
            +
            " Transaksi";


        document
        .getElementById(
            "totalDebit"
        )
        .textContent =

            formatRupiah(
                totalDebit
            );

    }


    /* =========================
       SHOW EMPTY DATA
    ========================= */

    function showEmptyData(message) {

        document
        .getElementById(
            "isiData"
        )
        .innerHTML =

            `
            <tr>

                <td
                    colspan="5"
                    class="empty-data"
                >

                    ${escapeHtml(message)}

                </td>

            </tr>
            `;


        document
        .getElementById(
            "pagination"
        )
        .innerHTML =
            "";

    }


    /* =========================
       RENDER TABLE
    ========================= */

    function renderTable() {


        if (
            filteredData.length === 0
        ) {

            showEmptyData(
                "Data tidak ditemukan"
            );

            return;

        }


        const totalPages =
            Math.ceil(
                filteredData.length
                /
                rowsPerPage
            );


        if (
            currentPage > totalPages
        ) {

            currentPage =
                totalPages;

        }


        const start =
            (
                currentPage - 1
            )
            *
            rowsPerPage;


        const end =
            start
            +
            rowsPerPage;


        const paginatedData =
            filteredData.slice(
                start,
                end
            );


        let html = "";

        let no =
            start + 1;


        paginatedData.forEach(

            (
                item,
                index
            ) => {


                const dataIndex =
                    allData.indexOf(
                        item
                    );


                html +=

                    `
                    <tr
                        onclick="showDetail(${dataIndex})"
                    >

                        <td
                            data-label="No."
                        >

                            ${no}

                        </td>


                        <td
                            data-label="ID Transaksi"
                            class="id-transaksi"
                        >

                            ${escapeHtml(
                                item.transaksiId
                            )}

                        </td>


                        <td
                            data-label="Tanggal Transaksi"
                        >

                            ${escapeHtml(
                                formatTanggal(
                                    item.tanggal
                                )
                            )}

                        </td>


                        <td
                            data-label="Keterangan"
                        >

                            ${escapeHtml(
                                item.keterangan
                            )}

                        </td>


                        <td
                            data-label="Jumlah"
                        >

                            <span
                                class="amount-debit"
                            >

                                ${formatRupiah(
                                    item.jumlah
                                )}

                            </span>

                        </td>


                    </tr>
                    `;


                no++;

            }

        );


        document
        .getElementById(
            "isiData"
        )
        .innerHTML =
            html;


        renderPagination();

    }


    /* =========================
       PAGINATION
    ========================= */

    function renderPagination() {


        const totalPages =
            Math.ceil(
                filteredData.length
                /
                rowsPerPage
            );


        if (
            totalPages <= 1
        ) {

            document
            .getElementById(
                "pagination"
            )
            .innerHTML =
                "";

            return;

        }


        document
        .getElementById(
            "pagination"
        )
        .innerHTML =

            `
            <button
                class="btn-prev"
                onclick="prevPage()"
                ${
                    currentPage === 1
                    ?
                    "disabled"
                    :
                    ""
                }
            >

                ← Sebelumnya

            </button>


            <span
                class="page-info"
            >

                Halaman
                ${currentPage}
                dari
                ${totalPages}

            </span>


            <button
                class="btn-next"
                onclick="nextPage()"
                ${
                    currentPage === totalPages
                    ?
                    "disabled"
                    :
                    ""
                }
            >

                Selanjutnya →

            </button>
            `;

    }


    /* =========================
       NEXT PAGE
    ========================= */

    window.nextPage =
        function () {


            const totalPages =
                Math.ceil(
                    filteredData.length
                    /
                    rowsPerPage
                );


            if (
                currentPage < totalPages
            ) {

                currentPage++;

                renderTable();

            }

        };


    /* =========================
       PREVIOUS PAGE
    ========================= */

    window.prevPage =
        function () {


            if (
                currentPage > 1
            ) {

                currentPage--;

                renderTable();

            }

        };


    /* =========================
       SHOW DETAIL TRANSACTION
    ========================= */

    window.showDetail =
        function (
            index
        ) {


            const item =
                allData[index];


            if (
                !item
            ) {

                return;

            }


            const excludedFields = [

                "fotoJaminan",

                "fotoPengambilan",

                "fotoJaminanPublicId",

                "firebaseDate",

                "firebaseId",

                "bayar",

                "jumlah"

            ];


            let detailHtml = "";


            Object.entries(
                item
            )
            .forEach(

                (
                    [
                        key,
                        value
                    ]
                ) => {


                    if (
                        excludedFields.includes(
                            key
                        )
                    ) {

                        return;

                    }


                    if (
                        value === null ||
                        value === undefined ||
                        value === ""
                    ) {

                        return;

                    }


                    /*
                        Hindari object ditampilkan
                        sebagai [object Object]
                    */

                    let displayValue =
                        value;


                    if (
                        typeof value === "object"
                    ) {

                        displayValue =
                            JSON.stringify(
                                value
                            );

                    }


                    /*
                        FORMAT NILAI UANG
                    */

                    if (
                        key.toLowerCase()
                        .includes("harga")

                        ||

                        key.toLowerCase()
                        .includes("bayar")

                        ||

                        key.toLowerCase()
                        .includes("total")

                        ||

                        key.toLowerCase()
                        .includes("sisa")

                    ) {

                        const numberValue =
                            parseNumber(
                                value
                            );


                        displayValue =
                            formatRupiah(
                                numberValue
                            );

                    }


                    detailHtml +=

                        `
                        <div
                            class="detail-item"
                        >

                            <div
                                class="detail-label"
                            >

                                ${escapeHtml(
                                    formatFieldName(
                                        key
                                    )
                                )}

                            </div>


                            <div
                                class="detail-value"
                            >

                                ${escapeHtml(
                                    displayValue
                                )}

                            </div>

                        </div>
                        `;

                }

            );


            /*
                TAMBAHKAN JUMLAH TRANSAKSI
            */

            detailHtml +=

                `
                <div
                    class="detail-item"
                >

                    <div
                        class="detail-label"
                    >

                        JUMLAH PEMBAYARAN

                    </div>


                    <div
                        class="detail-value"
                    >

                        ${formatRupiah(
                            item.jumlah
                        )}

                    </div>

                </div>
                `;


            /*
                FOTO JAMINAN
            */

            const fotoJaminanHtml =
                item.fotoJaminan
                ?
                `
                <img
                    src="${escapeHtml(
                        item.fotoJaminan
                    )}"
                    alt="Foto Jaminan"
                    onclick="window.open(this.src, '_blank')"
                    style="cursor:zoom-in"
                >
                `
                :
                `
                <div
                    class="no-photo"
                >

                    Foto jaminan tidak tersedia

                </div>
                `;


            /*
                FOTO PENGAMBILAN UNIT

                Field fotoPengambilan
                tidak ditampilkan sebagai teks,
                hanya sebagai gambar.
            */

            const fotoPengambilanHtml =
                item.fotoPengambilan
                ?
                `
                <img
                    src="${escapeHtml(
                        item.fotoPengambilan
                    )}"
                    alt="Dokumentasi Pengambilan Unit"
                    onclick="window.open(this.src, '_blank')"
                    style="cursor:zoom-in"
                >
                `
                :
                `
                <div
                    class="no-photo"
                >

                    Foto dokumentasi pengambilan unit
                    tidak tersedia

                </div>
                `;


            document
            .getElementById(
                "detailContent"
            )
            .innerHTML =

                `
                <div
                    class="detail-section"
                >

                    <h3>

                        Informasi Transaksi

                    </h3>


                    <div
                        class="detail-grid"
                    >

                        ${detailHtml}

                    </div>

                </div>


                <div
                    class="detail-section"
                >

                    <h3>

                        📷 Dokumentasi Transaksi

                    </h3>


                    <div
                        class="photo-grid"
                    >


                        <div
                            class="photo-box"
                        >

                            <div
                                class="photo-title"
                            >

                                Foto Jaminan

                            </div>

                            ${fotoJaminanHtml}

                        </div>


                        <div
                            class="photo-box"
                        >

                            <div
                                class="photo-title"
                            >

                                Dokumentasi Pengambilan Unit

                            </div>

                            ${fotoPengambilanHtml}

                        </div>


                    </div>

                </div>
                `;


            document
            .getElementById(
                "detailModal"
            )
            .classList.add(
                "show"
            );

        };


    /* =========================
       FORMAT FIELD NAME
    ========================= */

    function formatFieldName(key) {


        const labels = {

            transaksiId:
                "ID Transaksi",

            tanggalInput:
                "Tanggal Transaksi",

            tanggalSewa:
                "Tanggal Sewa",

            selesaiSewa:
                "Estimasi Tanggal Selesai",

            customer:
                "Nama Customer",

            namaCustomer:
                "Nama Customer",

            namaUnit:
                "Nama Unit",

            plat:
                "Plat Nomor",

            platNomor:
                "Plat Nomor",

            hp:
                "Nomor Telepon",

            noHp:
                "Nomor Telepon",

            alamatktp:
                "Alamat KTP",

            keterangan:
                "Keterangan",

            harga:
                "Harga Sewa",

            total:
                "Total Biaya",

            totalBiaya:
                "Total Biaya",

            sisa:
                "Sisa Pembayaran",

            rentalType:
                "Jenis Rental",

            jaminan:
                "Jaminan"

        };


        return (

            labels[key]

            ||

            String(key)
            .replace(
                /([A-Z])/g,
                " $1"
            )
            .replace(
                /^./,
                char =>
                    char.toUpperCase()
            )

        );

    }


    /* =========================
       CLOSE DETAIL
    ========================= */

    window.closeDetail =
        function () {


            document
            .getElementById(
                "detailModal"
            )
            .classList.remove(
                "show"
            );

        };


    /* =========================
       CLOSE MODAL IF CLICK
       OUTSIDE
    ========================= */

    document
    .getElementById(
        "detailModal"
    )
    .addEventListener(

        "click",

        function (
            event
        ) {


            if (
                event.target === this
            ) {

                closeDetail();

            }

        }

    );


    /* =========================
       CLOSE WITH ESC
    ========================= */

    document
    .addEventListener(

        "keydown",

        function (
            event
        ) {


            if (
                event.key === "Escape"
            ) {

                closeDetail();

            }

        }

    );


    /* =========================
       DOWNLOAD EXCEL
    ========================= */

    window.downloadExcel =
        function () {


            if (
                filteredData.length === 0
            ) {

                alert(
                    "Tidak ada data untuk di-download!"
                );

                return;

            }


            const dataExcel =
                filteredData.map(

                    (
                        item,
                        index
                    ) => {

                        return {

                            "No":
                                index + 1,

                            "ID Transaksi":
                                item.transaksiId,

                            "Tanggal Transaksi":
                                item.tanggal,

                            "Keterangan":
                                item.keterangan,

                            "Jumlah":
                                Number(
                                    item.jumlah || 0
                                )

                        };

                    }

                );


            /*
                TOTAL DEBIT
            */

            const totalDebit =
                dataExcel.reduce(

                    (
                        total,
                        item
                    ) => {

                        return (
                            total
                            +
                            Number(
                                item["Jumlah"] || 0
                            )
                        );

                    },

                    0

                );


            /*
                TAMBAHKAN TOTAL
                DI BARIS TERAKHIR EXCEL
            */

            dataExcel.push({

                "No": "",

                "ID Transaksi": "",

                "Tanggal Transaksi": "",

                "Keterangan":
                    "TOTAL DEBIT",

                "Jumlah":
                    totalDebit

            });


            const worksheet =
                XLSX.utils
                .json_to_sheet(
                    dataExcel
                );


            worksheet["!cols"] = [

                {
                    wch: 8
                },

                {
                    wch: 28
                },

                {
                    wch: 22
                },

                {
                    wch: 60
                },

                {
                    wch: 20
                }

            ];


            /*
                FORMAT ANGKA RUPIAH
                KOLOM JUMLAH
            */

            const range =
                XLSX.utils.decode_range(
                    worksheet["!ref"]
                );


            for (
                let row = 1;
                row <= range.e.r;
                row++
            ) {

                const cell =
                    worksheet[
                        XLSX.utils.encode_cell({

                            r: row,

                            c: 4

                        })

                    ];


                if (
                    cell
                ) {

                    cell.z =
                        '"Rp" #,##0';

                }

            }


            const workbook =
                XLSX.utils
                .book_new();


            XLSX.utils
            .book_append_sheet(

                workbook,

                worksheet,

                "Revenue"

            );


            XLSX.writeFile(

                workbook,

                "Data_Revenue.xlsx"

            );

        };


</script>
