<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ARC TRANS - Revenue</title>


    <!-- LIBRARY EXCEL -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>


    <style>

        /* =========================
           GLOBAL
        ========================= */

        * {
            box-sizing: border-box;
            font-family:
                "Segoe UI",
                Arial,
                sans-serif;
        }


        body {
            margin: 0;
            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #eef6ff,
                    #f7f9fc
                );

            color: #263238;
        }


        /* =========================
           HOME BUTTON
        ========================= */

        .home-btn {

            position: fixed;

            top: 14px;

            left: 16px;

            z-index: 2000;

            display: flex;

            align-items: center;

            gap: 7px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.95
                );

            color: #1565C0;

            padding:
                9px
                16px;

            border-radius: 30px;

            text-decoration: none;

            font-size: 14px;

            font-weight: 700;

            box-shadow:
                0 5px 20px
                rgba(
                    0,
                    0,
                    0,
                    0.12
                );

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        .home-btn:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 8px 25px
                rgba(
                    0,
                    0,
                    0,
                    0.18
                );
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar {

            position: relative;

            min-height: 150px;

            display: flex;

            justify-content: center;

            align-items: center;

            padding:
                35px
                20px;

            background:
                linear-gradient(
                    135deg,
                    #0d47a1,
                    #2196F3,
                    #21c6f3
                );

            color: white;

            overflow: hidden;

            box-shadow:
                0 4px 20px
                rgba(
                    33,
                    150,
                    243,
                    0.25
                );
        }


        .navbar::before {

            content: "";

            position: absolute;

            width: 300px;

            height: 300px;

            border-radius: 50%;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.10
                );

            top: -180px;

            right: -80px;
        }


        .navbar::after {

            content: "";

            position: absolute;

            width: 220px;

            height: 220px;

            border-radius: 50%;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

            bottom: -150px;

            left: 10%;
        }


        .logo {

            position: relative;

            z-index: 2;

            font-size:
                clamp(
                    22px,
                    4vw,
                    32px
                );

            font-weight: 800;

            letter-spacing: 1px;

            text-align: center;
        }


        /* =========================
           CONTAINER
        ========================= */

        .container {

            width: 100%;

            max-width: 1500px;

            margin: auto;

            padding:
                25px
                clamp(
                    15px,
                    4vw,
                    40px
                )
                40px;
        }


        /* =========================
           TOOLBAR
        ========================= */

        .toolbar {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            margin-bottom: 22px;

            flex-wrap: wrap;
        }


        /* =========================
           SEARCH
        ========================= */

        #searchInput {

            width: 100%;

            max-width: 420px;

            padding:
                14px
                18px;

            border:
                1px
                solid
                #dce6f0;

            border-radius: 14px;

            outline: none;

            background: white;

            font-size: 14px;
        }


        /* =========================
           BUTTON
        ========================= */

        button {

            border: none;

            padding:
                12px
                20px;

            border-radius: 12px;

            cursor: pointer;

            color: white;

            font-size: 13px;

            font-weight: 700;

            transition:
                opacity 0.2s ease,
                transform 0.2s ease;
        }


        button:hover:not(:disabled) {

            opacity: 0.9;

            transform:
                translateY(-1px);
        }


        button:disabled {

            background: #cfd8dc !important;

            cursor: not-allowed;
        }


        #btnDownload {

            display: none;

            background:
                linear-gradient(
                    135deg,
                    #2e7d32,
                    #4CAF50
                );
        }


        /* =========================
           SUMMARY
        ========================= */

        .summary {

            display: grid;

            grid-template-columns:
                repeat(
                    3,
                    1fr
                );

            gap: 15px;

            margin-bottom: 22px;
        }


        .summary-card {

            background: white;

            padding: 20px;

            border-radius: 16px;

            box-shadow:
                0 6px 20px
                rgba(
                    0,
                    0,
                    0,
                    0.07
                );

            border:
                1px
                solid
                #edf1f5;
        }


        .summary-title {

            font-size: 13px;

            font-weight: 700;

            color: #607D8B;

            margin-bottom: 8px;
        }


        .summary-value {

            font-size: 22px;

            font-weight: 800;

            color: #1565C0;
        }


        .summary-debit {

            color: #C62828;
        }


        .summary-kredit {

            color: #2E7D32;
        }


        /* =========================
           TABLE
        ========================= */

        .table-container {

            width: 100%;

            overflow-x: auto;

            background: white;

            border-radius: 20px;

            box-shadow:
                0 10px 35px
                rgba(
                    0,
                    0,
                    0,
                    0.08
                );
        }


        table {

            width: 100%;

            min-width: 900px;

            border-collapse: separate;

            border-spacing: 0;
        }


        th {

            background:
                linear-gradient(
                    135deg,
                    #1976D2,
                    #2196F3
                );

            color: white;

            padding:
                16px
                14px;

            text-align: center;

            white-space: nowrap;

            font-size: 13px;
        }


        td {

            padding:
                15px
                14px;

            border-bottom:
                1px
                solid
                #edf1f5;

            text-align: center;

            vertical-align: middle;

            white-space: nowrap;

            font-size: 13px;
        }


        tbody tr:hover {

            background: #f5faff;
        }


        /* =========================
           MONEY
        ========================= */

        .amount-debit {

            display: inline-block;

            padding:
                7px
                12px;

            border-radius: 10px;

            font-weight: 800;

            color: #C62828;

            background: #FFEBEE;
        }


        .amount-kredit {

            display: inline-block;

            padding:
                7px
                12px;

            border-radius: 10px;

            font-weight: 800;

            color: #2E7D32;

            background: #E8F5E9;
        }


        .amount-zero {

            display: inline-block;

            padding:
                7px
                12px;

            border-radius: 10px;

            font-weight: 700;

            color: #78909C;

            background: #F5F7F8;
        }


        /* =========================
           EMPTY DATA
        ========================= */

        .empty-data {

            padding: 50px;

            text-align: center;

            color: #78909C;

            font-size: 15px;
        }


        /* =========================
           PAGINATION
        ========================= */

        #pagination {

            margin-top: 25px;

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 12px;

            flex-wrap: wrap;
        }


        .btn-prev {

            background: #fb8c00;
        }


        .btn-next {

            background: #2e7d32;
        }


        .page-info {

            padding:
                10px
                16px;

            background: white;

            border-radius: 12px;

            font-size: 13px;

            font-weight: 700;

            color: #546E7A;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .navbar {

                min-height: 120px;

                padding-top: 55px;
            }


            .container {

                padding:
                    15px
                    10px
                    30px;
            }


            .toolbar {

                flex-direction: column;

                align-items: stretch;
            }


            #searchInput {

                max-width: none;
            }


            #btnDownload {

                width: 100%;
            }


            .summary {

                grid-template-columns: 1fr;
            }


            .table-container {

                background: transparent;

                box-shadow: none;

                overflow: visible;
            }


            table {

                min-width: 0;

                width: 100%;
            }


            thead {

                display: none;
            }


            tbody {

                display: block;
            }


            tbody tr {

                display: block;

                width: 100%;

                background: white;

                border-radius: 18px;

                margin-bottom: 15px;

                padding:
                    10px
                    14px;

                box-shadow:
                    0 6px 20px
                    rgba(
                        0,
                        0,
                        0,
                        0.07
                    );
            }


            td {

                display: flex;

                justify-content: space-between;

                align-items: center;

                gap: 15px;

                padding:
                    12px
                    5px;

                text-align: right;

                white-space: normal;
            }


            td::before {

                content:
                    attr(data-label);

                text-align: left;

                font-weight: 700;

                color: #607D8B;

                flex:
                    0 0 45%;
            }
        }

    </style>

</head>


<body>


    <!-- HOME -->

    <a
        href="index.html"
        class="home-btn"
    >
        🏠 Home
    </a>


    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            💰 DATA REVENUE
        </div>

    </nav>


    <div class="container">


        <!-- TOOLBAR -->

        <div class="toolbar">

            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Cari tanggal atau keterangan..."
            >


            <button
                id="btnDownload"
                onclick="downloadExcel()"
            >
                📥 Download Excel
            </button>

        </div>


        <!-- SUMMARY -->

        <div class="summary">


            <div class="summary-card">

                <div class="summary-title">
                    TOTAL TRANSAKSI
                </div>

                <div
                    class="summary-value"
                    id="totalTransaksi"
                >
                    Rp 0
                </div>

            </div>


            <div class="summary-card">

                <div class="summary-title">
                    TOTAL DEBIT
                </div>

                <div
                    class="
                        summary-value
                        summary-debit
                    "
                    id="totalDebit"
                >
                    Rp 0
                </div>

            </div>


            <div class="summary-card">

                <div class="summary-title">
                    TOTAL KREDIT
                </div>

                <div
                    class="
                        summary-value
                        summary-kredit
                    "
                    id="totalKredit"
                >
                    Rp 0
                </div>

            </div>


        </div>


        <!-- TABLE -->

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>No.</th>

                        <th>Tanggal Transaksi</th>

                        <th>Keterangan</th>

                        <th>Debit</th>

                        <th>Kredit</th>

                    </tr>

                </thead>


                <tbody id="isiData">

                    <tr>

                        <td
                            colspan="5"
                            class="empty-data"
                        >
                            Memuat data revenue...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>


        <!-- PAGINATION -->

        <div id="pagination"></div>


    </div>



    <!-- FIREBASE -->

    <script type="module">


        /* =========================
           FIREBASE IMPORT
        ========================= */

        import {
            initializeApp
        }
        from
        "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";


        import {
            getDatabase,
            ref,
            onValue
        }
        from
        "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";


        /* =========================
           FIREBASE CONFIG
        ========================= */

        const firebaseConfig = {

            apiKey:
                "AIzaSyCOL9UC3tZOEX9ZwvY076O0yI5yqmYfb44",

            authDomain:
                "arctrans.firebaseapp.com",

            databaseURL:
                "https://arctrans-default-rtdb.asia-southeast1.firebasedatabase.app",

            projectId:
                "arctrans",

            storageBucket:
                "arctrans.firebasestorage.app",

            messagingSenderId:
                "60781918601",

            appId:
                "1:60781918601:web:c85d6131207f8a8958"
        };


        /* =========================
           INITIALIZE FIREBASE
        ========================= */

        const app =
            initializeApp(
                firebaseConfig
            );


        const db =
            getDatabase(
                app
            );


        console.log(
            "Firebase berhasil diinisialisasi"
        );


        /* =========================
           VARIABLES
        ========================= */

        let allData = [];

        let filteredData = [];

        let currentPage = 1;

        const rowsPerPage = 10;


        /* =========================
           USER DOWNLOAD ACCESS
        ========================= */

        const username =
            localStorage.getItem(
                "username"
            );


        const allowedUsers = [

            "Nurhakiki",

            "Henri Yuliansyah",

            "Sultan"

        ];


        if (
            allowedUsers.includes(
                username
            )
        ) {

            document
                .getElementById(
                    "btnDownload"
                )
                .style
                .display =
                "inline-block";
        }


        /* =========================
           FUNCTION PARSE NUMBER
        ========================= */

        function parseNumber(value) {

            if (
                value === null ||
                value === undefined ||
                value === ""
            ) {

                return 0;
            }


            if (
                typeof value === "number"
            ) {

                return isNaN(value)
                    ? 0
                    : value;
            }


            let text =
                String(value)
                .trim()
                .replace(
                    /Rp/gi,
                    ""
                )
                .replace(
                    /\s/g,
                    ""
                );


            /*
               FORMAT:

               Rp 500.000
               500.000
               -500.000
               +500.000
            */


            if (
                text.includes(".") &&
                text.includes(",")
            ) {

                text =
                    text
                    .replace(
                        /\./g,
                        ""
                    )
                    .replace(
                        /,/g,
                        "."
                    );
            }

            else if (
                text.includes(".")
            ) {

                text =
                    text.replace(
                        /\./g,
                        ""
                    );
            }

            else if (
                text.includes(",")
            ) {

                text =
                    text.replace(
                        /,/g,
                        "."
                    );
            }


            const numberValue =
                Number(text);


            return isNaN(
                numberValue
            )
            ?
            0
            :
            numberValue;
        }


        /* =========================
           AMBIL DATA REVENUE
        ========================= */

        const revenueRef =
            ref(
                db,
                "Revenue"
            );


        console.log(
            "Membaca Firebase path: Revenue"
        );


        onValue(

            revenueRef,


            (snapshot) => {


                console.log(
                    "Snapshot exists:",
                    snapshot.exists()
                );


                const data =
                    snapshot.val();


                console.log(
                    "Data Firebase:",
                    data
                );


                if (
                    !data
                ) {


                    allData = [];

                    filteredData = [];


                    updateSummary();


                    showEmptyData(
                        "Data revenue belum tersedia"
                    );


                    return;
                }


                allData =
                    Object.entries(
                        data
                    )
                    .map(

                        (
                            [
                                id,
                                item
                            ]
                        ) => {


                            const tanggal =

                                item.tanggal

                                ||

                                item.tanggalTransaksi

                                ||

                                item.tanggalsewa

                                ||

                                item.tanggalSewa

                                ||

                                "-";


                            let keterangan =

                                item.keterangan

                                ||

                                "";


                            if (
                                !keterangan
                            ) {


                                const customer =

                                    item.customer

                                    ||

                                    item.namaCustomer

                                    ||

                                    "-";


                                const namaUnit =

                                    item.namaUnit

                                    ||

                                    item.unit

                                    ||

                                    "-";


                                const plat =

                                    item.plat

                                    ||

                                    item.platNomor

                                    ||

                                    "-";


                                keterangan =

                                    `Pembayaran Sewa - ${customer} - ${namaUnit} (${plat})`;
                            }


                            /*
                               NILAI BAYAR
                            */

                            const bayar =

                                parseNumber(

                                    item.bayar

                                    ??

                                    item.nominal

                                    ??

                                    item.jumlah

                                    ??

                                    0

                                );


                            let debit = 0;

                            let kredit = 0;


                            /*
                               NEGATIF
                               MASUK DEBIT
                            */

                            if (
                                bayar < 0
                            ) {

                                debit =
                                    Math.abs(
                                        bayar
                                    );
                            }


                            /*
                               POSITIF
                               MASUK KREDIT
                            */

                            else if (
                                bayar > 0
                            ) {

                                kredit =
                                    bayar;
                            }


                            return {

                                id,

                                tanggal,

                                keterangan,

                                bayar,

                                debit,

                                kredit
                            };
                        }
                    );


                console.log(
                    "Data setelah diproses:",
                    allData
                );


                updateSummary();


                applySearch();

            },


            (error) => {


                console.error(
                    "Firebase Error:",
                    error
                );


                showEmptyData(
                    "Gagal mengambil data revenue: " +
                    error.message
                );

            }

        );


        /* =========================
           SEARCH
        ========================= */

        function applySearch() {


            const keyword =

                document
                .getElementById(
                    "searchInput"
                )
                .value
                .toLowerCase()
                .trim();


            filteredData =

                allData.filter(

                    item => {


                        const tanggal =

                            String(
                                item.tanggal || ""
                            )
                            .toLowerCase();


                        const keterangan =

                            String(
                                item.keterangan || ""
                            )
                            .toLowerCase();


                        return (

                            tanggal.includes(
                                keyword
                            )

                            ||

                            keterangan.includes(
                                keyword
                            )

                        );

                    }

                );


            currentPage = 1;


            renderTable();

        }


        document
        .getElementById(
            "searchInput"
        )
        .addEventListener(
            "input",
            applySearch
        );


        /* =========================
           UPDATE SUMMARY
        ========================= */

        function updateSummary() {


            const totalDebit =

                allData.reduce(

                    (
                        total,
                        item
                    ) =>

                        total
                        +
                        Number(
                            item.debit || 0
                        ),

                    0

                );


            const totalKredit =

                allData.reduce(

                    (
                        total,
                        item
                    ) =>

                        total
                        +
                        Number(
                            item.kredit || 0
                        ),

                    0

                );


            const totalTransaksi =

                totalDebit
                +
                totalKredit;


            document
            .getElementById(
                "totalTransaksi"
            )
            .textContent =

                formatRupiah(
                    totalTransaksi
                );


            document
            .getElementById(
                "totalDebit"
            )
            .textContent =

                formatRupiah(
                    totalDebit
                );


            document
            .getElementById(
                "totalKredit"
            )
            .textContent =

                formatRupiah(
                    totalKredit
                );

        }


        /* =========================
           EMPTY DATA
        ========================= */

        function showEmptyData(message) {


            document
            .getElementById(
                "isiData"
            )
            .innerHTML =

                `
                <tr>

                    <td
                        colspan="5"
                        class="empty-data"
                    >
                        ${escapeHtml(message)}
                    </td>

                </tr>
                `;


            document
            .getElementById(
                "pagination"
            )
            .innerHTML =
                "";

        }


        /* =========================
           ESCAPE HTML
        ========================= */

        function escapeHtml(value) {


            return String(
                value ?? ""
            )

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

        }


        /* =========================
           FORMAT RUPIAH
        ========================= */

        function formatRupiah(value) {


            const numberValue =

                Number(
                    value || 0
                );


            return (

                "Rp "

                +

                numberValue
                .toLocaleString(
                    "id-ID"
                )

            );

        }


        /* =========================
           FORMAT DEBIT
        ========================= */

        function formatDebit(value) {


            const numberValue =

                Number(
                    value || 0
                );


            if (
                numberValue > 0
            ) {

                return `

                    <span
                        class="amount-debit"
                    >

                        ${formatRupiah(numberValue)}

                    </span>

                `;
            }


            return `

                <span
                    class="amount-zero"
                >
                    Rp 0
                </span>

            `;

        }


        /* =========================
           FORMAT KREDIT
        ========================= */

        function formatKredit(value) {


            const numberValue =

                Number(
                    value || 0
                );


            if (
                numberValue > 0
            ) {

                return `

                    <span
                        class="amount-kredit"
                    >

                        ${formatRupiah(numberValue)}

                    </span>

                `;
            }


            return `

                <span
                    class="amount-zero"
                >
                    Rp 0
                </span>

            `;

        }


        /* =========================
           RENDER TABLE
        ========================= */

        function renderTable() {


            if (
                filteredData.length === 0
            ) {

                showEmptyData(
                    "Data tidak ditemukan"
                );

                return;
            }


            const totalPages =

                Math.ceil(

                    filteredData.length

                    /

                    rowsPerPage

                );


            if (
                currentPage > totalPages
            ) {

                currentPage =
                    totalPages;
            }


            const start =

                (
                    currentPage - 1
                )

                *

                rowsPerPage;


            const end =

                start
                +
                rowsPerPage;


            const paginatedData =

                filteredData.slice(
                    start,
                    end
                );


            let html = "";


            let no =
                start + 1;


            paginatedData.forEach(

                item => {


                    html +=

                        `
                        <tr>


                            <td
                                data-label="No."
                            >
                                ${no}
                            </td>


                            <td
                                data-label="Tanggal Transaksi"
                            >
                                ${escapeHtml(item.tanggal)}
                            </td>


                            <td
                                data-label="Keterangan"
                            >
                                ${escapeHtml(item.keterangan)}
                            </td>


                            <td
                                data-label="Debit"
                            >
                                ${formatDebit(item.debit)}
                            </td>


                            <td
                                data-label="Kredit"
                            >
                                ${formatKredit(item.kredit)}
                            </td>


                        </tr>
                        `;


                    no++;

                }

            );


            document
            .getElementById(
                "isiData"
            )
            .innerHTML =
                html;


            renderPagination();

        }


        /* =========================
           PAGINATION
        ========================= */

        function renderPagination() {


            const totalPages =

                Math.ceil(

                    filteredData.length

                    /

                    rowsPerPage

                );


            if (
                totalPages <= 1
            ) {

                document
                .getElementById(
                    "pagination"
                )
                .innerHTML =
                    "";

                return;
            }


            document
            .getElementById(
                "pagination"
            )
            .innerHTML =

                `

                <button

                    class="btn-prev"

                    onclick="prevPage()"

                    ${
                        currentPage === 1
                        ?
                        "disabled"
                        :
                        ""
                    }

                >
                    ← Sebelumnya
                </button>


                <span
                    class="page-info"
                >

                    Halaman
                    ${currentPage}

                    dari
                    ${totalPages}

                </span>


                <button

                    class="btn-next"

                    onclick="nextPage()"

                    ${
                        currentPage === totalPages
                        ?
                        "disabled"
                        :
                        ""
                    }

                >
                    Selanjutnya →
                </button>

                `;

        }


        /* =========================
           NEXT PAGE
        ========================= */

        window.nextPage =
            function () {


                const totalPages =

                    Math.ceil(

                        filteredData.length

                        /

                        rowsPerPage

                    );


                if (
                    currentPage < totalPages
                ) {

                    currentPage++;

                    renderTable();
                }

            };


        /* =========================
           PREVIOUS PAGE
        ========================= */

        window.prevPage =
            function () {


                if (
                    currentPage > 1
                ) {

                    currentPage--;

                    renderTable();
                }

            };


        /* =========================
           DOWNLOAD EXCEL
        ========================= */

        window.downloadExcel =
            function () {


                if (
                    filteredData.length === 0
                ) {

                    alert(
                        "Tidak ada data untuk di-download!"
                    );

                    return;
                }


                const dataExcel =

                    filteredData.map(

                        (
                            item,
                            index
                        ) => {

                            return {

                                "No":
                                    index + 1,

                                "Tanggal Transaksi":
                                    item.tanggal,

                                "Keterangan":
                                    item.keterangan,

                                "Debit":
                                    Number(
                                        item.debit || 0
                                    ),

                                "Kredit":
                                    Number(
                                        item.kredit || 0
                                    )

                            };

                        }

                    );


                const worksheet =

                    XLSX.utils
                    .json_to_sheet(
                        dataExcel
                    );


                worksheet["!cols"] = [

                    {
                        wch: 8
                    },

                    {
                        wch: 20
                    },

                    {
                        wch: 60
                    },

                    {
                        wch: 20
                    },

                    {
                        wch: 20
                    }

                ];


                const workbook =

                    XLSX.utils
                    .book_new();


                XLSX.utils
                .book_append_sheet(

                    workbook,

                    worksheet,

                    "Revenue"

                );


                XLSX.writeFile(

                    workbook,

                    "Data_Revenue.xlsx"

                );

            };


    </script>


</body>

</html>
