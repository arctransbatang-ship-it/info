<style>

    * {
        box-sizing: border-box;
        font-family: "Segoe UI", Arial, sans-serif;
    }


    :root {

        --primary: #2196F3;
        --primary-dark: #1976D2;
        --secondary: #21CBF3;

        --success: #16a34a;
        --danger: #dc2626;
        --warning: #f59e0b;

        --text: #1e293b;
        --muted: #64748b;
        --border: #dbe3ee;

    }


    body {

        margin: 0;

        min-height: 100vh;

        background:
            linear-gradient(
                135deg,
                #e0f2fe,
                #f8fafc
            );

        color: var(--text);

    }


    /* =========================
       HEADER
    ========================= */

    .topbar {

        width: 100%;

        padding: 14px 20px;

        display: flex;

        align-items: center;

        justify-content: space-between;

        background: white;

        box-shadow:
            0 2px 12px
            rgba(15, 23, 42, 0.08);

        position: sticky;

        top: 0;

        z-index: 1000;

    }


    .brand {

        display: flex;

        align-items: center;

        gap: 10px;

    }


    .brand-icon {

        width: 42px;

        height: 42px;

        display: flex;

        align-items: center;

        justify-content: center;

        border-radius: 12px;

        background:
            linear-gradient(
                135deg,
                var(--primary),
                var(--secondary)
            );

        color: white;

        font-size: 20px;

        box-shadow:
            0 6px 16px
            rgba(33, 150, 243, 0.25);

    }


    .brand-text h1 {

        margin: 0;

        font-size: 18px;

    }


    .brand-text p {

        margin: 2px 0 0;

        font-size: 12px;

        color: var(--muted);

    }


    .home-btn {

        display: inline-flex;

        align-items: center;

        justify-content: center;

        text-decoration: none;

        background: #eff6ff;

        color: var(--primary-dark);

        font-weight: 700;

        padding: 10px 15px;

        border-radius: 12px;

        transition: 0.2s;

    }


    .home-btn:hover {

        background: var(--primary);

        color: white;

        transform: translateY(-1px);

    }


    /* =========================
       CONTAINER
    ========================= */

    .container {

        width: 100%;

        max-width: 1400px;

        margin: auto;

        padding: 20px;

    }


    .page-title {

        margin-bottom: 20px;

    }


    .page-title h2 {

        margin: 0 0 5px;

        font-size: 24px;

    }


    .page-title p {

        margin: 0;

        font-size: 14px;

        color: var(--muted);

    }


    /* =========================
       TOOLBAR
    ========================= */

    .toolbar {

        display: flex;

        align-items: center;

        justify-content: space-between;

        gap: 12px;

        margin-bottom: 18px;

        flex-wrap: wrap;

    }


    #searchInput {

        flex: 1;

        min-width: 220px;

        max-width: 450px;

        min-height: 48px;

        padding: 12px 15px;

        border: 1px solid var(--border);

        border-radius: 12px;

        background: white;

        font-size: 14px;

        outline: none;

    }


    #searchInput:focus {

        border-color: var(--primary);

        box-shadow:
            0 0 0 4px
            rgba(33, 150, 243, 0.12);

    }


    button {

        border: none;

        cursor: pointer;

        color: white;

        font-size: 14px;

        font-weight: 700;

        border-radius: 12px;

        padding: 12px 18px;

        transition: 0.2s;

    }


    button:hover {

        transform: translateY(-1px);

    }


    button:disabled {

        background: #cbd5e1 !important;

        cursor: not-allowed;

        transform: none;

    }


    #btnDownload {

        display: inline-block;

        background:
            linear-gradient(
                135deg,
                #16a34a,
                #22c55e
            );

        box-shadow:
            0 6px 15px
            rgba(34, 197, 94, 0.2);

    }


    /* =========================
       TABLE
    ========================= */

    .table-container {

        width: 100%;

        overflow-x: auto;

        background: white;

        border-radius: 18px;

        box-shadow:
            0 10px 30px
            rgba(15, 23, 42, 0.08);

    }


    table {

        width: 100%;

        border-collapse: collapse;

        min-width: 1050px;

    }


    th {

        background:
            linear-gradient(
                135deg,
                var(--primary),
                var(--secondary)
            );

        color: white;

        padding: 14px 10px;

        text-align: center;

        white-space: nowrap;

    }


    td {

        padding: 12px 10px;

        border-bottom:
            1px solid
            #edf2f7;

        text-align: center;

        vertical-align: middle;

    }


    tbody tr {

        transition: 0.2s;

    }


    tbody tr:hover {

        background: #f8fbff;

    }


    /* =========================
       PHOTO
    ========================= */

    .photo-cell {

        min-width: 130px;

    }


    .vehicle-photo {

        display: block;

        width: 110px;

        height: 80px;

        margin: auto;

        object-fit: cover;

        border-radius: 10px;

        border:
            1px solid
            var(--border);

        cursor: pointer;

        transition: 0.2s;

    }


    .vehicle-photo:hover {

        transform: scale(1.06);

        box-shadow:
            0 6px 18px
            rgba(0, 0, 0, 0.2);

    }


    .no-photo {

        color: #94a3b8;

        font-size: 12px;

    }


    /* =========================
       BADGE
    ========================= */

    .badge {

        display: inline-block;

        padding: 7px 12px;

        border-radius: 20px;

        font-size: 12px;

        font-weight: 700;

        color: white;

        min-width: 80px;

    }


    .badge-masuk {

        background: #16a34a;

    }


    .badge-pulang {

        background: #dc2626;

    }


    .badge-sewa {

        background: #f59e0b;

    }


    .badge-out {

        background: #dc2626;

    }


    .badge-default {

        background: #64748b;

    }


    /* =========================
       MOBILE CARD
    ========================= */

    .mobile-list {

        display: none;

    }


    .vehicle-card {

        background: white;

        border-radius: 18px;

        padding: 16px;

        margin-bottom: 14px;

        box-shadow:
            0 8px 24px
            rgba(15, 23, 42, 0.08);

        border:
            1px solid
            #eef2f7;

    }


    .vehicle-card-header {

        display: flex;

        align-items: center;

        justify-content: space-between;

        gap: 12px;

        margin-bottom: 14px;

        padding-bottom: 12px;

        border-bottom:
            1px solid
            #edf2f7;

    }


    .vehicle-number {

        font-size: 12px;

        color: var(--muted);

        font-weight: 700;

    }


    .vehicle-name {

        margin: 3px 0 0;

        font-size: 17px;

        font-weight: 800;

    }


    .mobile-photo {

        width: 100%;

        height: 180px;

        object-fit: cover;

        border-radius: 14px;

        margin-bottom: 14px;

        border:
            1px solid
            var(--border);

        cursor: pointer;

    }


    .card-grid {

        display: grid;

        grid-template-columns:
            repeat(2, 1fr);

        gap: 10px;

    }


    .card-item {

        background: #f8fafc;

        padding: 10px;

        border-radius: 10px;

    }


    .card-item.full {

        grid-column: 1 / -1;

    }


    .card-label {

        display: block;

        font-size: 11px;

        color: var(--muted);

        margin-bottom: 5px;

        font-weight: 600;

    }


    .card-value {

        font-size: 13px;

        font-weight: 700;

        color: var(--text);

        word-break: break-word;

    }


    .card-badge-area {

        margin-top: 12px;

        display: flex;

        flex-wrap: wrap;

        gap: 8px;

    }


    /* =========================
       PAGINATION
    ========================= */

    #pagination {

        margin: 20px 0;

        display: flex;

        justify-content: center;

        align-items: center;

        gap: 10px;

        flex-wrap: wrap;

    }


    .btn-prev {

        background: var(--warning);

    }


    .btn-next {

        background: var(--success);

    }


    .page-info {

        font-size: 13px;

        font-weight: 700;

        color: var(--text);

        padding: 8px 12px;

    }


    /* =========================
       EMPTY
    ========================= */

    .empty-data {

        padding: 35px;

        text-align: center;

        color: var(--muted);

    }


    /* =========================
       PHOTO MODAL
    ========================= */

    .photo-modal {

        display: none;

        position: fixed;

        z-index: 9999;

        inset: 0;

        background:
            rgba(15, 23, 42, 0.9);

        justify-content: center;

        align-items: center;

        padding: 20px;

    }


    .photo-modal img {

        max-width: 95%;

        max-height: 85vh;

        border-radius: 14px;

        box-shadow:
            0 10px 40px
            rgba(0, 0, 0, 0.5);

    }


    .close-modal {

        position: absolute;

        top: 18px;

        right: 25px;

        color: white;

        font-size: 42px;

        cursor: pointer;

        line-height: 1;

    }


    .modal-caption {

        position: absolute;

        bottom: 20px;

        color: white;

        font-size: 14px;

        text-align: center;

        width: 100%;

        padding: 0 20px;

    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

        body {

            padding-bottom: 20px;

        }


        .topbar {

            padding: 10px 14px;

        }


        .brand-icon {

            width: 38px;

            height: 38px;

            font-size: 18px;

        }


        .brand-text h1 {

            font-size: 16px;

        }


        .brand-text p {

            font-size: 10px;

        }


        .home-btn {

            padding: 8px 12px;

            font-size: 12px;

        }


        .container {

            padding: 14px;

        }


        .page-title h2 {

            font-size: 21px;

        }


        .toolbar {

            display: grid;

            grid-template-columns: 1fr;

        }


        #searchInput {

            width: 100%;

            max-width: none;

        }


        #btnDownload {

            width: 100%;

            min-height: 48px;

        }


        .table-container {

            display: none;

        }


        .mobile-list {

            display: block;

        }


        .card-grid {

            grid-template-columns: 1fr 1fr;

        }

    }


    @media (max-width: 380px) {

        .card-grid {

            grid-template-columns: 1fr;

        }


        .card-item.full {

            grid-column: auto;

        }

    }

</style>

<!-- =========================

========================= -->

<script type="module">


    /* =========================
       FIREBASE IMPORT
    ========================= */

    import {

        initializeApp

    }

    from

    "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";


    import {

        getDatabase,
        ref,
        onValue

    }

    from

    "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";



    /* =========================
       FIREBASE CONFIG
    ========================= */

    const firebaseConfig = {

        apiKey:
            "AIzaSyCOL9UC3tZOEX9ZwvY076O0yI5yqmYfb44",

        authDomain:
            "arctrans.firebaseapp.com",

        databaseURL:
            "https://arctrans-default-rtdb.asia-southeast1.firebasedatabase.app",

        projectId:
            "arctrans",

        storageBucket:
            "arctrans.firebasestorage.app",

        messagingSenderId:
            "60781918601",

        appId:
            "1:60781918601:web:c85d6131207f8a8958"

    };



    /* =========================
       INITIALIZE FIREBASE
    ========================= */

    const app =
        initializeApp(
            firebaseConfig
        );


    const db =
        getDatabase(
            app
        );



    /* =========================
       VARIABLES
    ========================= */

    let allData = [];

    let filteredData = [];

    let currentPage = 1;

    const rowsPerPage = 10;



    /* =========================
       SEARCH
    ========================= */

    function applySearch() {


        const keyword =
            document
            .getElementById(
                "searchInput"
            )
            .value
            .toLowerCase()
            .trim();


        filteredData =
            allData.filter(

                item => {


                    const nama =
                        String(
                            item.nama || ""
                        )
                        .toLowerCase();


                    const plat =
                        String(
                            item.plat || ""
                        )
                        .toLowerCase();


                    const keterangan =
                        String(
                            item.keterangan || ""
                        )
                        .toLowerCase();


                    const status =
                        String(
                            item.status || ""
                        )
                        .toLowerCase();


                    return (

                        nama.includes(
                            keyword
                        )

                        ||

                        plat.includes(
                            keyword
                        )

                        ||

                        keterangan.includes(
                            keyword
                        )

                        ||

                        status.includes(
                            keyword
                        )

                    );

                }

            );


        currentPage = 1;

        renderTable();

    }



    document
        .getElementById(
            "searchInput"
        )
        .addEventListener(

            "input",

            applySearch

        );



    /* =========================
       FIREBASE DATA
    ========================= */

    const dbRef =
        ref(
            db,
            "unit"
        );


    onValue(

        dbRef,

        (snapshot) => {


            const data =
                snapshot.val();


            console.log(
                "Data unit Firebase:",
                data
            );


            if (
                !data
            ) {


                allData = [];

                filteredData = [];


                showEmptyData(
                    "Data kendaraan belum tersedia"
                );


                return;

            }


            allData =
                Object.values(
                    data
                );


            applySearch();

        },


        (error) => {


            console.error(
                "Firebase Error:",
                error
            );


            showEmptyData(
                "Gagal mengambil data kendaraan"
            );

        }

    );



    /* =========================
       EMPTY DATA
    ========================= */

    function showEmptyData(
        message
    ) {


        document
            .getElementById(
                "isiData"
            )
            .innerHTML =
            `
            <tr>

                <td
                    colspan="9"
                    class="empty-data"
                >

                    ${message}

                </td>

            </tr>
            `;


        document
            .getElementById(
                "mobileList"
            )
            .innerHTML =
            `
            <div class="vehicle-card">

                <div
                    class="empty-data"
                >

                    ${message}

                </div>

            </div>
            `;


        document
            .getElementById(
                "pagination"
            )
            .innerHTML =
            "";

    }



    /* =========================
       FORMAT RUPIAH
    ========================= */

    function formatRupiah(
        value
    ) {


        if (

            value === null

            ||

            value === undefined

            ||

            value === ""

        ) {

            return "-";

        }


        const numberValue =
            Number(
                value
            );


        if (
            isNaN(
                numberValue
            )
        ) {

            return value;

        }


        return (

            "Rp " +

            numberValue
            .toLocaleString(
                "id-ID"
            )

        );

    }



    /* =========================
       ESCAPE HTML
    ========================= */

    function escapeHtml(
        value
    ) {


        return String(
            value || ""
        )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

    }



    /* =========================
       RENDER TABLE
    ========================= */

    function renderTable() {


        if (
            filteredData.length === 0
        ) {


            showEmptyData(
                "Data tidak ditemukan"
            );


            return;

        }


        const start =
            (
                currentPage - 1
            )
            *
            rowsPerPage;


        const end =
            start
            +
            rowsPerPage;


        const paginatedData =
            filteredData.slice(
                start,
                end
            );


        let tableHtml =
            "";


        let mobileHtml =
            "";


        let no =
            start + 1;


        paginatedData.forEach(

            item => {


                const plat =
                    item.plat || "-";


                const nama =
                    item.nama || "-";


                const stnk =
                    item.stnk || "-";


                const bpkb =
                    item.bpkb || "-";


                const status =
                    item.status || "-";


                const keterangan =
                    item.keterangan || "-";


                const value =
                    item.value;


                const urlphoto =
                    item.photo || "";


                const statusClass =
                    getStatusClass(
                        status
                    );


                const keteranganClass =
                    getKeteranganClass(
                        keterangan
                    );


                let photoHtml =
                    `
                    <span
                        class="no-photo"
                    >

                        Tidak ada foto

                    </span>
                    `;


                let mobilePhotoHtml =
                    `
                    <div
                        class="no-photo"
                    >

                        Tidak ada foto kendaraan

                    </div>
                    `;


                if (

                    urlphoto

                    &&

                    typeof urlphoto ===
                    "string"

                ) {


                    const safeUrl =
                        escapeHtml(
                            urlphoto
                        );


                    photoHtml =
                        `
                        <img

                            src="${safeUrl}"

                            alt="Foto ${escapeHtml(nama)}"

                            class="vehicle-photo"

                            data-url="${safeUrl}"

                            onclick="openPhotoFromElement(this)"

                            onerror="photoError(this)"

                        >
                        `;


                    mobilePhotoHtml =
                        `
                        <img

                            src="${safeUrl}"

                            alt="Foto ${escapeHtml(nama)}"

                            class="mobile-photo"

                            data-url="${safeUrl}"

                            onclick="openPhotoFromElement(this)"

                            onerror="photoError(this)"

                        >
                        `;

                }



                /* =========================
                   TABLE DESKTOP
                ========================= */

                tableHtml +=
                    `

                    <tr>


                        <td>

                            ${no}

                        </td>


                        <td>

                            ${escapeHtml(plat)}

                        </td>


                        <td>

                            ${escapeHtml(nama)}

                        </td>


                        <td>

                            ${escapeHtml(stnk)}

                        </td>


                        <td>

                            ${escapeHtml(bpkb)}

                        </td>


                        <td>

                            <span
                                class="badge ${statusClass}"
                            >

                                ${escapeHtml(status)}

                            </span>

                        </td>


                        <td>

                            <span
                                class="badge ${keteranganClass}"
                            >

                                ${escapeHtml(keterangan)}

                            </span>

                        </td>


                        <td>

                            ${formatRupiah(value)}

                        </td>


                        <td
                            class="photo-cell"
                        >

                            ${photoHtml}

                        </td>


                    </tr>

                    `;



                /* =========================
                   MOBILE CARD
                ========================= */

                mobileHtml +=
                    `

                    <div
                        class="vehicle-card"
                    >


                        <div
                            class="vehicle-card-header"
                        >


                            <div>


                                <div
                                    class="vehicle-number"
                                >

                                    UNIT #${no}

                                </div>


                                <div
                                    class="vehicle-name"
                                >

                                    ${escapeHtml(nama)}

                                </div>


                            </div>


                            <div>

                                <strong>

                                    ${escapeHtml(plat)}

                                </strong>

                            </div>


                        </div>


                        ${mobilePhotoHtml}


                        <div
                            class="card-grid"
                        >


                            <div
                                class="card-item"
                            >

                                <span
                                    class="card-label"
                                >

                                    Pajak STNK

                                </span>


                                <div
                                    class="card-value"
                                >

                                    ${escapeHtml(stnk)}

                                </div>


                            </div>



                            <div
                                class="card-item"
                            >

                                <span
                                    class="card-label"
                                >

                                    BPKB

                                </span>


                                <div
                                    class="card-value"
                                >

                                    ${escapeHtml(bpkb)}

                                </div>


                            </div>



                            <div
                                class="card-item full"
                            >

                                <span
                                    class="card-label"
                                >

                                    Value Kendaraan

                                </span>


                                <div
                                    class="card-value"
                                >

                                    ${formatRupiah(value)}

                                </div>


                            </div>


                        </div>



                        <div
                            class="card-badge-area"
                        >


                            <span
                                class="badge ${statusClass}"
                            >

                                ${escapeHtml(status)}

                            </span>


                            <span
                                class="badge ${keteranganClass}"
                            >

                                ${escapeHtml(keterangan)}

                            </span>


                        </div>


                    </div>

                    `;


                no++;

            }

        );


        document
            .getElementById(
                "isiData"
            )
            .innerHTML =
            tableHtml;


        document
            .getElementById(
                "mobileList"
            )
            .innerHTML =
            mobileHtml;


        renderPagination();

    }



    /* =========================
       PHOTO ERROR
    ========================= */

    window.photoError =
        function (
            image
        ) {


            image.outerHTML =
                `
                <span
                    class="no-photo"
                >

                    Foto gagal dimuat

                </span>
                `;

        };



    /* =========================
       STATUS COLOR
    ========================= */

    function getStatusClass(
        status
    ) {


        const text =
            String(
                status || ""
            )
            .toLowerCase();


        if (

            text.includes(
                "tersedia"
            )

            ||

            text.includes(
                "aktif"
            )

        ) {

            return "badge-masuk";

        }


        if (

            text.includes(
                "tidak aktif"
            )

        ) {

            return "badge-pulang";

        }


        if (

            text.includes(
                "sewa"
            )

            ||

            text.includes(
                "rental"
            )

        ) {

            return "badge-sewa";

        }


        return "badge-default";

    }



    /* =========================
       KETERANGAN COLOR
    ========================= */

    function getKeteranganClass(
        keterangan
    ) {


        const text =
            String(
                keterangan || ""
            )
            .toLowerCase()
            .trim();


        if (
            text === "ready"
        ) {

            return "badge-masuk";

        }


        if (
            text === "out"
        ) {

            return "badge-out";

        }


        if (

            text.includes(
                "sewa"
            )

            ||

            text.includes(
                "rental"
            )

        ) {

            return "badge-sewa";

        }


        if (

            text.includes(
                "tidak"
            )

            ||

            text.includes(
                "maintenance"
            )

            ||

            text.includes(
                "perbaikan"
            )

        ) {

            return "badge-pulang";

        }


        return "badge-default";

    }



    /* =========================
       PAGINATION
    ========================= */

    function renderPagination() {


        const totalPages =
            Math.ceil(
                filteredData.length
                /
                rowsPerPage
            );


        if (
            totalPages <= 1
        ) {


            document
                .getElementById(
                    "pagination"
                )
                .innerHTML =
                "";


            return;

        }


        document
            .getElementById(
                "pagination"
            )
            .innerHTML =
            `

            <button

                class="btn-prev"

                onclick="prevPage()"

                ${
                    currentPage === 1
                    ?
                    "disabled"
                    :
                    ""
                }

            >

                ← Prev

            </button>


            <span
                class="page-info"
            >

                Halaman
                ${currentPage}
                dari
                ${totalPages}

            </span>


            <button

                class="btn-next"

                onclick="nextPage()"

                ${
                    currentPage === totalPages
                    ?
                    "disabled"
                    :
                    ""
                }

            >

                Next →

            </button>

            `;

    }



    /* =========================
       NEXT PAGE
    ========================= */

    window.nextPage =
        function () {


            const totalPages =
                Math.ceil(
                    filteredData.length
                    /
                    rowsPerPage
                );


            if (
                currentPage
                <
                totalPages
            ) {


                currentPage++;


                renderTable();


                window.scrollTo({

                    top: 0,

                    behavior: "smooth"

                });

            }

        };



    /* =========================
       PREVIOUS PAGE
    ========================= */

    window.prevPage =
        function () {


            if (
                currentPage > 1
            ) {


                currentPage--;


                renderTable();


                window.scrollTo({

                    top: 0,

                    behavior: "smooth"

                });

            }

        };



    /* =========================
       OPEN PHOTO
    ========================= */

    window.openPhotoFromElement =
        function (
            image
        ) {


            const url =
                image.getAttribute(
                    "data-url"
                );


            openPhoto(
                url,
                image.alt
            );

        };


    window.openPhoto =
        function (
            url,
            title = ""
        ) {


            const modal =
                document.getElementById(
                    "photoModal"
                );


            const image =
                document.getElementById(
                    "modalImage"
                );


            const caption =
                document.getElementById(
                    "modalCaption"
                );


            image.src =
                url;


            caption.textContent =
                title;


            modal.style.display =
                "flex";

        };



    /* =========================
       CLOSE PHOTO
    ========================= */

    window.closePhoto =
        function () {


            const modal =
                document.getElementById(
                    "photoModal"
                );


            modal.style.display =
                "none";


            document
                .getElementById(
                    "modalImage"
                )
                .src =
                "";

        };



    /* =========================
       CLOSE CLICK OUTSIDE
    ========================= */

    document
        .getElementById(
            "photoModal"
        )
        .addEventListener(

            "click",

            function (
                event
            ) {


                if (
                    event.target ===
                    this
                ) {

                    closePhoto();

                }

            }

        );



    /* =========================
       CLOSE ESC
    ========================= */

    document.addEventListener(

        "keydown",

        function (
            event
        ) {


            if (
                event.key ===
                "Escape"
            ) {

                closePhoto();

            }

        }

    );



    /* =========================
       DOWNLOAD EXCEL
    ========================= */

    window.downloadExcel =
        function () {


            if (
                filteredData.length === 0
            ) {


                alert(
                    "Tidak ada data untuk di-download!"
                );


                return;

            }


            const dataExcel =
                filteredData.map(

                    (
                        item,
                        index
                    ) => {


                        return {


                            "No":
                                index + 1,


                            "Plat Nomor":
                                item.plat || "-",


                            "Nama":
                                item.nama || "-",


                            "Pajak STNK":
                                item.stnk || "-",


                            "BPKB":
                                item.bpkb || "-",


                            "Status":
                                item.status || "-",


                            "Keterangan":
                                item.keterangan || "-",


                            "Value":
                                formatRupiah(
                                    item.value
                                ),


                            "URL Photo":
                                item.photo || "-"

                        };

                    }

                );


            const worksheet =
                XLSX.utils
                .json_to_sheet(
                    dataExcel
                );


            worksheet["!cols"] = [

                {
                    wch: 8
                },

                {
                    wch: 18
                },

                {
                    wch: 25
                },

                {
                    wch: 18
                },

                {
                    wch: 18
                },

                {
                    wch: 18
                },

                {
                    wch: 18
                },

                {
                    wch: 20
                },

                {
                    wch: 50
                }

            ];


            const workbook =
                XLSX.utils
                .book_new();


            XLSX.utils
                .book_append_sheet(

                    workbook,

                    worksheet,

                    "Data Kendaraan"

                );


            XLSX.writeFile(

                workbook,

                "Data_Kendaraan.xlsx"

            );

        };


</script>
