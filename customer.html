<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ARC TRANS - Form Customer</title>


    <style>

        /* =========================
           GLOBAL
        ========================= */

        * {
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }


        body {
            margin: 0;
            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #0f6edb 0%,
                    #2196F3 45%,
                    #21CBF3 100%
                );

            padding: 30px 20px;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* =========================
           BACKGROUND EFFECT
        ========================= */

        body::before,
        body::after {
            content: "";

            position: fixed;

            border-radius: 50%;

            background:
                rgba(255, 255, 255, 0.12);

            pointer-events: none;

            z-index: -1;
        }


        body::before {
            width: 300px;
            height: 300px;

            top: -120px;
            left: -100px;
        }


        body::after {
            width: 350px;
            height: 350px;

            right: -150px;
            bottom: -150px;
        }


        /* =========================
           HOME BUTTON
        ========================= */

        .home-btn {

            position: fixed;

            top: 18px;
            left: 18px;

            z-index: 1000;

            width: 48px;
            height: 48px;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                rgba(255, 255, 255, 0.96);

            color: #1683e8;

            text-decoration: none;

            font-size: 22px;

            border-radius: 50%;

            box-shadow:
                0 8px 20px
                rgba(0, 0, 0, 0.18);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }


        .home-btn:hover {

            transform:
                translateY(-3px)
                scale(1.05);

            background: #ffffff;

            box-shadow:
                0 12px 25px
                rgba(0, 0, 0, 0.25);
        }


        /* =========================
           CONTAINER
        ========================= */

        .container {

            width: 100%;
            max-width: 620px;

            background:
                rgba(255, 255, 255, 0.97);

            border-radius: 24px;

            overflow: hidden;

            box-shadow:
                0 25px 60px
                rgba(0, 0, 0, 0.22);

            animation:
                fadeIn 0.5s ease;
        }


        /* =========================
           HEADER
        ========================= */

        .form-header {

            padding: 30px 25px;

            text-align: center;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #1976D2,
                    #2196F3,
                    #21CBF3
                );

            position: relative;
        }


        .form-icon {

            width: 72px;
            height: 72px;

            margin: 0 auto 15px;

            border-radius: 22px;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 36px;

            background:
                rgba(255, 255, 255, 0.18);

            border:
                1px solid
                rgba(255, 255, 255, 0.28);

            box-shadow:
                0 8px 20px
                rgba(0, 0, 0, 0.15);
        }


        .form-header h1 {

            margin: 0;

            font-size: 25px;

            font-weight: 700;

            letter-spacing: 0.5px;
        }


        .form-header p {

            margin: 8px 0 0;

            font-size: 13px;

            opacity: 0.9;
        }


        /* =========================
           FORM BODY
        ========================= */

        .form-body {

            padding: 30px 28px 32px;
        }


        /* =========================
           SECTION TITLE
        ========================= */

        .section-title {

            display: flex;

            align-items: center;

            gap: 10px;

            margin-bottom: 20px;

            font-size: 15px;

            font-weight: 700;

            color: #1e293b;
        }


        .section-title span {

            width: 34px;
            height: 34px;

            border-radius: 10px;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #e8f4ff;

            font-size: 18px;
        }


        /* =========================
           FORM GROUP
        ========================= */

        .form-group {

            margin-bottom: 18px;
        }


        label {

            display: block;

            margin-bottom: 7px;

            font-size: 13px;

            font-weight: 700;

            color: #475569;
        }


        .input-wrapper {

            position: relative;
        }


        .input-icon {

            position: absolute;

            left: 14px;
            top: 50%;

            transform:
                translateY(-50%);

            font-size: 17px;

            pointer-events: none;

            opacity: 0.7;
        }


        input,
        textarea {

            width: 100%;

            border:
                1px solid
                #dce3eb;

            outline: none;

            background: #f8fafc;

            color: #1e293b;

            font-size: 15px;

            border-radius: 12px;

            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }


        input {

            height: 50px;

            padding:
                0 15px
                0 45px;
        }


        textarea {

            min-height: 95px;

            padding: 13px 15px;

            resize: vertical;
        }


        input:focus,
        textarea:focus {

            background: white;

            border-color: #2196F3;

            box-shadow:
                0 0 0 4px
                rgba(33, 150, 243, 0.12);
        }


        input::placeholder,
        textarea::placeholder {

            color: #a0a8b3;
        }


        /* =========================
           FILE UPLOAD
        ========================= */

        .upload-box {

            position: relative;

            min-height: 150px;

            border:
                2px dashed
                #b9d8f5;

            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    #f4faff,
                    #fafdff
                );

            display: flex;

            align-items: center;
            justify-content: center;

            overflow: hidden;

            cursor: pointer;

            transition:
                border-color 0.25s ease,
                background 0.25s ease;
        }


        .upload-box:hover {

            border-color: #2196F3;

            background: #eef8ff;
        }


        #imageFile {

            position: absolute;

            width: 100%;
            height: 100%;

            top: 0;
            left: 0;

            opacity: 0;

            cursor: pointer;

            z-index: 3;
        }


        .upload-placeholder {

            text-align: center;

            padding: 20px;

            color: #64748b;

            pointer-events: none;
        }


        .upload-placeholder .camera {

            display: block;

            font-size: 38px;

            margin-bottom: 8px;
        }


        .upload-placeholder strong {

            display: block;

            color: #2196F3;

            margin-bottom: 5px;

            font-size: 14px;
        }


        .upload-placeholder small {

            font-size: 12px;
        }


        /* =========================
           PREVIEW FOTO
        ========================= */

        .preview {

            display: none;

            margin-top: 16px;

            position: relative;

            border-radius: 16px;

            overflow: hidden;

            background: #f1f5f9;

            border:
                1px solid
                #dce3eb;
        }


        #preview {

            display: block;

            width: 100%;

            max-height: 350px;

            object-fit: contain;

            background: #ffffff;
        }


        .preview-label {

            position: absolute;

            top: 10px;
            left: 10px;

            background:
                rgba(33, 150, 243, 0.92);

            color: white;

            padding: 6px 10px;

            border-radius: 8px;

            font-size: 11px;

            font-weight: 700;
        }


        /* =========================
           BUTTON
        ========================= */

        .btn-save {

            width: 100%;

            margin-top: 25px;

            padding: 15px;

            border: none;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    #1976D2,
                    #2196F3
                );

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 10px 22px
                rgba(33, 150, 243, 0.28);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                opacity 0.2s ease;
        }


        .btn-save:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 14px 28px
                rgba(33, 150, 243, 0.35);
        }


        .btn-save:disabled {

            cursor: not-allowed;

            opacity: 0.7;

            transform: none;
        }


        /* =========================
           BACK LINK
        ========================= */

        .back-link {

            display: block;

            text-align: center;

            margin-top: 18px;

            color: #64748b;

            text-decoration: none;

            font-size: 13px;

            font-weight: 600;

            transition: color 0.2s;
        }


        .back-link:hover {

            color: #2196F3;
        }


        /* =========================
           ANIMATION
        ========================= */

        @keyframes fadeIn {

            from {

                opacity: 0;

                transform:
                    translateY(25px)
                    scale(0.98);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 600px) {

            body {

                padding: 75px 12px 20px;

                align-items: flex-start;
            }


            .home-btn {

                top: 12px;
                left: 12px;
            }


            .container {

                border-radius: 20px;
            }


            .form-header {

                padding: 25px 20px;
            }


            .form-header h1 {

                font-size: 21px;
            }


            .form-body {

                padding: 25px 18px;
            }
        }

    </style>

</head>


<body>


    <!-- =========================
         HOME
    ========================= -->

    <a
        href="index.html"
        class="home-btn"
        title="Kembali ke Home"
        aria-label="Home"
    >
        🏠
    </a>



    <!-- =========================
         FORM CONTAINER
    ========================= -->

    <div class="container">


        <!-- HEADER -->

        <div class="form-header">

            <div class="form-icon">
                👤
            </div>

            <h1>
                FORM CUSTOMER
            </h1>

            <p>
                Tambahkan data customer dan foto identitas
            </p>

        </div>



        <!-- FORM BODY -->

        <div class="form-body">


            <div class="section-title">

                <span>
                    📋
                </span>

                Data Customer

            </div>



            <!-- NAMA -->

            <div class="form-group">

                <label for="nama">
                    Nama Lengkap
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        👤
                    </span>

                    <input
                        type="text"
                        id="nama"
                        autocomplete="name"
                        placeholder="Masukkan nama customer"
                    >

                </div>

            </div>



            <!-- NIK -->

            <div class="form-group">

                <label for="nik">
                    NIK
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        🪪
                    </span>

                    <input
                        type="text"
                        id="nik"
                        inputmode="numeric"
                        maxlength="16"
                        placeholder="Masukkan 16 digit NIK"
                    >

                </div>

            </div>



            <!-- ALAMAT KTP -->

            <div class="form-group">

                <label for="alamatktp">
                    Alamat KTP
                </label>

                <textarea
                    id="alamatktp"
                    placeholder="Masukkan alamat sesuai KTP"
                ></textarea>

            </div>



            <!-- DOMISILI -->

            <div class="form-group">

                <label for="domisili">
                    Alamat Domisili
                </label>

                <textarea
                    id="domisili"
                    placeholder="Masukkan alamat tempat tinggal saat ini"
                ></textarea>

            </div>



            <!-- HP -->

            <div class="form-group">

                <label for="hp">
                    Nomor HP
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        📱
                    </span>

                    <input
                        type="tel"
                        id="hp"
                        inputmode="numeric"
                        autocomplete="tel"
                        placeholder="Contoh: 08123456789"
                    >

                </div>

            </div>



            <!-- FOTO KTP -->

            <div class="form-group">

                <label>
                    Foto KTP
                </label>


                <div class="upload-box">

                    <input
                        type="file"
                        id="imageFile"
                        accept="image/*"
                        capture="environment"
                    >


                    <div class="upload-placeholder">

                        <span class="camera">
                            📷
                        </span>

                        <strong>
                            Ambil atau Upload Foto KTP
                        </strong>

                        <small>
                            Klik di sini untuk memilih foto
                        </small>

                    </div>

                </div>


                <div
                    class="preview"
                    id="previewContainer"
                >

                    <img
                        id="preview"
                        alt="Preview Foto KTP"
                    >

                    <div class="preview-label">
                        PREVIEW KTP
                    </div>

                </div>

            </div>



            <!-- BUTTON -->

            <button
                type="button"
                id="btnProses"
                class="btn-save"
            >
                💾 SIMPAN DATA CUSTOMER
            </button>



            <!-- BACK -->

            <a
                href="index.html"
                class="back-link"
            >
                ← Kembali ke Halaman Utama
            </a>


        </div>

    </div>



    <script type="module">


        /* =============================
           FIREBASE IMPORT
        ============================= */

        import {
            initializeApp
        }
        from
        "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";


        import {
            getDatabase,
            ref,
            set
        }
        from
        "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";



        /* =============================
           FIREBASE CONFIG
        ============================= */

        const firebaseConfig = {

            apiKey:
                "AIzaSyCOL9UC3tZOEX9ZwvY076O0yI5yqmYfb44",

            authDomain:
                "arctrans.firebaseapp.com",

            databaseURL:
                "https://arctrans-default-rtdb.asia-southeast1.firebasedatabase.app",

            projectId:
                "arctrans",

            storageBucket:
                "arctrans.firebasestorage.app",

            messagingSenderId:
                "60781918601",

            appId:
                "1:60781918601:web:c85d6131207f8a8958"

        };



        /* =============================
           INIT FIREBASE
        ============================= */

        const app =
            initializeApp(
                firebaseConfig
            );


        const db =
            getDatabase(
                app
            );



        /* =============================
           ELEMEN HTML
        ============================= */

        const namaInput =
            document.getElementById("nama");


        const nikInput =
            document.getElementById("nik");


        const alamatKTPInput =
            document.getElementById("alamatktp");


        const domisiliInput =
            document.getElementById("domisili");


        const hpInput =
            document.getElementById("hp");


        const imageInput =
            document.getElementById("imageFile");


        const preview =
            document.getElementById("preview");


        const previewContainer =
            document.getElementById(
                "previewContainer"
            );


        const btnProses =
            document.getElementById(
                "btnProses"
            );



        /* =============================
           VALIDASI NIK
        ============================= */

        nikInput.addEventListener(
            "input",
            function () {

                this.value =
                    this.value.replace(
                        /\D/g,
                        ""
                    );

            }
        );



        /* =============================
           VALIDASI NO HP
        ============================= */

        hpInput.addEventListener(
            "input",
            function () {

                this.value =
                    this.value.replace(
                        /\D/g,
                        ""
                    );

            }
        );



        /* =============================
           PREVIEW FOTO KTP
        ============================= */

        imageInput.addEventListener(
            "change",
            function () {

                const file =
                    this.files[0];


                if (!file) {

                    preview.src = "";

                    previewContainer.style.display =
                        "none";

                    return;

                }


                if (
                    !file.type.startsWith(
                        "image/"
                    )
                ) {

                    alert(
                        "File yang dipilih harus berupa gambar!"
                    );


                    this.value = "";


                    preview.src = "";


                    previewContainer.style.display =
                        "none";


                    return;

                }


                const reader =
                    new FileReader();


                reader.onload =
                    function (event) {

                        preview.src =
                            event.target.result;


                        previewContainer.style.display =
                            "block";

                    };


                reader.readAsDataURL(
                    file
                );

            }
        );



        /* =============================
           TOMBOL SIMPAN
        ============================= */

        btnProses.addEventListener(
            "click",
            kirimData
        );



        /* =============================
           KIRIM DATA
        ============================= */

        async function kirimData() {


            const nama =
                namaInput.value.trim();


            const nik =
                nikInput.value.trim();


            const alamatktp =
                alamatKTPInput.value.trim();


            const domisili =
                domisiliInput.value.trim();


            const hp =
                hpInput.value.trim();


            const file =
                imageInput.files[0];



            /* =========================
               VALIDASI
            ========================= */

            if (!nama) {

                alert(
                    "Nama wajib diisi!"
                );

                namaInput.focus();

                return;

            }


            if (!nik) {

                alert(
                    "NIK wajib diisi!"
                );

                nikInput.focus();

                return;

            }


            if (
                nik.length !== 16
            ) {

                alert(
                    "NIK harus terdiri dari 16 digit!"
                );

                nikInput.focus();

                return;

            }


            if (!alamatktp) {

                alert(
                    "Alamat KTP wajib diisi!"
                );

                alamatKTPInput.focus();

                return;

            }


            if (!domisili) {

                alert(
                    "Alamat domisili wajib diisi!"
                );

                domisiliInput.focus();

                return;

            }


            if (!hp) {

                alert(
                    "Nomor HP wajib diisi!"
                );

                hpInput.focus();

                return;

            }


            if (!file) {

                alert(
                    "Foto KTP wajib dipilih!"
                );

                return;

            }



            /* =========================
               NONAKTIFKAN TOMBOL
            ========================= */

            btnProses.disabled =
                true;


            btnProses.textContent =
                "⏳ MENGUPLOAD FOTO KTP...";



            try {


                /* =========================
                   UPLOAD CLOUDINARY
                ========================= */

                const formData =
                    new FormData();


                formData.append(
                    "file",
                    file
                );


                formData.append(
                    "upload_preset",
                    "arctrans"
                );


                /* ID FOTO UNIK */

                const uniqueId =
                    "ktp_" +
                    Date.now() +
                    "_" +
                    Math.floor(
                        Math.random() * 10000
                    );


                formData.append(
                    "public_id",
                    uniqueId
                );



                const response =
                    await fetch(

                        "https://api.cloudinary.com/v1_1/cesiolzm/image/upload",

                        {

                            method:
                                "POST",

                            body:
                                formData

                        }

                    );



                const uploadData =
                    await response.json();



                /* CEK ERROR CLOUDINARY */

                if (!response.ok) {

                    console.error(
                        "Cloudinary Error:",
                        uploadData
                    );


                    throw new Error(

                        uploadData.error?.message ||

                        "Upload foto KTP gagal"

                    );

                }



                /* URL FOTO */

                const photoKTP =
                    uploadData.secure_url;



                console.log(
                    "Foto KTP berhasil:",
                    photoKTP
                );



                /* =========================
                   DATA CUSTOMER
                ========================= */

                const dataCustomer = {

                    nama:
                        nama,

                    nik:
                        nik,

                    alamatktp:
                        alamatktp,

                    domisili:
                        domisili,

                    hp:
                        hp,

                    photoKTP:
                        photoKTP,

                    timestamp:
                        Date.now(),

                    tanggalInput:
                        new Date()
                        .toISOString()

                };



                /* =========================
                   SIMPAN KE FIREBASE
                ========================= */

                btnProses.textContent =
                    "💾 MENYIMPAN DATA...";



                await set(

                    ref(
                        db,
                        "customer/" + nik
                    ),

                    dataCustomer

                );



                /* =========================
                   BERHASIL
                ========================= */

                alert(
                    "✓ Data customer dan foto KTP berhasil disimpan!"
                );



                /* =========================
                   RESET FORM
                ========================= */

                namaInput.value = "";

                nikInput.value = "";

                alamatKTPInput.value = "";

                domisiliInput.value = "";

                hpInput.value = "";

                imageInput.value = "";

                preview.src = "";

                previewContainer.style.display =
                    "none";



            } catch (error) {


                console.error(
                    "ERROR:",
                    error
                );


                alert(

                    "Gagal menyimpan data!\n\n" +
                    error.message

                );


            } finally {


                btnProses.disabled =
                    false;


                btnProses.textContent =
                    "💾 SIMPAN DATA CUSTOMER";

            }

        }


    </script>


</body>
</html>
