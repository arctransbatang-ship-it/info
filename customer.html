<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ARC TRANS - Form Customer</title>


    <style>

        * {
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }


        body {
            margin: 0;

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #2196F3,
                    #21CBF3
                );

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;
        }


        .container {

            background: white;

            padding: 25px;

            border-radius: 15px;

            width: 100%;

            max-width: 450px;

            box-shadow:
                0 10px 25px
                rgba(0,0,0,0.2);

            animation:
                fadeIn 0.5s ease;
        }


        h3 {
            text-align: center;
            margin-bottom: 20px;
            color: #2196F3;
        }


        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
        }


        input,
        textarea {

            width: 100%;

            padding: 12px;

            margin-bottom: 15px;

            border-radius: 8px;

            border: 1px solid #ccc;

            outline: none;

            transition: 0.3s;

            font-size: 15px;
        }


        input:focus,
        textarea:focus {

            border-color: #2196F3;

            box-shadow:
                0 0 5px
                rgba(33,150,243,0.5);
        }


        textarea {

            min-height: 80px;

            resize: vertical;
        }


        button {

            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 8px;

            background: #2196F3;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }


        button:hover {
            background: #1976D2;
        }


        button:disabled {

            background: #90CAF9;

            cursor: not-allowed;
        }


        a {

            display: block;

            text-align: center;

            margin-top: 15px;

            text-decoration: none;

            color: #2196F3;

            font-weight: bold;
        }


        a:hover {
            text-decoration: underline;
        }


        .home-btn {

            position: fixed;

            top: 15px;

            left: 15px;

            background: white;

            color: #2196F3;

            padding: 8px 15px;

            border-radius: 20px;

            text-decoration: none;

            font-weight: bold;

            box-shadow:
                0 5px 10px
                rgba(0,0,0,0.2);
        }


        .preview {

            text-align: center;

            margin-bottom: 20px;
        }


        #preview {

            display: none;

            width: 100%;

            max-height: 350px;

            object-fit: contain;

            border-radius: 10px;

            border: 1px solid #ddd;
        }


        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        @media (max-width: 500px) {

            body {
                padding: 10px;
            }


            .container {
                margin-top: 50px;
            }
        }

    </style>

</head>


<body>


    <a
        href="index.html"
        class="home-btn"
    >
        Home
    </a>


    <div class="container">


        <h3>
            FORM CUSTOMER
        </h3>


        <label for="nama">
            Nama
        </label>

        <input
            type="text"
            id="nama"
            placeholder="Masukkan nama customer"
        >


        <label for="nik">
            NIK
        </label>

        <input
            type="text"
            id="nik"
            inputmode="numeric"
            maxlength="16"
            placeholder="16 digit NIK"
        >


        <label for="alamatktp">
            Alamat KTP
        </label>

        <textarea
            id="alamatktp"
            placeholder="Masukkan alamat sesuai KTP"
        ></textarea>


        <label for="domisili">
            Alamat Domisili Saat Ini
        </label>

        <textarea
            id="domisili"
            placeholder="Masukkan alamat domisili"
        ></textarea>


        <label for="hp">
            No. HP
        </label>

        <input
            type="tel"
            id="hp"
            inputmode="numeric"
            placeholder="Contoh: 08123456789"
        >


        <label for="imageFile">
            Ambil / Upload Foto KTP
        </label>


        <input
            type="file"
            id="imageFile"
            accept="image/*"
            capture="environment"
        >


        <div class="preview">

            <img
                id="preview"
                alt="Preview Foto KTP"
            >

        </div>


        <button
            type="button"
            id="btnProses"
        >
            SIMPAN DATA
        </button>


        <a href="home.html">
            ← Kembali
        </a>


    </div>



    <script type="module">


        /* =============================
           FIREBASE
        ============================= */

        import {
            initializeApp
        }
        from
        "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";


        import {
            getDatabase,
            ref,
            set
        }
        from
        "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";


        /* =============================
           FIREBASE CONFIG
        ============================= */

        const firebaseConfig = {

            apiKey:
                "AIzaSyCOL9UC3tZOEX9ZwvY076O0yI5yqmYfb44",

            authDomain:
                "arctrans.firebaseapp.com",

            databaseURL:
                "https://arctrans-default-rtdb.asia-southeast1.firebasedatabase.app",

            projectId:
                "arctrans",

            storageBucket:
                "arctrans.firebasestorage.app",

            messagingSenderId:
                "60781918601",

            appId:
                "1:60781918601:web:c85d6131207f8a8958"
        };


        /* =============================
           INIT FIREBASE
        ============================= */

        const app =
            initializeApp(firebaseConfig);


        const db =
            getDatabase(app);


        /* =============================
           ELEMEN
        ============================= */

        const namaInput =
            document.getElementById("nama");


        const nikInput =
            document.getElementById("nik");


        const alamatKTPInput =
            document.getElementById("alamatktp");


        const domisiliInput =
            document.getElementById("domisili");


        const hpInput =
            document.getElementById("hp");


        const imageInput =
            document.getElementById("imageFile");


        const preview =
            document.getElementById("preview");


        const btnProses =
            document.getElementById("btnProses");


        /* =============================
           VALIDASI NIK
        ============================= */

        nikInput.addEventListener(
            "input",
            function () {

                this.value =
                    this.value.replace(
                        /\D/g,
                        ""
                    );

            }
        );


        /* =============================
           VALIDASI NO HP
        ============================= */

        hpInput.addEventListener(
            "input",
            function () {

                this.value =
                    this.value.replace(
                        /\D/g,
                        ""
                    );

            }
        );


        /* =============================
           PREVIEW FOTO KTP
        ============================= */

        imageInput.addEventListener(
            "change",
            function () {

                const file =
                    this.files[0];


                if (!file) {

                    preview.src = "";

                    preview.style.display =
                        "none";

                    return;

                }


                if (
                    !file.type.startsWith(
                        "image/"
                    )
                ) {

                    alert(
                        "File yang dipilih harus berupa gambar!"
                    );


                    this.value = "";


                    preview.src = "";


                    preview.style.display =
                        "none";


                    return;

                }


                const reader =
                    new FileReader();


                reader.onload =
                    function (event) {

                        preview.src =
                            event.target.result;


                        preview.style.display =
                            "block";

                    };


                reader.readAsDataURL(
                    file
                );

            }
        );


        /* =============================
           TOMBOL SIMPAN
        ============================= */

        btnProses.addEventListener(
            "click",
            kirimData
        );


        /* =============================
           KIRIM DATA
        ============================= */

        async function kirimData() {


            const nama =
                namaInput.value.trim();


            const nik =
                nikInput.value.trim();


            const alamatktp =
                alamatKTPInput.value.trim();


            const domisili =
                domisiliInput.value.trim();


            const hp =
                hpInput.value.trim();


            const file =
                imageInput.files[0];


            /* =========================
               VALIDASI
            ========================= */

            if (!nama) {

                alert(
                    "Nama wajib diisi!"
                );


                namaInput.focus();


                return;

            }


            if (!nik) {

                alert(
                    "NIK wajib diisi!"
                );


                nikInput.focus();


                return;

            }


            if (
                nik.length !== 16
            ) {

                alert(
                    "NIK harus terdiri dari 16 digit!"
                );


                nikInput.focus();


                return;

            }


            if (!file) {

                alert(
                    "Foto KTP wajib dipilih!"
                );


                return;

            }


            /* =========================
               MULAI PROSES
            ========================= */

            btnProses.disabled =
                true;


            btnProses.textContent =
                "Mengupload Foto KTP...";


            try {


                /* =========================
                   UPLOAD CLOUDINARY
                ========================= */

                const formData =
                    new FormData();


                formData.append(
                    "file",
                    file
                );


                formData.append(
                    "upload_preset",
                    "arctrans"
                );


                /*
                   Nama file unik
                */

                const uniqueId =
                    "ktp_" +
                    Date.now() +
                    "_" +
                    Math.floor(
                        Math.random() * 10000
                    );


                formData.append(
                    "public_id",
                    uniqueId
                );


                const response =
                    await fetch(

                        "https://api.cloudinary.com/v1_1/cesiolzm/image/upload",

                        {

                            method:
                                "POST",

                            body:
                                formData

                        }

                    );


                const uploadData =
                    await response.json();


                /*
                   CEK ERROR CLOUDINARY
                */

                if (!response.ok) {

                    console.error(
                        "Cloudinary Error:",
                        uploadData
                    );


                    throw new Error(

                        uploadData.error?.message ||
                        "Upload foto KTP gagal"

                    );

                }


                /*
                   URL FOTO KTP
                */

                const photoKTP =
                    uploadData.secure_url;


                console.log(
                    "Foto KTP:",
                    photoKTP
                );


                /* =========================
                   MEMBUAT ID FIREBASE
                ========================= */

                const id =
                    nik
                    .replace(
                        /[.#$[\]/]/g,
                        "_"
                    );


                /* =========================
                   DATA CUSTOMER
                ========================= */

                const dataCustomer = {

                    nama:
                        nama,

                    nik:
                        nik,

                    alamatktp:
                        alamatktp,

                    domisili:
                        domisili,

                    hp:
                        hp,

                    photoKTP:
                        photoKTP,

                    timestamp:
                        Date.now(),

                    tanggalInput:
                        new Date()
                        .toISOString()

                };


                /* =========================
                   SIMPAN KE FIREBASE
                ========================= */

                btnProses.textContent =
                    "Menyimpan Data...";


                await set(

                    ref(
                        db,
                        "customer/" + id
                    ),

                    dataCustomer

                );


                /* =========================
                   BERHASIL
                ========================= */

                alert(
                    "✓ Data customer dan foto KTP berhasil disimpan!"
                );


                /* =========================
                   RESET FORM
                ========================= */

                namaInput.value = "";

                nikInput.value = "";

                alamatKTPInput.value = "";

                domisiliInput.value = "";

                hpInput.value = "";

                imageInput.value = "";

                preview.src = "";

                preview.style.display =
                    "none";


            } catch (error) {


                console.error(
                    "ERROR:",
                    error
                );


                alert(

                    "Gagal menyimpan data!\n\n" +
                    error.message

                );


            } finally {


                btnProses.disabled =
                    false;


                btnProses.textContent =
                    "SIMPAN DATA";

            }

        }


    </script>


</body>

</html>
