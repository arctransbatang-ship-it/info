<script type="module">

    /* =================================
       FIREBASE IMPORT
    ================================= */

    import {
        initializeApp
    }
    from
    "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";


    import {
        getDatabase,
        ref,
        set,
        remove,
        update,
        onValue
    }
    from
    "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";



    /* =================================
       FIREBASE CONFIG
    ================================= */

    const firebaseConfig = {

        apiKey:
            "AIzaSyCOL9UC3tZOEX9ZwvY076O0yI5yqmYfb44",

        authDomain:
            "arctrans.firebaseapp.com",

        databaseURL:
            "https://arctrans-default-rtdb.asia-southeast1.firebasedatabase.app",

        projectId:
            "arctrans",

        storageBucket:
            "arctrans.firebasestorage.app",

        messagingSenderId:
            "60781918601",

        appId:
            "1:60781918601:web:c85d6131207f8a8958"

    };



    /* =================================
       CLOUDINARY CONFIG
    ================================= */

    const CLOUDINARY_CLOUD_NAME =
        "cesiolzm";


    const CLOUDINARY_UPLOAD_PRESET =
        "arctrans";



    /* =================================
       INIT FIREBASE
    ================================= */

    const app =
        initializeApp(
            firebaseConfig
        );


    const db =
        getDatabase(
            app
        );



    /* =================================
       ELEMEN HTML
    ================================= */

    const platInput =
        document.getElementById(
            "plat"
        );


    const namaInput =
        document.getElementById(
            "nama"
        );


    const idCustomerInput =
        document.getElementById(
            "idcustomer"
        );


    const customerInput =
        document.getElementById(
            "customer"
        );


    const rentalTypeInput =
        document.getElementById(
            "rentaltype"
        );


    const hargaInput =
        document.getElementById(
            "harga"
        );


    const tanggalSewaInput =
        document.getElementById(
            "tanggalsewa"
        );


    const selesaiSewaInput =
        document.getElementById(
            "selesaisewa"
        );


    const durasiInfo =
        document.getElementById(
            "durasiInfo"
        );


    const totalInput =
        document.getElementById(
            "total"
        );


    const bayarInput =
        document.getElementById(
            "bayar"
        );


    const sisaInput =
        document.getElementById(
            "sisa"
        );


    const sisaInfo =
        document.getElementById(
            "sisaInfo"
        );


    const jaminanInput =
        document.getElementById(
            "jaminan"
        );


    const fotoJaminanInput =
        document.getElementById(
            "fotoJaminan"
        );


    const previewFoto =
        document.getElementById(
            "previewFoto"
        );


    const uploadStatus =
        document.getElementById(
            "uploadStatus"
        );


    const btnProses =
        document.getElementById(
            "btnProses"
        );



    /* =================================
       PENYIMPANAN DATA
    ================================= */

    let daftarUnit = {};

    let daftarCustomer = {};



    /* =================================
       FORMAT TANGGAL HARI INI
    ================================= */

    function getTanggalHariIni() {

        const sekarang =
            new Date();


        const tahun =
            sekarang.getFullYear();


        const bulan =
            String(
                sekarang.getMonth() + 1
            )
            .padStart(
                2,
                "0"
            );


        const hari =
            String(
                sekarang.getDate()
            )
            .padStart(
                2,
                "0"
            );


        return (
            tahun +
            "-" +
            bulan +
            "-" +
            hari
        );

    }


    const tanggalHariIni =
        getTanggalHariIni();



    /* =================================
       BATASI TANGGAL SEWA
    ================================= */

    tanggalSewaInput.min =
        tanggalHariIni;


    selesaiSewaInput.min =
        tanggalHariIni;



    /* =================================
       FORMAT RUPIAH
    ================================= */

    function formatRupiah(
        angka
    ) {

        const nilai =
            Number(angka) || 0;


        return (
            "Rp " +
            nilai.toLocaleString(
                "id-ID"
            )
        );

    }



    /* =================================
       AMBIL ANGKA RUPIAH
    ================================= */

    function angkaDariRupiah(
        nilai
    ) {

        return Number(

            String(
                nilai || ""
            )

            .replace(
                /\D/g,
                ""
            )

        ) || 0;

    }



    /* =================================
       PREVIEW FOTO
    ================================= */

    fotoJaminanInput.addEventListener(

        "change",

        function () {

            const file =
                this.files[0];


            if (!file) {

                previewFoto.src =
                    "";


                previewFoto.style.display =
                    "none";


                return;

            }


            if (
                !file.type.startsWith(
                    "image/"
                )
            ) {

                alert(
                    "File harus berupa gambar!"
                );


                fotoJaminanInput.value =
                    "";


                return;

            }


            const reader =
                new FileReader();


            reader.onload =
                function (
                    event
                ) {

                    previewFoto.src =
                        event.target.result;


                    previewFoto.style.display =
                        "block";

                };


            reader.readAsDataURL(
                file
            );

        }

    );



    /* =================================
       AMBIL DATA UNIT
    ================================= */

    const unitRef =
        ref(
            db,
            "ready"
        );


    onValue(

        unitRef,

        function (
            snapshot
        ) {

            const data =
                snapshot.val();


            daftarUnit =
                data || {};


            platInput.innerHTML =
                `
                <option value="">
                    -- Pilih ID Unit --
                </option>
                `;


            if (!data) {

                platInput.innerHTML +=
                    `
                    <option
                        value=""
                        disabled
                    >
                        Data unit belum tersedia
                    </option>
                    `;


                return;

            }


            Object.entries(
                data
            )

            .forEach(

                function (
                    [id, unit]
                ) {

                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        id;


                    option.textContent =
                        (
                            unit.plat ||
                            id
                        )
                        +
                        " - "
                        +
                        (
                            unit.nama ||
                            "Tanpa Nama"
                        );


                    platInput.appendChild(
                        option
                    );

                }

            );

        },

        function (
            error
        ) {

            console.error(
                "Error Unit:",
                error
            );


            platInput.innerHTML =
                `
                <option value="">
                    Gagal memuat data unit
                </option>
                `;

        }

    );



    /* =================================
       SAAT UNIT DIPILIH
    ================================= */

    platInput.addEventListener(

        "change",

        function () {

            const id =
                this.value;


            if (!id) {

                namaInput.value =
                    "";


                return;

            }


            const unit =
                daftarUnit[id];


            if (!unit) {

                return;

            }


            namaInput.value =
                unit.nama || "";


            hargaInput.value =
                "";


            totalInput.value =
                "";


            bayarInput.value =
                "";


            sisaInput.value =
                "";


            sisaInfo.className =
                "sisa-info";

        }

    );



    /* =================================
       AMBIL DATA CUSTOMER
    ================================= */

    const customerRef =
        ref(
            db,
            "customer"
        );


    onValue(

        customerRef,

        function (
            snapshot
        ) {

            const data =
                snapshot.val();


            daftarCustomer =
                data || {};


            idCustomerInput.innerHTML =
                `
                <option value="">
                    -- Pilih ID Customer --
                </option>
                `;


            if (!data) {

                idCustomerInput.innerHTML +=
                    `
                    <option
                        value=""
                        disabled
                    >
                        Data customer belum tersedia
                    </option>
                    `;


                return;

            }


            Object.entries(
                data
            )

            .forEach(

                function (
                    [id, customer]
                ) {

                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        id;


                    option.textContent =
                        (
                            customer.nik ||
                            id
                        )
                        +
                        " - "
                        +
                        (
                            customer.nama ||
                            "Tanpa Nama"
                        );


                    idCustomerInput.appendChild(
                        option
                    );

                }

            );

        },

        function (
            error
        ) {

            console.error(
                "Error Customer:",
                error
            );


            idCustomerInput.innerHTML =
                `
                <option value="">
                    Gagal memuat customer
                </option>
                `;

        }

    );



    /* =================================
       SAAT CUSTOMER DIPILIH
    ================================= */

    idCustomerInput.addEventListener(

        "change",

        function () {

            const id =
                this.value;


            if (!id) {

                customerInput.value =
                    "";


                return;

            }


            const dataCustomer =
                daftarCustomer[id];


            customerInput.value =
                dataCustomer?.nama ||
                "";

        }

    );



    /* =================================
       HITUNG JUMLAH HARI
    ================================= */

    function hitungJumlahHari() {

        const tanggalSewa =
            tanggalSewaInput.value;


        const selesaiSewa =
            selesaiSewaInput.value;


        if (
            !tanggalSewa ||
            !selesaiSewa
        ) {

            return 0;

        }


        const mulai =
            new Date(
                tanggalSewa +
                "T00:00:00"
            );


        const selesai =
            new Date(
                selesaiSewa +
                "T00:00:00"
            );


        const selisih =
            selesai -
            mulai;


        return Math.ceil(

            selisih /

            (
                1000 *
                60 *
                60 *
                24
            )

        );

    }



    /* =================================
       TAMPILKAN DURASI SEWA
    ================================= */

    function updateDurasiInfo() {

        const tanggalSewa =
            tanggalSewaInput.value;


        const selesaiSewa =
            selesaiSewaInput.value;


        if (
            !tanggalSewa ||
            !selesaiSewa
        ) {

            durasiInfo.className =
                "durasi-info";


            durasiInfo.textContent =
                "";


            return;

        }


        const jumlahHari =
            hitungJumlahHari();


        if (
            jumlahHari < 0
        ) {

            durasiInfo.className =
                "durasi-info active error";


            durasiInfo.textContent =
                "⚠ Estimasi tanggal selesai tidak boleh sebelum tanggal sewa.";


            return;

        }


        if (
            rentalTypeInput.value ===
            "setengahhari"
        ) {

            durasiInfo.className =
                "durasi-info active";


            durasiInfo.textContent =
                "🕒 Durasi sewa: Setengah Hari";


            return;

        }


        durasiInfo.className =
            "durasi-info active";


        durasiInfo.textContent =
            "📅 Durasi sewa: " +
            jumlahHari +
            " hari";

    }



    /* =================================
       VALIDASI TANGGAL SEWA
    ================================= */

    tanggalSewaInput.addEventListener(

        "change",

        function () {

            const tanggalDipilih =
                this.value;


            const hariIni =
                getTanggalHariIni();


            if (
                tanggalDipilih &&
                tanggalDipilih < hariIni
            ) {

                alert(
                    "Tanggal sewa tidak boleh sebelum hari ini!"
                );


                this.value =
                    "";


                selesaiSewaInput.value =
                    "";


                durasiInfo.className =
                    "durasi-info";


                totalInput.value =
                    "";


                sisaInput.value =
                    "";


                return;

            }


            selesaiSewaInput.min =
                tanggalDipilih ||
                hariIni;


            if (
                selesaiSewaInput.value &&
                selesaiSewaInput.value <
                tanggalDipilih
            ) {

                alert(
                    "Estimasi tanggal selesai tidak boleh sebelum tanggal sewa!"
                );


                selesaiSewaInput.value =
                    "";

            }


            updateDurasiInfo();

            hitungTotal();

        }

    );



    /* =================================
       VALIDASI ESTIMASI SELESAI
    ================================= */

    selesaiSewaInput.addEventListener(

        "change",

        function () {

            const tanggalSelesai =
                this.value;


            const tanggalSewa =
                tanggalSewaInput.value;


            const hariIni =
                getTanggalHariIni();


            if (
                tanggalSelesai &&
                tanggalSelesai < hariIni
            ) {

                alert(
                    "Estimasi tanggal selesai tidak boleh sebelum hari ini!"
                );


                this.value =
                    "";


                updateDurasiInfo();


                return;

            }


            if (
                !tanggalSewa
            ) {

                alert(
                    "Silakan pilih tanggal sewa terlebih dahulu!"
                );


                this.value =
                    "";


                updateDurasiInfo();


                return;

            }


            if (
                tanggalSelesai <
                tanggalSewa
            ) {

                alert(
                    "Estimasi tanggal selesai tidak boleh sebelum tanggal sewa!"
                );


                this.value =
                    "";


                updateDurasiInfo();


                return;

            }


            updateDurasiInfo();

            hitungTotal();

        }

    );



    /* =================================
       INPUT HARGA
    ================================= */

    hargaInput.addEventListener(

        "input",

        function () {

            const angka =
                angkaDariRupiah(
                    this.value
                );


            this.value =
                angka > 0
                ? formatRupiah(
                    angka
                )
                : "";


            hitungTotal();

        }

    );



    /* =================================
       INPUT BAYAR
    ================================= */

    bayarInput.addEventListener(

        "input",

        function () {

            const angka =
                angkaDariRupiah(
                    this.value
                );


            this.value =
                angka > 0
                ? formatRupiah(
                    angka
                )
                : "";


            hitungSisa();

        }

    );



    /* =================================
       INPUT TOTAL MANUAL
    ================================= */

    totalInput.addEventListener(

        "input",

        function () {

            if (
                rentalTypeInput.value ===
                "setengahhari"
            ) {

                const angka =
                    angkaDariRupiah(
                        this.value
                    );


                this.value =
                    angka > 0
                    ? formatRupiah(
                        angka
                    )
                    : "";

            }


            hitungSisa();

        }

    );



    /* =================================
       HITUNG TOTAL
    ================================= */

    function hitungTotal() {

        const harga =
            angkaDariRupiah(
                hargaInput.value
            );


        const rentalType =
            rentalTypeInput.value;


        const jumlahHari =
            hitungJumlahHari();


        if (
            rentalType ===
            "setengahhari"
        ) {

            totalInput.readOnly =
                false;


            totalInput.placeholder =
                "Input total biaya manual";


            hitungSisa();


            return;

        }


        totalInput.readOnly =
            true;


        totalInput.placeholder =
            "Total dihitung otomatis";


        if (
            harga <= 0 ||
            !rentalType ||
            jumlahHari <= 0
        ) {

            totalInput.value =
                "";


            hitungSisa();


            return;

        }


        let jumlahPeriode =
            0;


        if (
            rentalType ===
            "harian"
        ) {

            jumlahPeriode =
                jumlahHari;

        }


        else if (
            rentalType ===
            "mingguan"
        ) {

            jumlahPeriode =
                Math.ceil(
                    jumlahHari / 7
                );

        }


        else if (
            rentalType ===
            "bulanan"
        ) {

            jumlahPeriode =
                Math.ceil(
                    jumlahHari / 30
                );

        }


        const total =
            harga *
            jumlahPeriode;


        totalInput.value =
            formatRupiah(
                total
            );


        hitungSisa();

    }



    /* =================================
       HITUNG SISA PEMBAYARAN
    ================================= */

    function hitungSisa() {

        const total =
            angkaDariRupiah(
                totalInput.value
            );


        const bayar =
            angkaDariRupiah(
                bayarInput.value
            );


        sisaInfo.className =
            "sisa-info";


        if (
            total <= 0
        ) {

            sisaInput.value =
                "";


            sisaInfo.textContent =
                "";


            return;

        }


        /*
           LUNAS
        */

        if (
            bayar === total
        ) {

            sisaInput.value =
                "LUNAS";


            sisaInfo.className =
                "sisa-info active sisa-lunas";


            sisaInfo.textContent =
                "✓ Pembayaran LUNAS";


            return;

        }


        /*
           KELEBIHAN BAYAR
           NILAI POSITIF
        */

        if (
            bayar > total
        ) {

            const sisa =
                bayar -
                total;


            sisaInput.value =
                "+ " +
                formatRupiah(
                    sisa
                );


            sisaInfo.className =
                "sisa-info active sisa-lebih";


            sisaInfo.textContent =
                "＋ Kelebihan pembayaran: +" +
                formatRupiah(
                    sisa
                );


            return;

        }


        /*
           KEKURANGAN BAYAR
           NILAI NEGATIF
        */

        const sisa =
            bayar -
            total;


        sisaInput.value =
            "- " +
            formatRupiah(
                Math.abs(
                    sisa
                )
            );


        sisaInfo.className =
            "sisa-info active sisa-kurang";


        sisaInfo.textContent =
            "Sisa pembayaran: -" +
            formatRupiah(
                Math.abs(
                    sisa
                )
            );

    }



    /* =================================
       EVENT RENTAL TYPE
    ================================= */

    rentalTypeInput.addEventListener(

        "change",

        function () {

            if (
                this.value ===
                "setengahhari"
            ) {

                totalInput.value =
                    "";


                totalInput.readOnly =
                    false;


                totalInput.placeholder =
                    "Input total biaya manual";


                durasiInfo.className =
                    "durasi-info active";


                durasiInfo.textContent =
                    "🕒 Durasi sewa: Setengah Hari";

            }

            else {

                totalInput.value =
                    "";


                totalInput.readOnly =
                    true;


                totalInput.placeholder =
                    "Total dihitung otomatis";


                updateDurasiInfo();

            }


            hitungTotal();

        }

    );



    /* =================================
       UPLOAD FOTO CLOUDINARY
    ================================= */

    async function uploadFotoJaminan() {

        const file =
            fotoJaminanInput.files[0];


        if (!file) {

            return {

                url:
                    "",

                publicId:
                    ""

            };

        }


        uploadStatus.textContent =
            "Mengupload foto jaminan...";


        const formData =
            new FormData();


        formData.append(
            "file",
            file
        );


        formData.append(
            "upload_preset",
            CLOUDINARY_UPLOAD_PRESET
        );


        formData.append(
            "folder",
            "arctrans/jaminan"
        );


        formData.append(
            "public_id",
            "JAMINAN_" +
            Date.now()
        );


        const response =
            await fetch(

                "https://api.cloudinary.com/v1_1/" +
                CLOUDINARY_CLOUD_NAME +
                "/image/upload",

                {

                    method:
                        "POST",

                    body:
                        formData

                }

            );


        const hasil =
            await response.json();


        if (
            !response.ok
        ) {

            throw new Error(

                hasil.error?.message ||

                "Gagal upload foto"

            );

        }


        uploadStatus.textContent =
            "✓ Foto berhasil diupload";


        return {

            url:
                hasil.secure_url,

            publicId:
                hasil.public_id

        };

    }



    /* =================================
       TOMBOL PROSES
    ================================= */

    btnProses.addEventListener(

        "click",

        kirimData

    );



    /* =================================
       SIMPAN DATA
    ================================= */

    async function kirimData() {


        const unitId =
            platInput.value;


        const unit =
            daftarUnit[unitId];


        const idcustomer =
            idCustomerInput.value;


        const dataCustomer =
            daftarCustomer[idcustomer];


        const nama =
            namaInput.value.trim();


        const customer =
            customerInput.value.trim();


        const rentaltype =
            rentalTypeInput.value;


        const harga =
            angkaDariRupiah(
                hargaInput.value
            );


        const tanggalsewa =
            tanggalSewaInput.value;


        const selesaisewa =
            selesaiSewaInput.value;


        const total =
            angkaDariRupiah(
                totalInput.value
            );


        const bayar =
            angkaDariRupiah(
                bayarInput.value
            );


        const jaminan =
            jaminanInput.value.trim();


        const foto =
            fotoJaminanInput.files[0];


        const hariIni =
            getTanggalHariIni();



        /* =============================
           VALIDASI UNIT
        ============================== */

        if (!unitId) {

            alert(
                "Pilih ID Unit!"
            );

            return;

        }



        /* =============================
           VALIDASI CUSTOMER
        ============================== */

        if (!idcustomer) {

            alert(
                "Pilih ID Customer!"
            );

            return;

        }



        /* =============================
           VALIDASI RENTAL TYPE
        ============================== */

        if (!rentaltype) {

            alert(
                "Pilih Rental Type!"
            );

            return;

        }



        /* =============================
           VALIDASI HARGA
        ============================== */

        if (
            harga <= 0
        ) {

            alert(
                "Harga harus diisi!"
            );

            return;

        }



        /* =============================
           VALIDASI TANGGAL SEWA
        ============================== */

        if (
            !tanggalsewa
        ) {

            alert(
                "Pilih Tanggal Sewa!"
            );

            return;

        }


        if (
            tanggalsewa <
            hariIni
        ) {

            alert(
                "Tanggal sewa tidak boleh lebih kecil dari tanggal hari ini!"
            );

            tanggalSewaInput.value =
                "";

            return;

        }



        /* =============================
           VALIDASI TANGGAL SELESAI
        ============================== */

        if (
            !selesaisewa
        ) {

            alert(
                "Pilih Estimasi Tanggal Selesai!"
            );

            return;

        }


        if (
            selesaisewa <
            hariIni
        ) {

            alert(
                "Estimasi tanggal selesai tidak boleh sebelum hari ini!"
            );

            selesaiSewaInput.value =
                "";

            return;

        }


        if (
            rentaltype !==
            "setengahhari"
        ) {

            if (
                selesaisewa <=
                tanggalsewa
            ) {

                alert(
                    "Tanggal selesai harus lebih besar dari tanggal sewa!"
                );

                return;

            }

        }



        /* =============================
           VALIDASI TOTAL
        ============================== */

        if (
            total <= 0
        ) {

            alert(
                "Total biaya belum valid!"
            );

            return;

        }



        /* =============================
           PERHITUNGAN SISA

           bayar < total
           = NEGATIF

           bayar > total
           = POSITIF

           bayar = total
           = 0
        ============================== */

        const sisa =
            bayar -
            total;



        /* =============================
           KELEBIHAN PEMBAYARAN
        ============================== */

        const kelebihanBayar =
            bayar > total
            ? bayar - total
            : 0;



        /* =============================
           VALIDASI JAMINAN
        ============================== */

        if (
            !jaminan
        ) {

            alert(
                "Data jaminan wajib diisi!"
            );

            return;

        }



        /* =============================
           VALIDASI FOTO
        ============================== */

        if (
            !foto
        ) {

            alert(
                "Foto jaminan wajib diupload!"
            );

            return;

        }



        /* =============================
           DISABLE BUTTON
        ============================== */

        btnProses.disabled =
            true;


        btnProses.textContent =
            "Mengupload Foto...";


        try {


            /* =========================
               UPLOAD FOTO
            ========================== */

            const hasilUpload =
                await uploadFotoJaminan();



            /* =========================
               UPDATE BUTTON
            ========================== */

            btnProses.textContent =
                "Menyimpan Data...";



            /* =========================
               ID TRANSAKSI
            ========================== */

            const transaksiId =
                "RENT_" +
                Date.now();



            /* =========================
               JUMLAH HARI
            ========================== */

            let jumlahHari =
                hitungJumlahHari();


            if (
                rentaltype ===
                "setengahhari"
            ) {

                jumlahHari =
                    0.5;

            }



            /* =========================
               STATUS PEMBAYARAN
            ========================== */

            let statusPembayaran =
                "BELUM LUNAS";


            if (
                bayar === total
            ) {

                statusPembayaran =
                    "LUNAS";

            }


            else if (
                bayar > total
            ) {

                statusPembayaran =
                    "LEBIH BAYAR";

            }



            /* =========================
               FORMAT SISA
            ========================== */

            let sisaFormat =
                "LUNAS";


            if (
                sisa > 0
            ) {

                sisaFormat =
                    "+ " +
                    formatRupiah(
                        sisa
                    );

            }


            else if (
                sisa < 0
            ) {

                sisaFormat =
                    "- " +
                    formatRupiah(
                        Math.abs(
                            sisa
                        )
                    );

            }



            /* =========================
               DATA RENT
            ========================== */

            const dataRent = {


                transaksiId:
                    transaksiId,


                /* UNIT */

                unitId:
                    unitId,


                plat:
                    unit?.plat ||
                    unitId,


                namaUnit:
                    nama,


                /* CUSTOMER */

                idcustomer:
                    idcustomer,


                nik:
                    dataCustomer?.nik ||
                    idcustomer,


                customer:
                    customer,


                alamatktp:
                    dataCustomer?.alamatktp ||
                    "",


                hp:
                    dataCustomer?.hp ||
                    "",


                /* RENTAL */

                rentaltype:
                    rentaltype,


                harga:
                    harga,


                hargaFormat:
                    formatRupiah(
                        harga
                    ),


                tanggalsewa:
                    tanggalsewa,


                selesaisewa:
                    selesaisewa,


                jumlahHari:
                    jumlahHari,


                total:
                    total,


                totalFormat:
                    formatRupiah(
                        total
                    ),


                bayar:
                    bayar,


                bayarFormat:
                    formatRupiah(
                        bayar
                    ),


                /*
                   SISA:

                   NEGATIF = KURANG BAYAR
                   POSITIF = LEBIH BAYAR
                   0       = LUNAS
                */

                sisa:
                    sisa,


                sisaFormat:
                    sisaFormat,


                kelebihanBayar:
                    kelebihanBayar,


                kelebihanBayarFormat:
                    formatRupiah(
                        kelebihanBayar
                    ),


                statusPembayaran:
                    statusPembayaran,


                /* JAMINAN */

                jaminan:
                    jaminan,


                fotoJaminan:
                    hasilUpload.url,


                fotoJaminanPublicId:
                    hasilUpload.publicId,


                /* STATUS */

                status:
                    "RENT OUT",


                timestamp:
                    Date.now(),


                tanggalInput:
                    new Date()
                    .toISOString()

            };



            /* =========================
               SIMPAN DATA RENT OUT
            ========================== */

            await set(

                ref(

                    db,

                    "rentout/" +
                    transaksiId

                ),

                dataRent

            );



            /* =========================
               HAPUS UNIT DARI READY
            ========================== */

            await remove(

                ref(
                    db,
                    "ready/" + unitId
                )

            );



            /* =========================
               UPDATE KETERANGAN UNIT
            ========================== */

            await update(

                ref(
                    db,
                    "unit/" + unitId
                ),

                {
                    keterangan: "Out"
                }

            );



            /* =========================
               STATUS BERHASIL
            ========================== */

            uploadStatus.textContent =
                "✓ Data berhasil disimpan";


            alert(
                "Data RENT OUT berhasil disimpan!\n\n" +
                "Unit telah dihapus dari READY dan status diubah menjadi OUT."
            );



            /* =========================
               RESET FORM
            ========================== */

            platInput.value =
                "";


            namaInput.value =
                "";


            idCustomerInput.value =
                "";


            customerInput.value =
                "";


            rentalTypeInput.value =
                "";


            hargaInput.value =
                "";


            tanggalSewaInput.value =
                "";


            selesaiSewaInput.value =
                "";


            totalInput.value =
                "";


            bayarInput.value =
                "";


            sisaInput.value =
                "";


            jaminanInput.value =
                "";


            fotoJaminanInput.value =
                "";


            previewFoto.src =
                "";


            previewFoto.style.display =
                "none";


            durasiInfo.textContent =
                "";


            durasiInfo.className =
                "durasi-info";


            sisaInfo.textContent =
                "";


            sisaInfo.className =
                "sisa-info";


            totalInput.readOnly =
                true;


            totalInput.placeholder =
                "Total akan dihitung otomatis";


            uploadStatus.textContent =
                "";


            selesaiSewaInput.min =
                getTanggalHariIni();

        }


        catch (
            error
        ) {

            console.error(
                "ERROR:",
                error
            );


            uploadStatus.textContent =
                "Error: " +
                error.message;


            alert(
                "Gagal menyimpan data:\n\n" +
                error.message
            );

        }


        finally {

            btnProses.disabled =
                false;


            btnProses.textContent =
                "Proses Rent Out";

        }

    }

</script>
