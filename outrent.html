<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta

>

<title>ARC TRANS - RENT OUT</title>


<style>

* {
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

:root {

    --primary: #2196F3;
    --primary-dark: #1976D2;
    --secondary: #21CBF3;

    --success: #16a34a;
    --danger: #dc2626;
    --warning: #f59e0b;

    --text: #1e293b;
    --muted: #64748b;
    --border: #dbe3ee;
    --background: #f1f5f9;

}

body {

    margin: 0;

    min-height: 100vh;

    background:
        linear-gradient(
            135deg,
            #e0f2fe,
            #f8fafc
        );

    color: var(--text);

    padding: 20px;

}


/* =========================
   TOPBAR
========================= */

.topbar {

    width: 100%;
    max-width: 850px;

    margin:
        0 auto 20px;

    display: flex;

    align-items: center;

    justify-content:
        space-between;

}

.brand {

    display: flex;

    align-items: center;

    gap: 12px;

}

.brand-icon {

    width: 45px;
    height: 45px;

    border-radius: 14px;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--secondary)
        );

    color: white;

    font-size: 22px;

    box-shadow:
        0 8px 20px
        rgba(
            33,
            150,
            243,
            0.25
        );

}

.brand-text h1 {

    margin: 0;

    font-size: 20px;

}

.brand-text p {

    margin:
        3px 0 0;

    font-size: 12px;

    color: var(--muted);

}

.home-btn {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    gap: 7px;

    padding:
        10px 16px;

    border-radius: 12px;

    text-decoration: none;

    background: white;

    color:
        var(--primary);

    font-weight: 700;

    box-shadow:
        0 4px 15px
        rgba(
            0,
            0,
            0,
            0.08
        );

    transition: 0.2s;

}

.home-btn:hover {

    transform:
        translateY(-2px);

    background:
        var(--primary);

    color: white;

}


/* =========================
   CONTAINER
========================= */

.container {

    width: 100%;

    max-width: 850px;

    margin: auto;

    background: white;

    border-radius: 24px;

    padding: 32px;

    box-shadow:
        0 15px 45px
        rgba(
            15,
            23,
            42,
            0.12
        );

    animation:
        fadeIn
        0.4s
        ease;

}

@keyframes fadeIn {

    from {

        opacity: 0;

        transform:
            translateY(15px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


/* =========================
   TITLE
========================= */

.form-title {

    margin-bottom: 30px;

}

.form-title h2 {

    margin:
        0 0 6px;

    font-size: 25px;

}

.form-title p {

    margin: 0;

    color: var(--muted);

    font-size: 14px;

}


/* =========================
   FORM GRID
========================= */

.form-grid {

    display: grid;

    grid-template-columns:
        repeat(
            2,
            minmax(
                0,
                1fr
            )
        );

    gap: 20px;

}

.form-group {

    width: 100%;

}

.full-width {

    grid-column:
        1 / -1;

}

label {

    display: block;

    margin-bottom: 8px;

    font-size: 13px;

    font-weight: 700;

    color: #334155;

}

input,
select {

    width: 100%;

    min-height: 48px;

    padding:
        12px 14px;

    border:
        1px solid
        var(--border);

    border-radius: 12px;

    background: white;

    font-size: 14px;

    outline: none;

    transition: 0.2s;

}

input:focus,
select:focus {

    border-color:
        var(--primary);

    box-shadow:
        0 0 0 4px
        rgba(
            33,
            150,
            243,
            0.12
        );

}

input[readonly] {

    background: #f8fafc;

    color: #475569;

}


/* =========================
   SEARCH UNIT
========================= */

.unit-search-wrapper {

    position: relative;

    width: 100%;

}

.unit-search-row {

    display: flex;

    gap: 8px;

    align-items: center;

}

#searchUnit {

    flex: 1;

}

.clear-unit-btn {

    width: 48px;

    min-width: 48px;

    height: 48px;

    border: 1px solid var(--border);

    border-radius: 12px;

    background: #f8fafc;

    color: #64748b;

    cursor: pointer;

    font-size: 18px;

    font-weight: bold;

    transition: 0.2s;

}

.clear-unit-btn:hover {

    background: #fee2e2;

    color: #dc2626;

    border-color: #fecaca;

}

.unit-dropdown {

    position: absolute;

    z-index: 9999;

    left: 0;

    right: 0;

    top: calc(100% + 6px);

    background: white;

    border: 1px solid var(--border);

    border-radius: 14px;

    box-shadow:
        0 12px 35px
        rgba(
            15,
            23,
            42,
            0.15
        );

    max-height: 300px;

    overflow-y: auto;

    display: none;

}

.unit-dropdown.show {

    display: block;

}

.unit-option {

    padding:
        12px 14px;

    border-bottom:
        1px solid #eef2f7;

    cursor: pointer;

    transition: 0.15s;

}

.unit-option:last-child {

    border-bottom: none;

}

.unit-option:hover {

    background:
        #eff6ff;

}

.unit-option-plat {

    font-weight: 700;

    color:
        #1d4ed8;

    font-size: 14px;

}

.unit-option-name {

    margin-top: 3px;

    color:
        #475569;

    font-size: 13px;

}

.unit-option-id {

    margin-top: 2px;

    color:
        #94a3b8;

    font-size: 11px;

}

.unit-empty {

    padding: 16px;

    text-align: center;

    color:
        var(--muted);

    font-size: 13px;

}

.unit-loading {

    padding: 16px;

    text-align: center;

    color:
        var(--muted);

    font-size: 13px;

}


/* =========================
   INFO DURASI
========================= */

.durasi-info {

    display: none;

    margin-top: 10px;

    padding:
        12px 15px;

    border-radius: 10px;

    background: #eff6ff;

    color: #1d4ed8;

    font-size: 13px;

    font-weight: 600;

}

.durasi-info.active {

    display: block;

}

.durasi-info.error {

    background: #fef2f2;

    color: #dc2626;

}


/* =========================
   SISA INFO
========================= */

.sisa-info {

    display: none;

    margin-top: 10px;

    padding:
        12px 15px;

    border-radius: 10px;

    font-size: 14px;

    font-weight: 700;

}

.sisa-info.active {

    display: block;

}

.sisa-lunas {

    background: #dcfce7;

    color: #15803d;

}

.sisa-kurang {

    background: #fef3c7;

    color: #92400e;

}

.sisa-lebih {

    background: #dbeafe;

    color: #1d4ed8;

}


/* =========================
   PREVIEW FOTO
========================= */

.preview-container {

    margin-top: 10px;

    text-align: center;

}

#previewFoto {

    display: none;

    width: 100%;

    max-height: 280px;

    object-fit: contain;

    border-radius: 15px;

    border:
        2px dashed
        var(--primary);

    padding: 8px;

}

#uploadStatus {

    min-height: 20px;

    margin-top: 10px;

    font-size: 13px;

    color: var(--muted);

}

.preview-gallery {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(
                140px,
                1fr
            )
        );

    gap: 12px;

    margin-top: 12px;

}

.preview-gallery img {

    width: 100%;

    height: 140px;

    object-fit: cover;

    border-radius: 12px;

    border:
        2px dashed
        var(--primary);

    padding: 4px;

}

#uploadStatusPengambilan {

    min-height: 20px;

    margin-top: 10px;

    font-size: 13px;

    color: var(--muted);

}


/* =========================
   BUTTON
========================= */

.action-area {

    margin-top: 30px;

}

#btnProses {

    width: 100%;

    min-height: 52px;

    border: none;

    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--secondary)
        );

    color: white;

    font-size: 16px;

    font-weight: 700;

    cursor: pointer;

    transition: 0.2s;

    box-shadow:
        0 8px 20px
        rgba(
            33,
            150,
            243,
            0.25
        );

}

#btnProses:hover {

    transform:
        translateY(-2px);

    box-shadow:
        0 12px 25px
        rgba(
            33,
            150,
            243,
            0.35
        );

}

#btnProses:disabled {

    opacity: 0.7;

    cursor:
        not-allowed;

    transform: none;

}

.link-kembali {

    display: block;

    text-align: center;

    margin-top: 20px;

    text-decoration: none;

    color: var(--muted);

    font-size: 14px;

    font-weight: 600;

}

   MOBILE

    }

    input,

        min-height: 50px;

        font-size: 16px;

    }

    .clear-unit-btn {

        height: 50px;

    }

}

.signature-box{width:100%}

}

</style>

</head>

        <div class="form-group">

                Total Biaya
            </label>

            <input
                type="text"
                id="total"
                readonly
                placeholder="Total akan dihitung otomatis"
            >

        </div>


        <!-- =========================

        ========================== -->

        <div class="form-group">

            <label for="bayar">
                Bayar / DP
            </label>

            <input
                type="text"
                id="bayar"
                inputmode="numeric"
                placeholder="Rp 0"
            >

        </div>


        <!-- =========================
             SISA
        ========================== -->

        <div class="form-group full-width">

            <label for="sisa">
                Sisa Pembayaran
            </label>

            <input
                type="text"
                id="sisa"
                readonly
                placeholder="Rp 0"
            >

            <div
                id="sisaInfo"
                class="sisa-info"
            ></div>

        </div>

        ========================== -->

                Jaminan
            </label>

            <input

                id="jaminan"
                placeholder="Contoh: Motor, dll."
            >

        </div>


        <div class="form-group">

            <label for="fotoJaminan">
                Upload Foto Jaminan
            </label>

            <input
                type="file"
                id="fotoJaminan"
                accept="image/*"
            >

        </div>


        <!-- =========================
             PREVIEW JAMINAN
        ========================== -->

        <div class="form-group full-width">

            <div class="preview-container">

                <img
                    id="previewFoto"
                    alt="Preview Foto Jaminan"
                >

                <div id="uploadStatus"></div>

            </div>

        </div>


        <!-- =========================

        ========================== -->

            <label for="fotoPengambilan">

                <div
                    id="uploadStatusPengambilan"
                ></div>

        </div>

/* =================================
   TANGGAL HARI INI
================================= */

function getTanggalHariIni() {

    const sekarang =
        new Date();

    const tahun =
        sekarang.getFullYear();

    const bulan =
        String(
            sekarang.getMonth() + 1
        ).padStart(
            2,
            "0"
        );

    const hari =
        String(
            sekarang.getDate()
        ).padStart(
            2,
            "0"
        );

    return (
        tahun +
        "-" +
        bulan +
        "-" +
        hari
    );

}


const tanggalHariIni =
    getTanggalHariIni();

tanggalSewaInput.min =
    tanggalHariIni;

selesaiSewaInput.min =

/* =================================
   FORMAT TANGGAL INPUT
================================= */

function formatTanggalInput() {

    const sekarang =
        new Date();

    const tanggal =
        String(
            sekarang.getDate()
        ).padStart(
            2,
            "0"
        );

    const bulan =
        String(
            sekarang.getMonth() + 1
        ).padStart(
            2,
            "0"
        );

    const tahun =
        sekarang.getFullYear();

    const jam =
        String(
            sekarang.getHours()
        ).padStart(
            2,
            "0"
        );

    const menit =
        String(
            sekarang.getMinutes()
        ).padStart(
            2,
            "0"
        );

    const detik =
        String(
            sekarang.getSeconds()
        ).padStart(
            2,
            "0"
        );

    return (
        tanggal +
        "/" +
        bulan +
        "/" +
        tahun +
        " " +
        jam +
        ":" +
        menit +
        ":" +
        detik
    );

}


/* =================================
   FORMAT RUPIAH
================================= */

function formatRupiah(
    angka
) {

    const nilai =
        Number(angka) || 0;

    return (
        "Rp " +
        nilai.toLocaleString(
            "id-ID"
        )
    );

}


/* =================================
   FORMAT SISA
================================= */

function formatSisaPembayaran(
    nilai
) {

    if (
        nilai === 0
    ) {

        return "0";

    }

    if (
        nilai > 0
    ) {

        return (
            "+ " +
            formatRupiah(
                nilai
            )
        );

    }

    return (
        "- " +
        formatRupiah(
            Math.abs(
                nilai
            )
        )
    );

}


/* =================================
   AMBIL ANGKA
================================= */

function angkaDariRupiah(
    nilai
) {

    return Number(

        String(
            nilai || ""
        )
        .replace(
            /\D/g,
            ""
        )

    ) || 0;

}


/* =================================
   RENDER DROPDOWN UNIT
================================= */

function tampilkanUnit(
    keyword = ""
) {

    unitDropdown.innerHTML =
        "";

    const teks =
        keyword
        .trim()
        .toLowerCase();


    const entries =
        Object.entries(
            daftarUnit
        );


    const hasil =
        entries.filter(

            function(
                [
                    id,
                    unit
                ]
            ) {

                const idText =
                    String(
                        id || ""
                    )
                    .toLowerCase();

                const platText =
                    String(
                        unit?.plat || ""
                    )
                    .toLowerCase();

                const namaText =
                    String(
                        unit?.nama || ""
                    )
                    .toLowerCase();

                return (
                    !teks ||
                    idText.includes(teks) ||
                    platText.includes(teks) ||
                    namaText.includes(teks)
                );

            }

        );


    if (
        !hasil.length
    ) {

        unitDropdown.innerHTML =
            `
            <div class="unit-empty">
                Tidak ada unit yang cocok dengan pencarian.
            </div>
            `;

        unitDropdown.classList.add(
            "show"
        );

        return;

    }


    hasil.forEach(

        function(
            [
                id,
                unit
            ]
        ) {

            const option =
                document.createElement(
                    "div"
                );

            option.className =
                "unit-option";


            const plat =
                unit?.plat ||
                id;

            const nama =
                unit?.nama ||
                "Tanpa Nama";


            option.innerHTML =
                `
                <div class="unit-option-plat">
                    ${escapeHTML(plat)}
                </div>

                <div class="unit-option-name">
                    ${escapeHTML(nama)}
                </div>

                <div class="unit-option-id">
                    ID Unit: ${escapeHTML(id)}
                </div>
                `;


            option.addEventListener(
                "click",
                function() {

                    pilihUnit(
                        id
                    );

                }
            );


            unitDropdown.appendChild(
                option
            );

        }

    );


    unitDropdown.classList.add(
        "show"
    );

}


/* =================================
   ESCAPE HTML
================================= */

function escapeHTML(
    value
) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}

    totalInput.value =

    bayarInput.value =

    sisaInput.value =

}

/* =================================
   TANDA TANGAN DIGITAL
================================= */

let signatureCtx = null;
let signatureDrawing = false;
let signatureHasInk = false;

function setupSignaturePad() {
    if (!signaturePad) return;

    const ratio = Math.max(window.devicePixelRatio || 1, 1);
    const rect = signatureWrapper.getBoundingClientRect();

    signaturePad.width = Math.round(rect.width * ratio);
    signaturePad.height = Math.round(rect.height * ratio);

    signatureCtx = signaturePad.getContext("2d");
    signatureCtx.setTransform(ratio, 0, 0, ratio, 0, 0);
    signatureCtx.lineWidth = 2.5;
    signatureCtx.lineCap = "round";
    signatureCtx.lineJoin = "round";
    signatureCtx.strokeStyle = "#111827";
    signatureCtx.clearRect(0, 0, rect.width, rect.height);

    signatureHasInk = false;
    signatureDrawing = false;

    signaturePlaceholder.style.display = "block";
    signatureStatus.textContent = "Tanda tangan wajib diisi.";
}

function getSignaturePoint(event) {
    const rect = signaturePad.getBoundingClientRect();
    return {
        x: event.clientX - rect.left,
        y: event.clientY - rect.top
    };
}

signaturePad.addEventListener("pointerdown", function(event) {
    event.preventDefault();
    signatureDrawing = true;
    signatureHasInk = true;
    signaturePad.setPointerCapture(event.pointerId);

    const point = getSignaturePoint(event);
    signatureCtx.beginPath();
    signatureCtx.moveTo(point.x, point.y);

    signaturePlaceholder.style.display = "none";
    signatureStatus.textContent = "✓ Tanda tangan sudah diisi.";
});

signaturePad.addEventListener("pointermove", function(event) {
    if (!signatureDrawing) return;
    event.preventDefault();

    const point = getSignaturePoint(event);
    signatureCtx.lineTo(point.x, point.y);
    signatureCtx.stroke();
});

function stopSignatureDrawing() {
    signatureDrawing = false;
}

signaturePad.addEventListener("pointerup", stopSignatureDrawing);
signaturePad.addEventListener("pointercancel", stopSignatureDrawing);

btnClearSignature.addEventListener("click", function() {
    setupSignaturePad();
});

window.addEventListener("resize", function() {
    if (!signatureHasInk) setupSignaturePad();
});

setupSignaturePad();

async function uploadTandaTangan() {
    if (!signatureHasInk) {
        return { url: "", publicId: "" };
    }

    signatureStatus.textContent = "Mengupload tanda tangan...";

    const blob = await new Promise(function(resolve) {
        signaturePad.toBlob(resolve, "image/png");
    });

    if (!blob) {
        throw new Error("Gagal membuat file tanda tangan.");
    }

    const formData = new FormData();
    formData.append("file", blob, "tanda_tangan.png");
    formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
    formData.append("folder", "arctrans/tanda-tangan");
    formData.append("public_id", "TTD_" + Date.now());

    const response = await fetch(
        "https://api.cloudinary.com/v1_1/" +
        CLOUDINARY_CLOUD_NAME +
        "/image/upload",
        {
            method: "POST",
            body: formData
        }
    );

    const hasil = await response.json();

    if (!response.ok) {
        throw new Error(
            hasil.error?.message || "Gagal upload tanda tangan."
        );
    }

    signatureStatus.textContent =
        "✓ Tanda tangan berhasil diupload.";

    return {
        url: hasil.secure_url,
        publicId: hasil.public_id
    };
}

/* =================================
   HITUNG JUMLAH HARI
================================= */

function hitungJumlahHari() {

    const tanggalSewa =
        tanggalSewaInput.value;

    const selesaiSewa =
        selesaiSewaInput.value;


    if (
        !tanggalSewa ||
        !selesaiSewa
    ) {

        return 0;

    }


    const mulai =
        new Date(
            tanggalSewa +
            "T00:00:00"
        );


    const selesai =
        new Date(
            selesaiSewa +
            "T00:00:00"
        );


    const selisih =
        selesai -
        mulai;


    return Math.ceil(

        selisih /
        (
            1000 *
            60 *
            60 *
            24
        )

    );

}


/* =================================
   DURASI INFO
================================= */

function updateDurasiInfo() {

    const tanggalSewa =
        tanggalSewaInput.value;

    const selesaiSewa =
        selesaiSewaInput.value;


    if (
        !tanggalSewa ||
        !selesaiSewa
    ) {

        durasiInfo.className =
            "durasi-info";

        durasiInfo.textContent =
            "";

        return;

    }


    const jumlahHari =
        hitungJumlahHari();


    if (
        jumlahHari < 0
    ) {

        durasiInfo.className =
            "durasi-info active error";

        durasiInfo.textContent =
            "⚠ Estimasi tanggal selesai tidak boleh sebelum tanggal sewa.";

        return;

    }


    if (
        rentalTypeInput.value ===
        "setengahhari"
    ) {

        durasiInfo.className =
            "durasi-info active";

        durasiInfo.textContent =
            "🕒 Durasi sewa: Setengah Hari";

        return;

    }


    durasiInfo.className =
        "durasi-info active";


    durasiInfo.textContent =
        "📅 Durasi sewa: " +
        jumlahHari +
        " hari";

}


/* =================================
   TANGGAL SEWA
================================= */

tanggalSewaInput.addEventListener(

    "change",

    function() {

        const tanggalDipilih =
            this.value;

        const hariIni =
            getTanggalHariIni();


        if (
            tanggalDipilih &&
            tanggalDipilih < hariIni
        ) {

            alert(
                "Tanggal sewa tidak boleh sebelum hari ini!"
            );

            this.value =
                "";

            selesaiSewaInput.value =
                "";

            return;

        }


        selesaiSewaInput.min =
            tanggalDipilih ||
            hariIni;


        if (
            selesaiSewaInput.value &&
            selesaiSewaInput.value <
            tanggalDipilih
        ) {

            selesaiSewaInput.value =
                "";

        }


        updateDurasiInfo();

        hitungTotal();

    }

);

            );

            this.value =
                "";

            return;

        ) {

            );

            this.value =

            return;

        }

        hitungTotal();

    }

);

/* =================================
   HITUNG TOTAL
================================= */

function hitungTotal() {

    const harga =
        angkaDariRupiah(
            hargaInput.value
        );


    const rentalType =
        rentalTypeInput.value;


    const jumlahHari =
        hitungJumlahHari();


    if (
        rentalType ===
        "setengahhari"
    ) {

        totalInput.readOnly =
            false;

        totalInput.placeholder =
            "Input total biaya manual";

        hitungSisa();

        return;

    }


    totalInput.readOnly =
        true;

    totalInput.placeholder =
        "Total dihitung otomatis";


    if (
        harga <= 0 ||
        !rentalType ||
        jumlahHari <= 0
    ) {

        totalInput.value =
            "";

        hitungSisa();

        return;

    }


    let jumlahPeriode =
        0;


    if (
        rentalType ===
        "harian"
    ) {

        jumlahPeriode =
            jumlahHari;

    }

    else if (
        rentalType ===
        "mingguan"
    ) {

        jumlahPeriode =
            Math.ceil(
                jumlahHari / 7
            );

    }

    else if (
        rentalType ===
        "bulanan"
    ) {

        jumlahPeriode =
            Math.ceil(
                jumlahHari / 30
            );

    }


    const total =
        harga *
        jumlahPeriode;


    totalInput.value =
        formatRupiah(
            total
        );


    hitungSisa();

}


/* =================================
   HITUNG SISA
================================= */

function hitungSisa() {

    const total =
        angkaDariRupiah(
            totalInput.value
        );


    const bayar =
        angkaDariRupiah(
            bayarInput.value
        );


    sisaInfo.className =
        "sisa-info";


    if (
        total <= 0
    ) {

        sisaInput.value =
            "";

        sisaInfo.textContent =
            "";

        return;

    }


    if (
        bayar === total
    ) {

        sisaInput.value =
            "0";

        sisaInfo.className =
            "sisa-info active sisa-lunas";

        sisaInfo.textContent =
            "✓ Pembayaran LUNAS";

        return;

    }


    if (
        bayar > total
    ) {

        const lebihBayar =
            bayar -
            total;


        sisaInput.value =
            "+ " +
            formatRupiah(
                lebihBayar
            );


        sisaInfo.className =
            "sisa-info active sisa-lebih";


        sisaInfo.textContent =
            "＋ Kelebihan pembayaran: " +
            formatRupiah(
                lebihBayar
            );

        return;

    }


    const sisa =
        total -
        bayar;


    sisaInput.value =
        "- " +
        formatRupiah(
            sisa
        );


    sisaInfo.className =
        "sisa-info active sisa-kurang";


    sisaInfo.textContent =
        "Sisa pembayaran: " +
        formatRupiah(
            sisa
        );

}

            durasiInfo.className =
                "durasi-info active";

        }

        else {

            totalInput.value =
                "";

            totalInput.readOnly =
                true;

            totalInput.placeholder =
                "Total dihitung otomatis";


            updateDurasiInfo();

        }


        hitungTotal();

    }

);


/* =================================
   UPLOAD FOTO JAMINAN
================================= */

async function uploadFotoJaminan() {

    const file =
        fotoJaminanInput.files[0];


    if (
        !file
    ) {

        return {

            url: "",
            publicId: ""

        };

    }


    uploadStatus.textContent =
        "Mengupload foto jaminan...";


    const formData =
        new FormData();


    formData.append(
        "file",
        file
    );


    formData.append(
        "upload_preset",
        CLOUDINARY_UPLOAD_PRESET
    );


    formData.append(
        "folder",
        "arctrans/jaminan"
    );


    formData.append(
        "public_id",
        "JAMINAN_" +
        Date.now()
    );


    const response =
        await fetch(

            "https://api.cloudinary.com/v1_1/" +
            CLOUDINARY_CLOUD_NAME +
            "/image/upload",

            {
                method:
                    "POST",

                body:
                    formData

            }

        );


    const hasil =
        await response.json();


    if (
        !response.ok
    ) {

        throw new Error(

            hasil.error?.message ||
            "Gagal upload foto"

        );

    }


    uploadStatus.textContent =
        "✓ Foto berhasil diupload";


    return {

        url:
            hasil.secure_url,

        publicId:
            hasil.public_id

    };

}


/* =================================
   UPLOAD DOKUMENTASI
================================= */

async function uploadFotoPengambilan() {

    const files =
        Array.from(
            fotoPengambilanInput.files
        );


    if (
        !files.length
    ) {

        return [];

    }


    uploadStatusPengambilan.textContent =
        "Mengupload dokumentasi pengambilan unit...";


    const hasilUpload =
        [];


    for (
        let i = 0;
        i < files.length;
        i++
    ) {

        const file =
            files[i];


        if (
            !file.type.startsWith(
                "image/"
            )
        ) {

            throw new Error(
                "File dokumentasi harus berupa gambar!"
            );

        }


        uploadStatusPengambilan.textContent =
            "Mengupload foto " +
            (i + 1) +
            " dari " +
            files.length +
            "...";


        const formData =
            new FormData();


        formData.append(
            "file",
            file
        );


        formData.append(
            "upload_preset",
            CLOUDINARY_UPLOAD_PRESET
        );


        formData.append(
            "folder",
            "arctrans/pengambilan-unit"
        );


        formData.append(
            "public_id",
            "PENGAMBILAN_" +
            Date.now() +
            "_" +
            i
        );


        const response =
            await fetch(

                "https://api.cloudinary.com/v1_1/" +
                CLOUDINARY_CLOUD_NAME +
                "/image/upload",

                {
                    method:
                        "POST",

                    body:
                        formData
                }

            );


        const hasil =
            await response.json();


        if (
            !response.ok
        ) {

            throw new Error(

                hasil.error?.message ||
                "Gagal upload dokumentasi pengambilan unit"

            );

        }


        hasilUpload.push({

            url:
                hasil.secure_url,

            publicId:
                hasil.public_id

        });

    }


    uploadStatusPengambilan.textContent =
        "✓ " +
        hasilUpload.length +
        " foto dokumentasi berhasil diupload";


    return hasilUpload;

}


/* =================================
   TOMBOL PROSES
================================= */

btnProses.addEventListener(

    "click",

    kirimData

);


/* =================================
   SIMPAN DATA RENT OUT
================================= */

async function kirimData() {


    const unitId =
        platInput.value;


    const unit =
        daftarUnit[unitId];


    const idcustomer =
        idCustomerInput.value;


    const dataCustomer =
        daftarCustomer[idcustomer];


    const nama =
        namaInput.value.trim();


    const customer =
        customerInput.value.trim();


    const rentaltype =
        rentalTypeInput.value;


    const harga =
        angkaDariRupiah(
            hargaInput.value
        );


    const tanggalsewa =
        tanggalSewaInput.value;


    const selesaisewa =
        selesaiSewaInput.value;


    const total =
        angkaDariRupiah(
            totalInput.value
        );


    const bayar =
        angkaDariRupiah(
            bayarInput.value
        );


    const jaminan =
        jaminanInput.value.trim();


    const foto =
        fotoJaminanInput.files[0];


    const fotoPengambilan =
        fotoPengambilanInput.files;

    const tandaTanganAda =
        signatureHasInk;


    const hariIni =
        getTanggalHariIni();


    /* =================================
       VALIDASI
    ================================= */

    if (
        !unitId
    ) {

        alert(
            "Pilih ID Unit / Plat Nomor!"
        );

        return;

    }


    /*
       VALIDASI TAMBAHAN:
       memastikan unit masih berada
       di node READY
    */

    if (
        !unit
    ) {

        alert(
            "UNIT TIDAK TERSEDIA.\n\n" +
            "Unit yang dipilih sudah tidak berada di READY."
        );

        return;

    }


    if (
        !idcustomer
    ) {

        alert(
            "Pilih ID Customer!"
        );

        return;

    }


    if (
        !rentaltype
    ) {

        alert(
            "Pilih Rental Type!"
        );

        return;

    }


    if (
        harga <= 0
    ) {

        alert(
            "Harga harus diisi!"
        );

        return;

    }


    if (
        !tanggalsewa
    ) {

        alert(
            "Pilih Tanggal Sewa!"
        );

        return;

    }


    if (
        tanggalsewa <
        hariIni
    ) {

        alert(
            "Tanggal sewa tidak boleh lebih kecil dari tanggal hari ini!"
        );

        return;

    }


    if (
        !selesaisewa
    ) {

        alert(
            "Pilih Estimasi Tanggal Selesai!"
        );

        return;

    }


    if (
        rentaltype !==
        "setengahhari"
    ) {

        if (
            selesaisewa <=
            tanggalsewa
        ) {

            alert(
                "Tanggal selesai harus lebih besar dari tanggal sewa!"
            );

            return;

        }

    }


    if (
        total <= 0
    ) {

        alert(
            "Total biaya belum valid!"
        );

        return;

    }


    if (
        !jaminan
    ) {

        alert(
            "Data jaminan wajib diisi!"
        );

        return;

    }


    if (
        !foto
    ) {

        alert(
            "Foto jaminan wajib diupload!"
        );

        return;

    }


    if (
        !fotoPengambilan ||
        fotoPengambilan.length === 0
    ) {

        alert(
            "Dokumentasi pengambilan unit wajib diupload!"
        );

        return;

    }


    if (!tandaTanganAda) {

        alert(
            "Tanda tangan konsumen wajib diisi!"
        );

        signatureWrapper.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

        return;

    }


    /* =================================
       HITUNG SISA
    ================================= */

    let sisa =
        0;


    let kelebihanBayar =
        0;


    if (
        bayar < total
    ) {

        sisa =
            -(
                total -
                bayar
            );

    }

    else if (
        bayar === total
    ) {

        sisa =
            0;

    }

    else {

        kelebihanBayar =
            bayar -
            total;

        sisa =
            kelebihanBayar;

    }


    /* =================================
       DISABLE BUTTON
    ================================= */

    btnProses.disabled =
        true;


    btnProses.textContent =
        "Mengupload Foto...";


    try {


        /* =================================
           UPLOAD JAMINAN
        ================================= */

        const hasilUpload =
            await uploadFotoJaminan();


        /* =================================
           UPLOAD DOKUMENTASI
        ================================= */

        btnProses.textContent =
            "Mengupload Dokumentasi Unit...";


        const hasilUploadPengambilan =
            await uploadFotoPengambilan();


        /* =================================
           UPLOAD TANDA TANGAN
        ================================= */

        btnProses.textContent =
            "Mengupload Tanda Tangan...";

        const hasilUploadTandaTangan =
            await uploadTandaTangan();


        /* =================================
           ID TRANSAKSI
        ================================= */

        btnProses.textContent =
            "Menyimpan Data...";


        const transaksiId =
            "RENT_" +
            Date.now();


        /* =================================
           JUMLAH HARI
        ================================= */

        let jumlahHari =
            hitungJumlahHari();


        if (
            rentaltype ===
            "setengahhari"
        ) {

            jumlahHari =
                0.5;

        }


        /* =================================
           STATUS PEMBAYARAN
        ================================= */

        let statusPembayaran =
            "BELUM LUNAS";


        if (
            bayar === total
        ) {

            statusPembayaran =
                "LUNAS";

        }

        else if (
            bayar > total
        ) {

            statusPembayaran =
                "LEBIH BAYAR";

        }


        /* =================================
           DATA RENT OUT
        ================================= */

        const dataRent = {

            transaksiId:
                transaksiId,


            /* UNIT */

            unitId:
                unitId,

            plat:
                unit?.plat ||
                unitId,

            namaUnit:
                nama,


            /* CUSTOMER */

            idcustomer:
                idcustomer,

            nik:
                dataCustomer?.nik ||
                idcustomer,

            customer:
                customer,

            alamatktp:
                dataCustomer?.alamatktp ||
                "",

            hp:
                dataCustomer?.hp ||
                "",


            /* RENTAL */

            rentaltype:
                rentaltype,

            harga:
                harga,

            hargaFormat:
                formatRupiah(
                    harga
                ),

            tanggalsewa:
                tanggalsewa,

            selesaisewa:
                selesaisewa,

            jumlahHari:
                jumlahHari,

            total:
                total,

            totalFormat:
                formatRupiah(
                    total
                ),

            bayar:
                bayar,

            bayarFormat:
                formatRupiah(
                    bayar
                ),


            /* SISA */

            sisa:
                sisa,

            sisaFormat:
                formatSisaPembayaran(
                    sisa
                ),


            /* KELEBIHAN */

            kelebihanBayar:
                kelebihanBayar,

            kelebihanBayarFormat:
                formatRupiah(
                    kelebihanBayar
                ),


            /* STATUS */

            statusPembayaran:
                statusPembayaran,


            /* JAMINAN */

            jaminan:
                jaminan,

            fotoJaminan:
                hasilUpload.url,

            fotoJaminanPublicId:
                hasilUpload.publicId,


            /* DOKUMENTASI */

            fotoPengambilan:
                hasilUploadPengambilan,


            /* TANDA TANGAN KONSUMEN */

            tandaTangan:
                hasilUploadTandaTangan.url,

            tandaTanganPublicId:
                hasilUploadTandaTangan.publicId,


            /* STATUS */

            status:
                "RENT OUT",


            /* TIMESTAMP */

            timestamp:
                Date.now(),


            /* TANGGAL INPUT */

            tanggalInput:
                formatTanggalInput()

        };


        /* =================================
           SIMPAN RENTOUT
        ================================= */

        await set(

            ref(
                db,
                "rentout/" +
                transaksiId
            ),

            dataRent

        );


        /* =================================
           DATA REVENUE
        ================================= */

        const tanggalRevenue =
            getTanggalHariIni();


        const dataRevenue = {

            ...dataRent,

            keterangan:
                "DP Mobil - " +

                (
                    unit?.plat ||
                    unitId
                )

                +

                " - " +

                (
                    nama ||
                    unit?.nama ||
                    "Tanpa Nama"
                )

        };


        /* =================================
           SIMPAN REVENUE
        ================================= */

        await set(

            ref(

                db,

                "revenue/" +
                tanggalRevenue +
                "/" +
                transaksiId

            ),

            dataRevenue

        );


        /* =================================
           HAPUS UNIT DARI READY
        ================================= */

        await remove(

            ref(

                db,

                "ready/" +
                unitId

            )

        );


        /* =================================
           UPDATE UNIT = OUT
        ================================= */

        await update(

            ref(

                db,

                "unit/" +
                unitId

            ),

            {

                keterangan:
                    "Out"

            }

        );


        /* =================================
           BERHASIL
        ================================= */

        uploadStatus.textContent =
            "✓ Data berhasil disimpan";


        alert(

            "Data RENT OUT berhasil disimpan!\n\n" +

            "ID Transaksi: " +
            transaksiId +

            "\n\n" +

            "Tanggal Input: " +
            dataRent.tanggalInput +

            "\n\n" +

            "Sisa Pembayaran: " +
            formatSisaPembayaran(
                sisa
            ) +

            "\n\n" +

            "Unit telah dihapus dari READY\n" +

            "Status unit diubah menjadi OUT\n" +

            "Data revenue berhasil dibuat."

        );


        /* =================================
           PINDAH HALAMAN
        ================================= */

        window.location.href =
            "tabeloutrent.html";


    }

    catch (
        error
    ) {

        console.error(
            "ERROR:",
            error
        );


        uploadStatus.textContent =
            "Error: " +
            error.message;


        alert(

            "Gagal menyimpan data:\n\n" +
            error.message

        );

    }

    finally {

        btnProses.disabled =
            false;

        btnProses.textContent =
            "Proses Rent Out";

    }

}

</script>
