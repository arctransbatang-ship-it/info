    <style>
        * {
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        :root {
            --primary: #2196F3;
            --primary-dark: #1565C0;
            --cyan: #21CBF3;
            --text: #263238;
            --muted: #78909C;
            --border: #e6edf3;
        }

        html {
            min-height: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                linear-gradient(
                    135deg,
                    #0f4c81 0%,
                    #2196F3 45%,
                    #21CBF3 100%
                );
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: rgba(255,255,255,0.12);
            top: -100px;
            left: -100px;
            filter: blur(2px);
            pointer-events: none;
        }

        body::after {
            content: "";
            position: fixed;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: rgba(255,255,255,0.10);
            bottom: -150px;
            right: -100px;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 980px;
            padding: 40px;
            background: rgba(255,255,255,0.97);
            border-radius: 28px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.25);
            animation: fadeIn .6s ease;
        }

        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin-bottom: 35px;
        }

        /* =========================================================
           LOGO ARC TRANS
           Menggunakan logo_arc.png baru
           ========================================================= */
        .logo {
            width: 110px;
            height: 110px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 16px;
            border-radius: 28px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 12px 25px rgba(33,150,243,0.35);
            border: 1px solid rgba(33,150,243,0.12);
            animation: floatLogo 3s ease-in-out infinite;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: #fff;
        }

        h1 {
            margin: 0;
            font-size: clamp(26px, 5vw, 38px);
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--primary-dark);
        }

        .subtitle {
            margin-top: 8px;
            color: var(--muted);
            font-size: clamp(13px, 3vw, 16px);
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px;
        }

        .menu-item {
            position: relative;
            min-height: 185px;
            padding: 22px 15px;
            text-decoration: none;
            color: var(--text);
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 22px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
            transition:
                transform .25s ease,
                box-shadow .25s ease,
                border-color .25s ease,
                background .25s ease;
        }

        .menu-item:hover {
            transform: translateY(-7px);
            border-color: var(--primary);
            background: #f7fbff;
            box-shadow: 0 15px 30px rgba(33,150,243,0.20);
        }

        .menu-item:active {
            transform: scale(.98);
        }

        .menu-item::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--cyan));
            transform: scaleX(0);
            transform-origin: center;
            transition: .25s ease;
        }

        .menu-item:hover::before {
            transform: scaleX(1);
        }

        .menu-icon {
            width: 78px;
            height: 78px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 16px;
            border-radius: 24px;
            font-size: 38px;
            background: linear-gradient(135deg, #e3f2fd, #f1fbff);
            transition: transform .25s ease, background .25s ease;
        }

        .menu-item:hover .menu-icon {
            transform: scale(1.12) rotate(3deg);
            background: linear-gradient(135deg, #d7efff, #e8faff);
        }

        .menu-text {
            font-size: clamp(13px, 2vw, 16px);
            font-weight: 700;
            line-height: 1.5;
        }

        .footer {
            margin-top: 32px;
            padding-top: 22px;
            border-top: 1px solid #edf0f2;
            text-align: center;
            color: #90A4AE;
            font-size: 13px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes floatLogo {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-7px);
            }
        }

        @media (max-width: 850px) {
            .container {
                max-width: 700px;
            }

            .menu {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 14px;
                align-items: flex-start;
            }

            .container {
                margin-top: 10px;
                padding: 28px 16px 20px;
                border-radius: 24px;
            }

            .header {
                margin-bottom: 25px;
            }

            .logo {
                width: 88px;
                height: 88px;
                border-radius: 23px;
            }

            .menu {
                gap: 12px;
            }

            .menu-item {
                min-height: 155px;
                padding: 16px 10px;
                border-radius: 18px;
            }

            .menu-icon {
                width: 65px;
                height: 65px;
                border-radius: 20px;
                font-size: 32px;
                margin-bottom: 10px;
            }

            .footer {
                margin-top: 24px;
                padding-top: 18px;
            }
        }

        @media (max-width: 380px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 22px 12px 18px;
            }

            .menu {
                gap: 10px;
            }

            .menu-item {
                min-height: 140px;
                padding: 12px 6px;
            }

            .menu-icon {
                width: 58px;
                height: 58px;
                font-size: 28px;
            }

            .menu-text {
                font-size: 12px;
            }
        }
    </style>
</head>
