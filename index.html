<link

<style>

/* =========================================================
   GLOBAL
   ========================================================= */

* {
    box-sizing: border-box;

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;
}


html,
body {
    margin: 0;

    padding: 0;

    min-height: 100%;
}


body {

    min-height: 100vh;

    padding: 20px;

    display: flex;

    justify-content: center;

    align-items: center;

    background:
        linear-gradient(
            135deg,
            #0f4c81 0%,
            #2196F3 50%,
            #21CBF3 100%
        );

    overflow-x: hidden;
}


/* =========================================================
   BACKGROUND DECORATION
   ========================================================= */

body::before {

    content: "";

    position: fixed;

    width: 320px;

    height: 320px;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.12);

    top: -130px;

    left: -130px;

    pointer-events: none;
}


body::after {

    content: "";

    position: fixed;

    width: 380px;

    height: 380px;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.10);

    right: -150px;

    bottom: -170px;

    pointer-events: none;
}


/* =========================================================
   MAIN CONTAINER
   ========================================================= */

.container {

    position: relative;

    z-index: 5;

    width: 100%;

    max-width: 980px;

    padding: 40px;

    background:
        rgba(255,255,255,0.98);

    border-radius: 28px;

    box-shadow:
        0 25px 60px
        rgba(0,0,0,0.25);
}


/* =========================================================
   HEADER
   ========================================================= */

.header {

    text-align: center;

    margin-bottom: 32px;
}


/* =========================================================
   LOGO BUTTON
   ========================================================= */

.logo-button {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    padding: 0;

    margin: 0;

    border: none;

    background: transparent;

    cursor: pointer;

    outline: none;
}


.logo-box {

    width: 125px;

    height: 125px;

    background: #ffffff;

    border-radius: 28px;

    display: flex;

    justify-content: center;

    align-items: center;

    overflow: hidden;

    border:
        1px solid
        rgba(33,150,243,0.20);

    box-shadow:
        0 12px 30px
        rgba(33,150,243,0.30);

    transition:
        transform .25s ease,
        box-shadow .25s ease;
}


.logo-button:hover .logo-box {

    transform:
        scale(1.07);

    box-shadow:
        0 18px 38px
        rgba(33,150,243,0.40);
}


.logo-button:active .logo-box {

    transform:
        scale(.95);
}


/* =========================================================
   LOGO IMAGE
   ========================================================= */

.logo-image {

    width: 100%;

    height: 100%;

    display: block;

    object-fit: contain;

    background: #ffffff;
}


/* =========================================================
   TEXT
   ========================================================= */

.logo-hint {

    margin-top: 10px;

    color:
        #90A4AE;

    font-size: 11px;
}


h1 {

    margin:
        12px 0 0;

    color:
        #1565C0;

    font-size:
        clamp(28px, 5vw, 40px);

    font-weight: 800;

    letter-spacing: 2px;
}


.subtitle {

    margin-top: 7px;

    color:
        #78909C;

    font-size:
        15px;
}


/* =========================================================
   MENU
   ========================================================= */

.menu {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 18px;
}


.menu-item {

    position: relative;

    min-height: 175px;

    padding: 20px 12px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    text-decoration: none;

    color:
        #263238;

    background:
        #ffffff;

    border:
        1px solid
        #e6edf3;

    border-radius: 22px;

    overflow: hidden;

    transition:
        transform .25s ease,
        box-shadow .25s ease,
        border-color .25s ease;
}


.menu-item::before {

    content: "";

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 4px;

    background:
        linear-gradient(
            90deg,
            #2196F3,
            #21CBF3
        );

    transform:
        scaleX(0);

    transition:
        transform .25s ease;
}


.menu-item:hover {

    transform:
        translateY(-6px);

    border-color:
        #2196F3;

    box-shadow:
        0 15px 30px
        rgba(33,150,243,0.20);

    background:
        #f7fbff;
}


.menu-item:hover::before {

    transform:
        scaleX(1);
}


/* =========================================================
   MENU ICON
   ========================================================= */

.menu-icon {

    width: 76px;

    height: 76px;

    display: flex;

    align-items: center;

    justify-content: center;

    margin-bottom: 14px;

    border-radius: 23px;

    font-size: 37px;

    background:
        linear-gradient(
            135deg,
            #e3f2fd,
            #f1fbff
        );

    transition:
        transform .25s ease;
}


.menu-item:hover .menu-icon {

    transform:
        scale(1.10);
}


.menu-text {

    font-size: 15px;

    font-weight: 700;

    line-height: 1.45;
}


/* =========================================================
   FOOTER
   ========================================================= */

.footer {

    margin-top: 30px;

    padding-top: 20px;

    border-top:
        1px solid
        #edf0f2;

    text-align: center;

    color:
        #90A4AE;

    font-size: 13px;
}


/* =========================================================
   MODAL FOTO LOGO
   ========================================================= */

.logo-modal {

    position: fixed;

    top: 0;

    left: 0;

    right: 0;

    bottom: 0;

    z-index: 999999;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background:
        rgba(0,0,0,0.82);
}


/*
   MODAL AKTIF
*/

.logo-modal.active {

    display: flex;
}


/* =========================================================
   MODAL CONTENT
   ========================================================= */

.modal-content {

    position: relative;

    width: 90vw;

    max-width: 700px;

    max-height: 90vh;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;
}


/* =========================================================
   FOTO BESAR
   ========================================================= */

.modal-image {

    display: block;

    width: auto;

    height: auto;

    max-width: 90vw;

    max-height: 78vh;

    object-fit: contain;

    background:
        #ffffff;

    padding: 15px;

    border-radius: 20px;

    box-shadow:
        0 25px 70px
        rgba(0,0,0,0.55);
}


/* =========================================================
   CLOSE BUTTON
   ========================================================= */

.close-button {

    position: absolute;

    top: -18px;

    right: -18px;

    z-index: 10;

    width: 48px;

    height: 48px;

    border: none;

    border-radius: 50%;

    background:
        #ffffff;

    color:
        #263238;

    font-size: 30px;

    line-height: 1;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,0.40);
}


.close-button:hover {

    background:
        #f1f5f9;

    transform:
        scale(1.08);
}


.modal-title {

    margin-top: 14px;

    color:
        #ffffff;

    font-size: 18px;

    font-weight: 700;

    letter-spacing: 1px;
}


/* =========================================================
   TABLET
   ========================================================= */

@media (max-width: 850px) {

    .container {

        max-width: 700px;
    }


    .menu {

        grid-template-columns:
            repeat(2, 1fr);
    }
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {

    body {

        padding: 12px;

        align-items:
            flex-start;
    }


    .container {

        margin-top: 8px;

        padding:
            28px 15px 20px;

        border-radius: 24px;
    }


    .logo-box {

        width: 100px;

        height: 100px;

        border-radius: 23px;
    }


    .menu {

        gap: 12px;
    }


    .menu-item {

        min-height: 145px;

        padding:
            15px 8px;

        border-radius: 18px;
    }


    .menu-icon {

        width: 62px;

        height: 62px;

        border-radius: 19px;

        font-size: 30px;

        margin-bottom: 9px;
    }


    .menu-text {

        font-size: 12px;
    }


    .modal-image {

        max-width: 94vw;

        max-height: 70vh;

        padding: 10px;

        border-radius: 16px;
    }


    .close-button {

        width: 42px;

        height: 42px;

        top: -12px;

        right: -6px;

        font-size: 26px;
    }
}


/* =========================================================
   SMALL MOBILE
   ========================================================= */

@media (max-width: 380px) {

    .container {

        padding:
            22px 11px 17px;
    }


    .menu {

        gap: 9px;
    }


    .menu-item {

        min-height: 135px;
    }


    .menu-icon {

        width: 56px;

        height: 56px;

        font-size: 27px;
    }
}

</style>

</head>

<!-- =========================================================
     JAVASCRIPT
     ========================================================= -->

<script>


/*
=========================================================
URL LOGO
=========================================================
*/

const LOGO_URL =
    "https://res.cloudinary.com/cesiolzm/image/upload/v1788186697/arc_logo_2.png";


/*
=========================================================
ELEMENT
=========================================================
*/

const logoButton =
    document.getElementById("logoButton");

const logoModal =
    document.getElementById("logoModal");

const closeButton =
    document.getElementById("closeButton");

const modalImage =
    document.getElementById("modalImage");


/*
=========================================================
BUKA FOTO
=========================================================
*/

function bukaLogo() {

    modalImage.src =
        LOGO_URL;

    logoModal.classList.add(
        "active"
    );

    document.body.style.overflow =
        "hidden";
}


/*
=========================================================
TUTUP FOTO
=========================================================
*/

function tutupLogo() {

    logoModal.classList.remove(
        "active"
    );

    document.body.style.overflow =
        "";
}


/*
=========================================================
KLIK LOGO
=========================================================
*/

logoButton.addEventListener(
    "click",
    function () {

        bukaLogo();

    }
);


/*
=========================================================
KLIK X
=========================================================
*/

closeButton.addEventListener(
    "click",
    function () {

        tutupLogo();

    }
);


/*
=========================================================
KLIK AREA GELAP
=========================================================
*/

logoModal.addEventListener(
    "click",
    function (event) {

        if (
            event.target === logoModal
        ) {

            tutupLogo();

        }

    }
);


/*
=========================================================
TOMBOL ESC
=========================================================
*/

document.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === "Escape"
        ) {

            tutupLogo();

        }

    }
);


</script>
