<style>

/* =====================================================
   GLOBAL
   ===================================================== */

* {

    box-sizing: border-box;

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

}


html {

    min-height: 100%;

}


body {

    margin: 0;

    min-height: 100vh;

    padding: 20px;

    display: flex;

    justify-content: center;

    align-items: center;

    background:
        linear-gradient(
            135deg,
            #0f4c81 0%,
            #2196F3 45%,
            #21CBF3 100%
        );

    overflow-x: hidden;

    position: relative;

}


/* =====================================================
   BACKGROUND DECORATION
   ===================================================== */

body::before {

    content: "";

    position: fixed;

    width: 300px;

    height: 300px;

    border-radius: 50%;

    background:
        rgba(
            255,
            255,
            255,
            0.12
        );

    top: -100px;

    left: -100px;

    filter: blur(2px);

}


body::after {

    content: "";

    position: fixed;

    width: 350px;

    height: 350px;

    border-radius: 50%;

    background:
        rgba(
            255,
            255,
            255,
            0.10
        );

    bottom: -150px;

    right: -100px;

}


/* =====================================================
   CONTAINER
   ===================================================== */

.container {

    position: relative;

    z-index: 2;

    width: 100%;

    max-width: 980px;

    padding: 40px;

    background:
        rgba(
            255,
            255,
            255,
            0.96
        );

    border-radius: 28px;

    box-shadow:
        0 25px 60px
        rgba(
            0,
            0,
            0,
            0.25
        );

    animation:
        fadeIn
        0.6s
        ease;

}


/* =====================================================
   HEADER
   ===================================================== */

.header {

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    margin-bottom: 35px;

}


/* =====================================================
   LOGO
   ===================================================== */

.logo {

    width: 100px;

    height: 100px;

    display: flex;

    justify-content: center;

    align-items: center;

    margin-bottom: 16px;

    border-radius: 30px;

    overflow: hidden;

    background:
        linear-gradient(
            135deg,
            #2196F3,
            #21CBF3
        );

    box-shadow:
        0 12px 25px
        rgba(
            33,
            150,
            243,
            0.35
        );

    animation:
        floatLogo
        3s
        ease-in-out
        infinite;

}


.logo img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    display: block;

}


/* =====================================================
   TITLE
   ===================================================== */

h1 {

    margin: 0;

    font-size:
        clamp(
            26px,
            5vw,
            38px
        );

    font-weight: 800;

    letter-spacing: 2px;

    color: #1565C0;

}


.subtitle {

    margin-top: 8px;

    color: #78909C;

    font-size:
        clamp(
            13px,
            3vw,
            16px
        );

}


/* =====================================================
   MENU GRID
   ===================================================== */

.menu {

    display: grid;

    grid-template-columns:
        repeat(
            3,
            minmax(
                0,
                1fr
            )
        );

    gap: 18px;

}


/* =====================================================
   MENU ITEM
   ===================================================== */

.menu-item {

    position: relative;

    min-height: 185px;

    padding:
        22px
        15px;

    text-decoration: none;

    color: #263238;

    background: #ffffff;

    border:
        1px solid
        #e6edf3;

    border-radius: 22px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    overflow: hidden;

    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        border-color 0.25s ease,
        background 0.25s ease;

}


/* =====================================================
   HOVER
   ===================================================== */

.menu-item:hover {

    transform:
        translateY(-7px);

    border-color:
        #2196F3;

    background:
        #f7fbff;

    box-shadow:
        0 15px 30px
        rgba(
            33,
            150,
            243,
            0.20
        );

}


.menu-item:active {

    transform:
        scale(0.98);

}


/* =====================================================
   TOP ACCENT
   ===================================================== */

.menu-item::before {

    content: "";

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 4px;

    background:
        linear-gradient(
            90deg,
            #2196F3,
            #21CBF3
        );

    transform:
        scaleX(0);

    transition:
        0.25s ease;

}


.menu-item:hover::before {

    transform:
        scaleX(1);

}


/* =====================================================
   MENU ICON
   ===================================================== */

.menu-icon {

    width: 78px;

    height: 78px;

    display: flex;

    justify-content: center;

    align-items: center;

    margin-bottom: 16px;

    border-radius: 24px;

    font-size: 38px;

    background:
        linear-gradient(
            135deg,
            #e3f2fd,
            #f1fbff
        );

    transition:
        transform 0.25s ease,
        background 0.25s ease;

}


.menu-item:hover .menu-icon {

    transform:
        scale(1.12)
        rotate(3deg);

    background:
        linear-gradient(
            135deg,
            #d7efff,
            #e8faff
        );

}


/* =====================================================
   MENU TEXT
   ===================================================== */

.menu-text {

    font-size:
        clamp(
            13px,
            2vw,
            16px
        );

    font-weight: 700;

    line-height: 1.5;

}


/* =====================================================
   FOOTER
   ===================================================== */

.footer {

    margin-top: 32px;

    padding-top: 22px;

    border-top:
        1px solid
        #edf0f2;

    text-align: center;

    color: #90A4AE;

    font-size: 13px;

}


/* =====================================================
   ANIMATION
   ===================================================== */

@keyframes fadeIn {

    from {

        opacity: 0;

        transform:
            translateY(30px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


@keyframes floatLogo {

    0%,
    100% {

        transform:
            translateY(0);

    }

    50% {

        transform:
            translateY(-7px);

    }

}


/* =====================================================
   TABLET
   ===================================================== */

@media (max-width: 850px) {

    .container {

        max-width: 700px;

    }


    .menu {

        grid-template-columns:
            repeat(
                2,
                1fr
            );

    }

}


/* =====================================================
   MOBILE
   ===================================================== */

@media (max-width: 600px) {

            flex-start;

    }

    }


    .header {

        margin-bottom:

    }


    .logo {

    .menu {

            18px;

    }


    .menu-icon {

        width: 65px;

        border-radius:
            20px;

        font-size:
            32px;

        margin-bottom:
            10px;

    }


    .footer {

        margin-top:
            24px;

        padding-top:
            18px;

    }

}


/* =====================================================
   SMALL MOBILE
   ===================================================== */

@media (max-width: 380px) {

    body {

        padding: 10px;

    }

        padding:
            22px
            12px
            18px;

    }


    .menu-item {

        width: 58px;

        font-size:
            28px;

    }


    .menu-text {

        font-size:
            12px;

    }

}

</style>
