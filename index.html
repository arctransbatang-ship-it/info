<!DOCTYPE html>

<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ARC TRANS</title>


    <style>

        * {
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }


        body {
            margin: 0;

            min-height: 100vh;

            background:

                linear-gradient(

                    135deg,

                    #2196F3 0%,

                    #21CBF3 100%

                );

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;
        }


        /* =========================
           CONTAINER
        ========================= */

        .container {

            width: 100%;

            max-width: 850px;

            background: #ffffff;

            padding: 35px 30px;

            border-radius: 24px;

            box-shadow:

                0 20px 45px

                rgba(0, 0, 0, 0.25);

            text-align: center;

            animation:

                fadeIn 0.5s ease;

        }


        /* =========================
           LOGO
        ========================= */

        .logo {

            width: 95px;

            height: 95px;

            margin: 0 auto 15px;

            border-radius: 50%;

            background:

                linear-gradient(

                    135deg,

                    #2196F3,

                    #21CBF3

                );

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 48px;

            box-shadow:

                0 8px 20px

                rgba(33, 150, 243, 0.35);

        }


        /* =========================
           TITLE
        ========================= */

        h1 {

            margin: 0;

            color: #2196F3;

            font-size: 30px;

            font-weight: 700;

            letter-spacing: 1px;

        }


        .subtitle {

            margin-top: 8px;

            margin-bottom: 32px;

            color: #777;

            font-size: 14px;

        }


        /* =========================
           MENU
        ========================= */

        .menu {

            display: grid;

            grid-template-columns:

                repeat(3, 1fr);

            gap: 15px;

        }


        .menu-item {

            min-height: 160px;

            text-decoration: none;

            color: #333;

            border:

                1px solid

                #e5e7eb;

            border-radius: 18px;

            padding: 20px 12px;

            transition:

                transform 0.25s ease,

                box-shadow 0.25s ease,

                border-color 0.25s ease,

                background 0.25s ease;

            background: #ffffff;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            cursor: pointer;

        }


        .menu-item:hover {

            transform:

                translateY(-6px);

            background:

                #f3f9ff;

            border-color:

                #2196F3;

            box-shadow:

                0 12px 25px

                rgba(

                    33,

                    150,

                    243,

                    0.22

                );

        }


        .menu-icon {

            width: 70px;

            height: 70px;

            margin-bottom: 15px;

            border-radius: 50%;

            background:

                linear-gradient(

                    135deg,

                    #e3f2fd,

                    #f1fbff

                );

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 35px;

        }


        .menu-text {

            font-size: 14px;

            font-weight: 700;

            line-height: 1.4;

        }


        /* =========================
           FOOTER
        ========================= */

        .footer {

            margin-top: 30px;

            padding-top: 20px;

            border-top:

                1px solid #eeeeee;

            color: #999;

            font-size: 12px;

        }


        /* =========================
           ANIMATION
        ========================= */

        @keyframes fadeIn {

            from {

                opacity: 0;

                transform:

                    translateY(20px);

            }


            to {

                opacity: 1;

                transform:

                    translateY(0);

            }

        }


        /* =========================
           TABLET
        ========================= */

        @media (max-width: 700px) {

            .container {

                max-width: 600px;

            }


            .menu {

                grid-template-columns:

                    repeat(2, 1fr);

            }

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 450px) {

            body {

                padding: 12px;

            }


            .container {

                padding:

                    25px 15px;

            }


            h1 {

                font-size: 26px;

            }


            .menu {

                grid-template-columns:

                    1fr;

            }


            .menu-item {

                min-height: auto;

                flex-direction: row;

                justify-content:

                    flex-start;

                text-align: left;

                padding: 15px 18px;

            }


            .menu-icon {

                width: 55px;

                height: 55px;

                min-width: 55px;

                margin-bottom: 0;

                margin-right: 15px;

                font-size: 27px;

            }

        }

    </style>

</head>


<body>


    <div class="container">


        <!-- LOGO -->

        <div class="logo">

            🚐

        </div>


        <!-- JUDUL -->

        <h1>

            ARC TRANS

        </h1>


        <div class="subtitle">

            Sistem Manajemen Unit & Customer

        </div>


        <!-- MENU -->

        <div class="menu">


            <!-- INPUT UNIT -->

            <a

                href="unit.html"

                class="menu-item"

            >

                <div class="menu-icon">

                    🚗

                </div>


                <div class="menu-text">

                    Input Unit

                </div>

            </a>


            <!-- TABEL UNIT KENDARAAN -->

            <a

                href="tabelunit.html"

                class="menu-item"

            >

                <div class="menu-icon">

                    📋

                </div>


                <div class="menu-text">

                    Tabel Unit Kendaraan

                </div>

            </a>


            <!-- INPUT CUSTOMER -->

            <a

                href="customer.html"

                class="menu-item"

            >

                <div class="menu-icon">

                    👤

                </div>


                <div class="menu-text">

                    Input Customer

                </div>

            </a>


            <!-- DATA CUSTOMER -->

            <a

                href="tabelcustomer.html"

                class="menu-item"

            >

                <div class="menu-icon">

                    👥

                </div>


                <div class="menu-text">

                    Data Customer

                </div>

            </a>


            <!-- RENT OUT -->

            <a

                href="outrent.html"

                class="menu-item"

            >

                <div class="menu-icon">

                    📝

                </div>


                <div class="menu-text">

                    RENT OUT

                </div>

            </a>


        </div>


        <!-- FOOTER -->

        <div class="footer">

            © 2026 ARC TRANS

        </div>


    </div>


</body>

</html>
